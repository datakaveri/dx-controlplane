networks:
  dx-dev-net:
    driver: bridge

volumes:
  pg-data:
  kc-db-data:
  rmq-data:
  es-data:

services:

  # ──────────────────────────────────────────────
  # PostgreSQL — Application database
  # ──────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    profiles: [infra, full]
    env_file: dev/.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-iudx_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./dev/init-db.sh:/docker-entrypoint-initdb.d/01-init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-iudx_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dx-dev-net

  # ──────────────────────────────────────────────
  # PostgreSQL for Keycloak (separate instance)
  # ──────────────────────────────────────────────
  kc-db:
    image: postgres:15-alpine
    profiles: [infra, full]
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:-postgres}
    volumes:
      - kc-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dx-dev-net

  # ──────────────────────────────────────────────
  # Keycloak 26 — Identity & Access Management
  # ──────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    profiles: [infra, full]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://kc-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:-postgres}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    command: start-dev --import-realm
    ports:
      - "8180:8080"
    volumes:
      - ./dev/keycloak/realm-iudx.json:/opt/keycloak/data/import/realm-iudx.json
    depends_on:
      kc-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - dx-dev-net

  # ──────────────────────────────────────────────
  # RabbitMQ — Message Broker
  # ──────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management
    profiles: [infra, full]
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rmq-data:/var/lib/rabbitmq
      - ./dev/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
      - ./dev/rabbitmq-definitions.json:/etc/rabbitmq/definitions.json
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - dx-dev-net

  # ──────────────────────────────────────────────
  # Elasticsearch — Search & Indexing
  # ──────────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    profiles: [infra, full]
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks:
      - dx-dev-net

  # ──────────────────────────────────────────────
  # Flyway — Database migrations
  # ──────────────────────────────────────────────
  flyway:
    image: flyway/flyway:9.22
    profiles: [infra, full]
    command: >
      -url=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-iudx_db}
      -user=${POSTGRES_USER:-postgres}
      -password=${POSTGRES_PASSWORD:-postgres}
      -schemas=public
      -placeholders.authUser=${POSTGRES_USER:-postgres}
      -connectRetries=5
      migrate
    volumes:
      - ./src/main/resources/db/migration:/flyway/sql
      - ./dev/flyway-callbacks/beforeEachMigrate.sql:/flyway/sql/beforeEachMigrate.sql
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dx-dev-net

  # ──────────────────────────────────────────────
  # Application (full profile only)
  # ──────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: docker/dev.dockerfile
    profiles: [full]
    environment:
      - AUTH_URL=http://localhost:8080
      - LOG_LEVEL=INFO
      - AUTH_JAVA_OPTS=-Xmx2048m
    ports:
      - "8080:8080"
      - "8444:8444"
      - "9000:9000"
    volumes:
      - ./dev/config-docker.json:/usr/share/app/configs/config.json
      - ./dev/keystore.jks:/usr/share/app/configs/keystore.jks
    depends_on:
      flyway:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    command: >
      bash -c "exec java $$AUTH_JAVA_OPTS
      -Dvertx.logger-delegate-factory-class-name=io.vertx.core.logging.Log4j2LogDelegateFactory
      -jar ./fatjar.jar --host $$(hostname) -c configs/config.json"
    restart: on-failure
    networks:
      - dx-dev-net
