<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
<!--  <title>User Account Status Update</title>-->
  <style>
    body {
      font-family: Arial, sans-serif;
      color: #333333;
      line-height: 1.6;
    }
    .container {
      width: 80%;
      margin: auto;
    }
    .header {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 15px;
    }
    .footer {
      margin-top: 30px;
      font-size: 14px;
      color: #777777;
    }
    a {
      color: #1a73e8;
      text-decoration: none;
    }
  </style>
</head>
<body>
<div class="container">
  <p class="header">User Account Status Update</p>

  <p>Hello ${USER_FIRST_NAME},</p>

  <p>
     Your account ${USER_EMAIL_ID} has been <b>${STATUS}</b> successfully.
  </p>

  <p>
    For more details, please visit:<br/>
    <a href="${ADMIN_PORTAL_URL}">${ADMIN_PORTAL_URL}</a>
  </p>

  <p class="footer">
    Regards,<br/>
    ${SENDER_NAME}
  </p>
</div>
</body>
</html>
