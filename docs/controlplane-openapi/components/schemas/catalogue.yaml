TextSearchField:
  type: object
  additionalProperties: false
  required:
    - name
  properties:
    name:
      type: string
      description: Field name to be included in text search.
      example: name
    boost:
      type: number
      description: Optional boost factor to prioritize this field.
      example: 3
TextSearchOptions:
  type: object
  additionalProperties: false
  properties:
    fields:
      type: array
      items:
        $ref: '#/TextSearchField'
      description: List of fields with optional boost values.
SearchCriteria:
  type: object
  additionalProperties: false
  required:
  - field
  - searchType
  - values
  properties:
    field:
      type: string
      description: Name of the property to filter.
    searchType:
      type: string
      enum:
      - term
      - flattenedTerm
      - betweenTemporal
      - beforeTemporal
      - afterTemporal
      - betweenRange
      - beforeRange
      - afterRange
      description: "Type of search to apply. Valid types:\n- `term`: Exact match on keyword/text fields. Typically used for\
        \ top-level fields like `tags`, `fileFormat`, or other catalog properties.\n- `flattenedTerm`: Exact match on fields\
        \ stored as `flattened` type in\n               Elasticsearch mappings. Use this for matching inside JSON-like fields\n\
        \               such as `resourceServer.url` or `resourceServer.name`, where the\n               property is indexed\
        \ as a keyword without `.keyword` suffix.\n- betweenTemporal: ISO datetime range\n- beforeTemporal: Before datetime\n\
        - afterTemporal: After datetime\n- betweenRange: Numeric range\n- beforeRange: Less than value\n- afterRange: Greater\
        \ than value\n"
    values:
      type: array
      items:
        oneOf:
        - type: string
        - type: number
        - type: boolean
      description: 'Values for the selected `searchType`. Required value format:

        - `term`: One or more strings

        - `flattenedTerm`: One or more strings (matching exact values in flattened fields)

        - `betweenTemporal`: Two ISO date-time strings

        - `beforeTemporal` / `afterTemporal`: One ISO date-time string

        - `betweenRange`: Two numbers

        - `beforeRange` / `afterRange`: One number

        '
