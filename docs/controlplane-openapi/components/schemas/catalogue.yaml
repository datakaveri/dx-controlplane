DataBankResourceCreateResult:
  type: object
  description: Result payload for successful Data Bank Resource creation
  required:
  - itemId
  - itemType
  - itemName
  - resourceServers
  properties:
    itemId:
      type: string
      format: uuid
      description: Unique identifier of the created Data Bank Resource item
    itemType:
      type: array
      description: Type tags from the ADeX vocabulary
      items:
        type: string
        example: adex:DataBank
    itemName:
      type: string
      description: Name of the Data Bank Resource item
    resourceServers:
      type: object
      description: Resource server–specific provisioning details
      additionalProperties:
        type: object
        required:
        - data
        properties:
          data:
            type: object
            description: Resource server response payload
            additionalProperties: true
  example:
    itemId: 8bc9543d-7474-4f18-87ba-6bab02ab47e3
    itemType:
    - adex:DataBank
    itemName: Subdistrict Weather Information for Postman test
    resourceServers:
      NGSI-LD:
        data:
          username: 2f945b8d-0cc8-4c5d-9a3e-53fa88e6e9b2
          apiKey: Use the apiKey returned on registration, if lost please use /resetPassword API
          id: 8bc9543d-7474-4f18-87ba-6bab02ab47e3
          URL: databroker.iudx.io
          port: 24567
          vHost: IUDX-V2
      FILE:
        data:
          status: created
