dashboardUsageSummarySuccessResponse:
  type: object
  title: Response for internal datasets .
  description: Example success response for getting internal datasets
  properties:
    type:
      type: string
      description: 'URN type of the response indicating if the query was successful or if any errors have

        been triggered.

        '
    title:
      description: A human readable title to the message response.
    results:
      type: array
      description: Results which matched the query. This is an array of objects.
      items:
        type: object
  required:
  - type
  example:
    type: dx:controlPlane:success
    title: Success
    results:
    - description: Total usage since the beginning
      count: '1550856'
      size: '9124560508'
    - description: Total usage for the last 1 Year
      count: '1145750'
      size: '6375184440'
    - description: Total usage for the last 6 months
      count: '884251'
      size: '1091784668'
    - description: Total usage for the last 1 month
      count: '863228'
      size: '625708328'
    - description: Total usage for the last 1 week
      count: '287767'
      size: '189002738'
    - description: Total usage of Yesterday
      count: '83404'
      size: '34228471'
GenericBadRequestResponse:
