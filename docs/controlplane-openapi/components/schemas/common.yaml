                          type: object
                          properties:
                            firstName:
                              type: string
                            lastName:
                              type: string
                      id:
                        type: string
          provider:
            type: array
            items:
              type: object
              properties:
                name:
                  type: array
                  items:
                    type: object
                    properties:
                      email:
                        type: string
                      name:
                        type: array
                        items:
                          type: object
                          properties:
                            firstName:
                              type: string
                            lastName:
                              type: string
                      id:
                        type: string
          status:
            type: string
            enum:
            - ACTIVE
            - DELETED
          expiryAt:
            type: string
          constraints:
            type: object
          updatedAt:
            type: string
            minLength: 1
          createdAt:
            type: string
            minLength: 1
