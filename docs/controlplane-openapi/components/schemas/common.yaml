createastreamingsubscriptionrequest:
  title: createastreamingsubscriptionrequest with subscriptionName
  required:
  - type
  - entities
  type: object
  properties:
    subscriptionName:
      type: string
      maxLength: 512
    type:
      type: string
      enum:
      - Subscription
    entities:
      type: array
      maxItems: 1
      items:
        type: string
      description: ''
  example:
    subscriptionName: alias-name-of-application
    type: Subscription
    entities:
    - <item-id-uuid>
createastreamingsubscriptionrequest2:
  title: createastreamingsubscriptionrequest with id
  required:
  - type
  - entities
  type: object
  properties:
    id:
      type: string
      format: uuid
    type:
      type: string
      enum:
      - Subscription
    entities:
      type: array
      maxItems: 1
      items:
        type: string
      description: ''
  example:
    id: <uuid>
    type: Subscription
    entities:
    - <item-id-uuid>
createastreamingsubscriptionrequest3:
  title: createastreamingsubscriptionrequest with expiryAt
  required:
  - type
  - entities
  type: object
  properties:
    expiryAt:
      type: string
      description: must be in ISO 8601 format
    type:
      type: string
      enum:
      - Subscription
    entities:
      type: array
      maxItems: 1
      items:
        type: string
      description: ''
createastreamingsubscriptionrequest4:
  title: createastreamingsubscriptionrequest with combination
  description: Combination of subscriptionName and expiryAt, subscriptionName and id, id and expiryAt and all three.
  required:
  - type
  - entities
  type: object
  properties:
    id:
      type: string
      format: uuid
    subscriptionName:
      type: string
      maxLength: 512
    expiryAt:
      type: string
      description: must be in `ISO8601` format.
    type:
      type: string
      enum:
      - Subscription
    entities:
      type: array
      maxItems: 1
      items:
        type: string
      description: ''
createastreamingsubscriptionrequest5:
