UserInteractionRequest:
  type: object
  required:
  - assetId
  - assetType
  - actionType
  properties:
    assetId:
      type: string
      format: uuid
      description: ID of the entity being voted on
      example: 7db00cd6-89e7-428b-a8d8-3b97bdd1e6b9
    assetType:
      type: string
      description: Type of entity being vote on
      enum:
      - DATABANK
      - AI_MODEL
      - USECASE
      example: DATABANK
    actionType:
      type: string
      description: Type of vote
      enum:
      - BOOKMARK
      - UNBOOKMARK
      - LIKE
      - DISLIKE
      - NEUTRAL
      example: LIKE
InteractionResponse:
  type: object
  title: Response for internal datasets .
  description: Example success response for getting internal datasets
  properties:
    type:
      type: string
      description: 'URN type of the response indicating if the query was successful or if any errors have

        been triggered.

        '
    title:
      description: A human readable title to the message response.
    detail:
      type: string
  required:
  - type
  example:
    type: urn:dx:controlPlane:success
    title: Success
    detail: Interaction recorded successfully
UserFeedbackRequest:
  type: object
  required:
  - assetId
  properties:
    assetId:
      type: string
      format: uuid
      description: UUID of the asset being rated or acted upon
    entityRating:
      type: integer
      minimum: 1
      maximum: 5
      description: Star rating from 1 to 5
    actionSubtype:
      type: string
      description: Type of interaction action such as bookmark, like, dislike
    actionSubdata:
      type: object
      description: Additional structured data associated with the action
UserFeedbackResult:
  type: object
  properties:
    id:
      type: string
      format: uuid
      description: UUID of the feedback
    userId:
      type: string
      format: uuid
      description: UUID of the user who submitted the feedback
    userName:
      type: string
      nullable: true
      description: Display name of the user who submitted the feedback, resolved best-effort from the identity provider
    organisation:
      type: string
      nullable: true
      description: Organisation name of the user who submitted the feedback, when available
    assetId:
      type: string
      format: uuid
      description: UUID of the asset
    assetType:
      type: string
      description: Type of the asset
      enum:
        - DATABANK
        - AI_MODEL
        - USECASE
    entityRating:
      type: integer
      minimum: 1
      maximum: 5
      description: Star rating from 1 (lowest) to 5 (highest)
    actionSubtype:
      type: string
      description: Structured feedback category
    actionSubdata:
      type: object
      description: Additional structured data associated with the feedback (e.g. a free-text comment)
    ratingCreatedAt:
      type: string
      format: date-time
      description: >-
        When this user first gave feedback/rating on this asset. Distinct from
        the asset's own interaction record, which is also touched by
        unrelated like/dislike/bookmark activity.
    ratingUpdatedAt:
      type: string
      format: date-time
      description: When this user's feedback/rating on this asset was last changed
RatingSummary:
  type: object
  description: >-
    Aggregate rating summary across the full set of feedback rows matching the
    request's filters (not scoped to the current page).
  required:
  - averageRating
  - totalRatings
  - ratingDistribution
  properties:
    averageRating:
      type: number
      format: double
      description: Average star rating across all matching feedback rows, rounded to 2 decimal places. 0 when there are no ratings.
      example: 4.5
    totalRatings:
      type: integer
      format: int64
      description: Total number of feedback rows with a non-null rating in the matching set.
      example: 2
    ratingDistribution:
      type: object
      description: Count of ratings per star value, keyed "1" through "5".
      properties:
        '1':
          type: integer
          format: int64
          example: 0
        '2':
          type: integer
          format: int64
          example: 0
        '3':
          type: integer
          format: int64
          example: 0
        '4':
          type: integer
          format: int64
          example: 1
        '5':
          type: integer
          format: int64
          example: 1
