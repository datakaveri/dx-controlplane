AssetSummary:
  type: object
  required:
  - id
  - name
  - type
  - accessPolicy
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
    shortDescription:
      type: string
    type:
      type: string
      example: adex:DataBank
    accessPolicy:
      type: string
      example: OPEN
    ownerUserId:
      type: string
      format: uuid
    organizationId:
      type: string
      format: uuid
    organizationName:
      type: string
    uploadedBy:
      type: string
    resourceServer:
      type: array
      items:
        type: object
        properties:
          name:
            type: string
          datasetType:
            type: string
          accessTypes:
            type: array
            items:
              type: string
          queryTypes:
            type: array
            items:
              type: string
          url:
            type: string
    fileFormat:
      type: string
    itemCreatedAt:
      type: string
      format: date-time
    metrics:
      type: object
      properties:
        downloads:
          type: integer
        views:
          type: integer
        likes:
          type: integer
        dislikes:
          type: integer
AssetRequest:
  type: object
  properties:
    requestId:
      type: string
      format: uuid
    status:
      type: string
      enum:
      - GRANTED
      - PENDING
      - REJECTED
    type:
      type: string
      enum:
      - SFTP
      - API
    additionalInfo:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        purpose:
          type: string
        description:
          type: string
    updatedAt:
      type: string
      format: date-time
    requestedAt:
      type: string
      format: date-time
  required:
  - requestId
  - status
  - type
  - additionalInfo
  - user
  - updatedAt
  - requestedAt
UpdateAccessRequest:
  title: Delete notification forbidden
  type: object
  additionalProperties: false
  properties:
    type:
      type: string
      minLength: 1
    title:
      type: string
      minLength: 1
    detail:
      type: string
      minLength: 1
  required:
  - type
  - title
  - detail
  example:
    type: urn:dx:acl:success
    title: Success
    detail: Request updated successfully
AccessRequest:
  type: object
  properties:
    type:
      type: string
      minLength: 1
    title:
      type: string
      minLength: 1
    results:
      type: array
      minItems: 1
      uniqueItems: true
      items:
        type: object
        properties:
          requestId:
            type: string
            format: uuid
            minLength: 1
          requestStatus:
            type: string
            minLength: 1
          requestType:
            type: string
            minLength: 1
          additionalInfo:
            type: object
          asset:
            type: object
            properties:
              itemId:
                type: string
                minLength: 1
                format: uuid
              assetName:
                type: string
                minLength: 1
              assetType:
                type: string
                minLength: 1
            required:
            - itemId
            - assetName
            - assetType
          user:
            type: object
            properties:
              providerId:
                type: string
                format: uuid
                minLength: 1
              consumerId:
                type: string
                format: uuid
                minLength: 1
            required:
            - providerId
            - consumerId
          expiryAt:
            type: string
            minLength: 1
          updatedAt:
            type: string
            minLength: 1
          createdAt:
            type: string
            minLength: 1
        required:
        - requestId
        - itemId
        - requestType
        - asset
        - expiryAt
        - updatedAt
        - requestStatus
        - user
        - createdAt
    paginationInfo:
      type: object
      properties:
        page:
          type: integer
          example: 1
        size:
          type: integer
          example: 1
        totalCount:
          type: integer
          example: 346
        totalPages:
          type: integer
          example: 346
        hasNext:
          type: boolean
          example: true
        hasPrevious:
          type: boolean
          example: false
      required:
      - page
      - size
      - totalCount
      - totalPages
      - hasNext
      - hasPrevious
  required:
  - type
  - title
  - results
  - paginationInfo
