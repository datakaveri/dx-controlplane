OrgCreateRequestItem:
  type: object
  properties:
    id:
      type: string
      format: uuid
      description: Unique identifier of the creation request
    requestedBy:
      type: string
      format: uuid
      description: UUID of the user who submitted the request
    name:
      type: string
      description: Name of the organisation
    logoPath:
      type: string
      nullable: true
      description: Path or URL to the organisation logo
    entityType:
      type: string
      description: Type of entity (e.g. private, government, academic)
    orgSector:
      type: string
      description: Sector the organisation operates in
    websiteLink:
      type: string
      description: Official website URL
    address:
      type: string
      description: Registered address
    certificatePath:
      type: string
      description: Path to the registration certificate
    pancardPath:
      type: string
      description: Path to the PAN card document
    relevantDocPath:
      type: string
      nullable: true
      description: Path to any other relevant document
    status:
      type: string
      enum: [pending, granted, rejected]
      description: Current status of the request
    userName:
      type: string
      description: Display name of the requesting user (from Keycloak)
    empId:
      type: string
      description: Employee ID of the applicant
    jobTitle:
      type: string
      description: Job title of the applicant
    orgManagerphoneNo:
      type: string
      nullable: true
      description: Contact phone number of the org manager
    managerEmail:
      type: string
      description: Official email of the organisation manager
    orgDocuments:
      type: string
      description: Path to supporting organisation documents
    proposed_hierarchy:
      type: object
      description: Department tree proposed with the request (present only when one was submitted)
      properties:
        departments:
          type: array
          items:
            $ref: '#/ProposedDepartment'
    createdAt:
      type: string
      format: date-time
      description: Timestamp when the request was created
    updatedAt:
      type: string
      format: date-time
      description: Timestamp when the request was last updated
OrgJoinRequestItem:
  type: object
  description: |
    An organisation join request as returned by the join-request list endpoints.
    Keys are snake_case.
  properties:
    id:
      type: string
      format: uuid
      description: Unique identifier of the join request
    organization_id:
      type: string
      format: uuid
      description: UUID of the organisation being joined
    user_id:
      type: string
      format: uuid
      description: UUID of the user who submitted the request
    user_name:
      type: string
      description: Display name of the requesting user
    status:
      type: string
      enum: [pending, granted, rejected, withdrawn]
      description: Current status of the join request
    job_title:
      type: string
      description: Job title of the applicant within the organisation
    emp_id:
      type: string
      description: Employee ID of the applicant
    official_email:
      type: string
      description: Official email of the applicant within the organisation
    requested_node_id:
      type: string
      format: uuid
      description: |
        Department the applicant chose (sent as `departmentId`). Absent for flat organisations.
    requested_role:
      type: string
      enum: [member, dept_admin]
      description: |
        Role the applicant asked for in the chosen department (UI: "User" = `member`,
        "Admin" = `dept_admin`). `member` for flat organisations and older requests.
    additional_info:
      type: object
      additionalProperties: true
      description: |
        Free-form details the UI sent as `additionalInfo` with the request (for example a
        `purpose` for an Admin request), returned unchanged. Absent when none was sent.
    department:
      $ref: '#/DepartmentRef'
    requested_at:
      type: string
      format: date-time
      description: Timestamp when the request was submitted
    processed_at:
      type: string
      format: date-time
      description: Timestamp when the request was processed; absent while pending
OrgUserItem:
  type: object
  description: A member of an organisation as returned by the user list endpoints. Keys are snake_case.
  properties:
    id:
      type: string
      format: uuid
    organization_id:
      type: string
      format: uuid
    user_id:
      type: string
      format: uuid
    user_name:
      type: string
    role:
      type: string
      enum: [member, admin, dept_admin]
      description: |
        Role of the user within the organisation. `dept_admin` administers the
        department in `admin_of_node_id` and all of its sub-departments.
    job_title:
      type: string
    emp_id:
      type: string
    phone_no:
      type: string
    official_email:
      type: string
    hierarchy_node_id:
      type: string
      format: uuid
      description: Department the user belongs to. Absent for organisations without departments.
    admin_of_node_id:
      type: string
      format: uuid
      description: Department the user administers. Only present when `role` is `dept_admin`.
    department:
      allOf:
      - $ref: '#/DepartmentRef'
      description: The department in `hierarchy_node_id`, with its path.
    adminOfDepartment:
      allOf:
      - $ref: '#/DepartmentRef'
      description: The department in `admin_of_node_id`, with its path.
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time
DepartmentRef:
  type: object
  description: |
    A department and its place in the organisation's tree, from the top-level
    department down to this one. Absent when no department applies.
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
      example: Data Services
    path:
      type: string
      description: |
        The department's ltree path as stored: each level's name lowercased with
        non-alphanumerics replaced by `_`, joined with `.`. Use `hierarchy` for
        display names.
      example: google.engineering.platform.data_services
    hierarchy:
      type: array
      description: Departments from the top-level one down to this one (inclusive).
      items:
        type: object
        properties:
          id:
            type: string
            format: uuid
          name:
            type: string
      example:
      - id: 1c0e7d5a-3f1b-4a2e-9d8c-7b6a5f4e3d2c
        name: Google
      - id: 2d1f8e6b-4a2c-4b3f-8e9d-8c7b6a5f4e3d
        name: Engineering
      - id: 3e2a9f7c-5b3d-4c4a-9f0e-9d8c7b6a5f4e
        name: Platform
      - id: 4f3b0a8d-6c4e-4d5b-8a1f-0e9d8c7b6a5f
        name: Data Services
OrgItem:
  type: object
  properties:
    id:
      type: string
      format: uuid
    orgName:
      type: string
    orgLogo:
      type: string
      nullable: true
    entityType:
      type: string
    orgSector:
      type: string
    websiteLink:
      type: string
    address:
      type: string
    certificatePath:
      type: string
    pancardPath:
      type: string
    relevantDocPath:
      type: string
      nullable: true
    orgDocuments:
      type: string
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
ProviderRoleRequestItem:
  type: object
  description: |
    A provider role request as returned by the organisation and department
    provider-request lists. Request fields are snake_case; `userName`, `jobTitle`
    and `empId` are copied from the user's join request and keep its camelCase.
  properties:
    id:
      type: string
      format: uuid
    user_id:
      type: string
      format: uuid
    organization_id:
      type: string
      format: uuid
      description: Absent for platform-track requests.
    provider_type:
      type: string
      enum: [org, platform]
    status:
      type: string
      enum: [pending, granted, rejected]
    requested_node_id:
      type: string
      format: uuid
      description: |
        The department this request is scoped to, if the organisation has
        departments. Absent otherwise.
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time
    roles:
      type: array
      items:
        type: string
      description: Platform-level Keycloak roles of the requesting user.
    account_enabled:
      type: boolean
    department:
      allOf:
      - $ref: '#/DepartmentRef'
      description: The department in `requested_node_id`, with its path. Absent when the request is not scoped to a department.
    userName:
      type: string
      description: User name from the join request (if available).
    jobTitle:
      type: string
      description: Job title from the join request (if available).
    empId:
      type: string
      description: Employee ID from the join request (if available).
  required:
  - id
  - user_id
  - provider_type
  - status
OrganizationDepartment:
  type: object
  properties:
    id:
      type: string
      format: uuid
    organizationId:
      type: string
      format: uuid
    parentId:
      type: string
      format: uuid
      nullable: true
    name:
      type: string
    level:
      type: integer
      minimum: 1
    path:
      type: string
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
  required:
    - id
    - organizationId
    - name
    - level
    - path
    - createdAt
    - updatedAt
ProposedDepartment:
  type: object
  description: |
    One department of a proposed tree, with its sub-departments nested
    inside it. No ids are supplied -- the server generates them when the
    approved tree is applied.
  properties:
    name:
      type: string
      description: Department name; must be unique among its siblings.
      example: Engineering
    subDepartments:
      type: array
      description: Child departments of this department (may be omitted or empty).
      items:
        $ref: '#/ProposedDepartment'
  required:
    - name
OrganizationHierarchyDefinitionRequest:
  type: object
  properties:
    id:
      type: string
      format: uuid
    organizationId:
      type: string
      format: uuid
    parentNodeId:
      type: string
      format: uuid
      nullable: true
      description: Existing department the departments are added under; null for top-level departments.
    parentDepartment:
      allOf:
      - $ref: '#/DepartmentRef'
      description: The department in `parentNodeId`, with its path. Absent for top-level additions.
    departments:
      type: array
      description: The proposed departments, each with nested `subDepartments`.
      items:
        $ref: '#/ProposedDepartment'
    status:
      type: string
      enum: [pending, granted, rejected]
    remarks:
      type: string
      nullable: true
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
OrganizationHierarchyDefinitionRequestListItem:
  type: object
  description: A department request as returned by the list endpoints. Keys are snake_case.
  properties:
    id:
      type: string
      format: uuid
    organization_id:
      type: string
      format: uuid
    parent_node_id:
      type: string
      format: uuid
      description: Existing department the departments are added under; absent for top-level departments.
    parentDepartment:
      allOf:
      - $ref: '#/DepartmentRef'
      description: The department in `parent_node_id`, with its path.
    proposed_hierarchy:
      type: object
      properties:
        departments:
          type: array
          items:
            $ref: '#/ProposedDepartment'
    status:
      type: string
      enum: [pending, granted, rejected]
    remarks:
      type: string
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time
DeptAdminRequest:
  type: object
  properties:
    id:
      type: string
      format: uuid
    organizationId:
      type: string
      format: uuid
    userId:
      type: string
      format: uuid
      description: UUID of the member requesting to become dept_admin
    departmentId:
      type: string
      format: uuid
      description: The requester's own department (what they're requesting to administer)
    status:
      type: string
      enum: [pending, granted, rejected]
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time