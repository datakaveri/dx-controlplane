OrgCreateRequestItem:
  type: object
  properties:
    id:
      type: string
      format: uuid
      description: Unique identifier of the creation request
    requestedBy:
      type: string
      format: uuid
      description: UUID of the user who submitted the request
    name:
      type: string
      description: Name of the organisation
    logoPath:
      type: string
      nullable: true
      description: Path or URL to the organisation logo
    entityType:
      type: string
      description: Type of entity (e.g. private, government, academic)
    orgSector:
      type: string
      description: Sector the organisation operates in
    websiteLink:
      type: string
      description: Official website URL
    address:
      type: string
      description: Registered address
    certificatePath:
      type: string
      description: Path to the registration certificate
    pancardPath:
      type: string
      description: Path to the PAN card document
    relevantDocPath:
      type: string
      nullable: true
      description: Path to any other relevant document
    status:
      type: string
      enum: [pending, granted, rejected]
      description: Current status of the request
    userName:
      type: string
      description: Display name of the requesting user (from Keycloak)
    empId:
      type: string
      description: Employee ID of the applicant
    jobTitle:
      type: string
      description: Job title of the applicant
    orgManagerphoneNo:
      type: string
      nullable: true
      description: Contact phone number of the org manager
    managerEmail:
      type: string
      description: Official email of the organisation manager
    orgDocuments:
      type: string
      description: Path to supporting organisation documents
    createdAt:
      type: string
      format: date-time
      description: Timestamp when the request was created
    updatedAt:
      type: string
      format: date-time
      description: Timestamp when the request was last updated
OrgJoinRequestItem:
  type: object
  properties:
    id:
      type: string
      format: uuid
      description: Unique identifier of the join request
    organizationId:
      type: string
      format: uuid
      description: UUID of the organisation being joined
    userId:
      type: string
      format: uuid
      description: UUID of the user who submitted the request
    userName:
      type: string
      description: Display name of the requesting user
    status:
      type: string
      enum: [pending, granted, rejected, withdrawn]
      description: Current status of the join request
    jobTitle:
      type: string
      description: Job title of the applicant within the organisation
    empId:
      type: string
      description: Employee ID of the applicant
    officialEmail:
      type: string
      description: Official email of the applicant within the organisation
    departmentId:
      type: string
      format: uuid
      nullable: true
      description: |
        Which department the applicant wants to join, shown to them from the
        organisation's department tree. Required when the organisation has
        departments enabled, must be omitted otherwise.
    requestedAt:
      type: string
      format: date-time
      description: Timestamp when the request was submitted
    processedAt:
      type: string
      format: date-time
      nullable: true
      description: Timestamp when the request was processed, or null if pending
OrgItem:
  type: object
  properties:
    id:
      type: string
      format: uuid
    orgName:
      type: string
    orgLogo:
      type: string
      nullable: true
    entityType:
      type: string
    orgSector:
      type: string
    websiteLink:
      type: string
    address:
      type: string
    certificatePath:
      type: string
    pancardPath:
      type: string
    relevantDocPath:
      type: string
      nullable: true
    orgDocuments:
      type: string
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
ProviderRoleRequestItem:
  type: object
  properties:
    id:
      type: string
      format: uuid
    userId:
      type: string
      format: uuid
    orgId:
      type: string
      format: uuid
      nullable: true
      description: null for platform-track requests
    providerType:
      type: string
      enum: [org, platform]
    status:
      type: string
      enum: [pending, granted, rejected]
    departmentId:
      type: string
      format: uuid
      nullable: true
      description: |
        Which department this provider-role request is scoped to, if the
        organisation has departments enabled -- lets a dept_admin approve it.
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
    roles:
      type: array
      items:
        type: string
      description: Platform-level Keycloak roles of the user
    accountEnabled:
      type: boolean
OrganizationDepartment:
  type: object
  properties:
    id:
      type: string
      format: uuid
    organizationId:
      type: string
      format: uuid
    parentId:
      type: string
      format: uuid
      nullable: true
    name:
      type: string
    level:
      type: integer
      minimum: 1
    path:
      type: string
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
  required:
    - id
    - organizationId
    - name
    - level
    - path
    - createdAt
    - updatedAt
ProposedDepartment:
  type: object
  description: |
    One department of a proposed tree, with its sub-departments nested
    inside it. No ids are supplied -- the server generates them when the
    approved tree is applied.
  properties:
    name:
      type: string
      description: Department name; must be unique among its siblings.
      example: Engineering
    subDepartments:
      type: array
      description: Child departments of this department (may be omitted or empty).
      items:
        $ref: '#/ProposedDepartment'
  required:
    - name
OrganizationHierarchyDefinitionRequest:
  type: object
  properties:
    id:
      type: string
      format: uuid
    organizationId:
      type: string
      format: uuid
    proposedHierarchy:
      type: object
      properties:
        departments:
          type: array
          items:
            $ref: '#/ProposedDepartment'
    status:
      type: string
      enum: [pending, granted, rejected]
    remarks:
      type: string
      nullable: true
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
DeptAdminRequest:
  type: object
  properties:
    id:
      type: string
      format: uuid
    organizationId:
      type: string
      format: uuid
    userId:
      type: string
      format: uuid
      description: UUID of the member requesting to become dept_admin
    departmentId:
      type: string
      format: uuid
      description: The requester's own department (what they're requesting to administer)
    status:
      type: string
      enum: [pending, granted, rejected]
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time