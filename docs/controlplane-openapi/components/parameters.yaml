UserIdParam:
  name: userId
  in: query
  description: UUID of the user for whom to fetch activity logs. Must be a valid v4 UUID.
  required: false
  schema:
    type: string
    format: uuid
    pattern: ^[0-9a-f]{8}\b-[0-9a-f]{4}\b-[0-9a-f]{4}\b-[0-9a-f]{4}\b-[0-9a-f]{12}$
AssetTypeParam:
  name: assetType
  in: query
  description: Filter results by asset type. Use this to narrow down responses to a specific category of asset.
  required: false
  schema:
    type: string
    enum:
    - DATABANK
    - AI_MODEL
    - USECASE
SandboxTypeParam:
  name: sandboxType
  in: query
  description: Filter audit logs by sandbox compute environment type (CPU or GPU).
  required: false
  schema:
    type: string
    enum:
    - cpu
    - gpu
AssetAccessPolicyParam:
  name: accessPolicy
  in: query
  description: Filter results by the access policy of the asset. Allowed values are `OPEN` (publicly accessible), `RESTRICTED` (requires approval), `PRIVATE` (owner-only), and `PII` (contains personally identifiable information).
  required: false
  schema:
    type: string
    enum:
    - OPEN
    - RESTRICTED
    - PRIVATE
    - PII
RoleParam:
  name: role
  in: query
  description: Filter results by a specific user role (e.g., `consumer`, `provider`, `org_admin`, `cos_admin`).
  required: false
  schema:
    type: string
ActionParam:
  name: action
  in: query
  description: Filter activity logs by action type. Common values include `View`, `Download`, `Upload`, `Update`, and `Delete`.
  required: false
  schema:
    type: string
LogTypeParam:
  name: logType
  in: query
  description: Filter activity logs by log category. Common values are `ASSET` (asset-related events), `USER_ACTION` (user management events), and `COMPUTE` (compute/sandbox events).
  required: false
  schema:
    type: string
OrganizationIdParam:
  name: orgId
  in: query
  description: UUID of the organization to filter results by. Use this to scope activity logs or other data to a specific organization.
  required: false
  schema:
    type: string
    format: uuid
    pattern: ^[0-9a-f]{8}\b-[0-9a-f]{4}\b-[0-9a-f]{4}\b-[0-9a-f]{4}\b-[0-9a-f]{12}$
PageParam:
  name: page
  in: query
  description: Page number for pagination (1-based). The first page is `1`. If omitted, defaults to `1`.
  required: false
  schema:
    type: integer
    default: 1
    minimum: 1
SizeParam:
  name: size
  in: query
  description: Number of items to return per page. Defaults to `1000`. A recommended value for most use cases is between 10 and 25. Maximum allowed value is `1000`.
  required: false
  schema:
    type: integer
    default: 1000
    minimum: 1
    maximum: 1000
SizeParamReport:
  name: size
  in: query
  description: Number of items to return per page for report endpoints. Acts as a limit on the query. Defaults to `1000`. Maximum allowed value is `1000`.
  required: false
  schema:
    type: integer
    default: 1000
    minimum: 1
    maximum: 1000
SortingParam:
  name: sort
  in: query
  description: 'Sort results by up to 3 fields, separated by a semicolon (`;`). Each field uses the format `fieldName:asc` or `fieldName:desc`. Common sortable fields include `createdAt`, `updatedAt`, `status`, and `name`. Example: `createdAt:desc;status:asc` sorts by creation date descending, then by status ascending.'
  required: false
  schema:
    type: string
  example: createdAt:desc;status:asc
TimeParam:
  name: time
  in: query
  description: This parameter specifies the <b>start time</b> for the temporal-query in `ISO8601` format.
  schema:
    type: string
    example: 2025-01-01T00:00:00
EndTimeParam:
  name: endtime
  in: query
  description: This parameter specifies the <b>endtime</b> for the temporal-query in `ISO8601` format.
  schema:
    type: string
    example: 2025-12-31T23:59:59
TimeRelParam:
  name: timerel
  in: query
  description: 'Temporal relation for time-based filtering. Use `between` with both `time` and `endtime` to define a range. Use `before` or `after` with only `time` to filter records before or after a point in time.'
  required: false
  schema:
    type: string
    enum:
    - between
    - before
    - after
OrgNameParam:
  name: name
  in: query
  description: Filter organizations by name. Performs a case-insensitive partial match on the organization name.
  required: false
  schema:
    type: string
EntityTypeParam:
  name: entity_type
  in: query
  description: Filter by organization entity type (e.g., `Private`, `Public`, `Government`, `Startup`, `Academic`).
  required: false
  schema:
    type: string
OrgSectorParam:
  name: org_sector
  in: query
  description: Filter by organization sector (e.g., `Technology`, `Healthcare`, `Education`, `Research & Development`).
  required: false
  schema:
    type: string
StatusParam:
  name: status
  in: query
  description: Filter requests by their current processing status. Use `pending` for unprocessed requests, `granted` for approved requests, or `rejected` for denied requests.
  required: false
  schema:
    type: string
    enum:
    - pending
    - granted
    - rejected
SearchTermParam:
  name: search_term
  in: query
  description: Free-text search term to filter list results. Performs a case-insensitive partial match across key fields such as name, email, or title.
  required: false
  schema:
    type: string
  example: quantum
DelegatorIdParam:
  name: delegatorId
  in: query
  description: UUID of the delegator. When a delegate (a user who has been granted delegation rights) performs an action on behalf of another user, this parameter identifies the original delegating user. Required when acting under delegation.
  required: false
  schema:
    type: string
    format: uuid
    pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
