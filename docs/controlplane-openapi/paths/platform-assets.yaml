/iudx/v2/cat/getAllAssets:
  get:
    tags:
    - Platform Assets Management
    description: 'Get all the assets belonging to the platform.

      **Role-based behavior:** - Only users with the `cos_admin` role can access this endpoint.

      '
    operationId: get platform assets
    security:
    - authorization: []
    parameters:
    - name: page
      in: query
      description: Page number for pagination
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    - name: size
      in: query
      description: Page size for pagination
      required: false
      schema:
        type: integer
        minimum: 1
        default: 100
    - name: sort
      in: query
      description: 'This parameter allows sorting the results by up to 3 fields, separated by a semicolon (;). The format
        for each field is `fieldName:asc` or `fieldName:desc`. For example: `itemCreatedAt:desc;dataReadiness:asc;name:desc`
        will sort by creation date (descending), then dataReadiness (ascending), then name (descending).

        '
      required: false
      schema:
        type: string
    responses:
      '200':
        description: A successful response with all platform assets
        content:
          application/json:
            schema:
              $ref: ../components/schemas/catalogue.yaml#/SearchResponse
            examples:
              PlatformAssetsExample:
                summary: Sample response for platform assets
                value:
                  type: dx:controlPlane:success
                  title: Success
                  result:
                  - description: Support Vector Machine (SVM) is a powerful supervised learning algorithm that creates a hyperplane
                      or set of hyperplanes in a high-dimensional space for classification, regression, or outlier detection
                      tasks. SVMs are effective in high-dimensional spaces, memory efficient, and versatile through different
                      kernel functions (linear, polynomial, RBF, sigmoid). They work by finding the optimal hyperplane that
                      maximizes the margin between different classes in the training data. SVMs are particularly effective
                      for classification problems where the boundary between classes is complex, and they handle both linear
                      and non-linear classification tasks through the kernel trick.
