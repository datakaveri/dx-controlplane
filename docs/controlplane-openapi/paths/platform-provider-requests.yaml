/iudx/v2/auth/user/platform/provider-requests:
  post:
    tags:
    - Platform Provider Requests
    summary: Submit a platform provider role request
    description: |
      Submits a new platform provider role request on behalf of the authenticated consumer.
      The user must not already have a pending or granted provider role request (org or platform).
      KYC verification is required before a request can be submitted.
      On success, a notification email is sent to the COS Admin for review.
    operationId: post-auth-v2-platform-provider-requests
    security:
    - authorization: []
    responses:
      '200':
        description: Platform provider role request created successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  example: dx:controlPlane:success
                title:
                  type: string
                  example: Success
                detail:
                  type: string
                  example: Provider role request submitted successfully
      '401':
        description: Missing or invalid authorization token
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
            example:
              type: urn:dx:controlPlane:notAuthorized
              title: Not Authorized
              detail: Missing or invalid Bearer token
      '403':
        description: Forbidden – KYC not completed or user not found
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
            example:
              type: urn:dx:controlPlane:forbidden
              title: Forbidden
              detail: User does not have the required role.
      '409':
        description: A pending or granted provider role request already exists
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
            example:
              type: urn:dx:controlPlane:AlreadyExists
              title: Conflict
              detail: A pending or granted provider role request already exists for this user
    x-codeSamples:
    - lang: cURL
      label: Submit Platform Provider Request
      source: |
        curl --location 'https://${HOSTNAME}/iudx/v2/auth/user/platform/provider-requests' \
        --header 'Authorization: Bearer <your-token>'

  get:
    tags:
    - Platform Provider Requests
    summary: Get own platform provider role request
    description: |
      Returns the authenticated consumer's own platform provider role request.
      The response is enriched with the user's current Keycloak roles and account status.
      Returns 404 if no request exists for the user.
    operationId: get-auth-v2-user-platform-provider-requests
    security:
    - authorization: []
    responses:
      '200':
        description: The consumer's platform provider role request
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  example: dx:controlPlane:success
                title:
                  type: string
                  example: Success
                result:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                      example: 39358c41-84dd-42c4-b8c5-9a95afcf8fce
                    user_id:
                      type: string
                      format: uuid
                      example: 03cc4ca3-d1fb-4f8a-bd77-6b0441916bbd
                    provider_type:
                      type: string
                      example: platform
                    status:
                      type: string
                      example: pending
                    created_at:
                      type: string
                      format: date-time
                      example: "2026-05-29T12:08:28.595467"
                    updated_at:
                      type: string
                      format: date-time
                    roles:
                      type: array
                      items:
                        type: string
                      example: ["consumer", "offline_access", "default-roles-tgdex-pilot"]
                    account_enabled:
                      type: boolean
                      example: true
      '401':
        description: Missing or invalid authorization token
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
            example:
              type: urn:dx:controlPlane:notAuthorized
              title: Not Authorized
              detail: Missing or invalid Bearer token
      '403':
        description: Forbidden – user is not authenticated
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
            example:
              type: urn:dx:controlPlane:forbidden
              title: Forbidden
              detail: User does not have the required role.
      '404':
        description: No platform provider request found for this user
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
            example:
              type: urn:dx:controlPlane:notFound
              title: Not Found
              detail: No pending platform provider request found for this user
    x-codeSamples:
    - lang: cURL
      label: Get Own Platform Provider Request
      source: |
        curl --location 'https://${HOSTNAME}/iudx/v2/auth/user/platform/provider-requests' \
        --header 'Authorization: Bearer <your-token>'

  delete:
    tags:
    - Platform Provider Requests
    summary: Withdraw own platform provider role request
    description: |
      Withdraws the authenticated consumer's own platform provider role request.
      Only requests in `pending` status can be withdrawn — requests that have already been
      approved (`granted`) or rejected cannot be deleted.
    operationId: delete-auth-v2-user-platform-provider-requests
    security:
    - authorization: []
    responses:
      '200':
        description: Platform provider role request deleted successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  example: dx:controlPlane:success
                title:
                  type: string
                  example: Success
                detail:
                  type: string
                  example: Platform provider role request deleted successfully
      '400':
        description: Request is not in pending status and cannot be withdrawn
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
            example:
              type: urn:dx:controlPlane:BadRequest
              title: Bad Request
              detail: Only pending platform provider role requests can be deleted
      '401':
        description: Missing or invalid authorization token
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
            example:
              type: urn:dx:controlPlane:notAuthorized
              title: Not Authorized
              detail: Missing or invalid Bearer token
      '404':
        description: No pending platform provider request found for this user
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
            example:
              type: urn:dx:controlPlane:notFound
              title: Not Found
              detail: No pending platform provider request found for this user
    x-codeSamples:
    - lang: cURL
      label: Withdraw Platform Provider Request
      source: |
        curl --location --request DELETE 'https://${HOSTNAME}/iudx/v2/auth/user/platform/provider-requests' \
        --header 'Authorization: Bearer <your-token>'

/iudx/v2/auth/admin/platform/provider-requests:
  get:
    tags:
    - Platform Provider Requests
    summary: List all platform provider role requests
    description: |
      Returns a paginated list of all platform provider role requests submitted by consumers
      across the platform. Each entry is enriched with the requester's current Keycloak roles
      and account status. Supports filtering by `status` and `userId`, and sorting by `createdAt`
      or `updatedAt`. Only accessible by COS Admins.
    operationId: get-auth-v2-platform-provider-requests
    security:
    - authorization: []
    parameters:
    - name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    - name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 10
    - name: status
      in: query
      required: false
      schema:
        type: string
        enum: [pending, granted, rejected]
    - name: userId
      in: query
      required: false
      schema:
        type: string
        format: uuid
    - name: sort
      in: query
      required: false
      schema:
        type: string
        description: 'Sort by field and order, e.g. createdAt:desc'
    responses:
      '200':
        description: Paginated list of platform provider role requests
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  example: dx:controlPlane:success
                title:
                  type: string
                  example: Success
                result:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        example: 39358c41-84dd-42c4-b8c5-9a95afcf8fce
                      user_id:
                        type: string
                        format: uuid
                        example: 03cc4ca3-d1fb-4f8a-bd77-6b0441916bbd
                      provider_type:
                        type: string
                        example: platform
                      status:
                        type: string
                        example: pending
                      created_at:
                        type: string
                        format: date-time
                        example: "2026-05-29T12:08:28.595467"
                      updated_at:
                        type: string
                        format: date-time
                      roles:
                        type: array
                        items:
                          type: string
                        example: ["consumer", "offline_access", "default-roles-tgdex-pilot"]
                      account_enabled:
                        type: boolean
                        example: true
                paginationInfo:
                  type: object
                  properties:
                    page:
                      type: integer
                    size:
                      type: integer
                    totalCount:
                      type: integer
                    totalPages:
                      type: integer
                    hasNext:
                      type: boolean
                    hasPrevious:
                      type: boolean
      '401':
        description: Missing or invalid authorization token
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
            example:
              type: urn:dx:controlPlane:notAuthorized
              title: Not Authorized
              detail: Missing or invalid Bearer token
      '403':
        description: Forbidden – user does not have COS Admin role
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
            example:
              type: urn:dx:controlPlane:forbidden
              title: Forbidden
              detail: User does not have the required role.
    x-codeSamples:
    - lang: cURL
      label: List All Platform Provider Requests
      source: |
        curl --location 'https://${HOSTNAME}/iudx/v2/auth/admin/platform/provider-requests?page=1&size=10&status=pending' \
        --header 'Authorization: Bearer <your-token>'

/iudx/v2/auth/admin/platform/provider-requests/{id}:
  patch:
    tags:
    - Platform Provider Requests
    summary: Approve or reject a platform provider role request
    description: |
      Approves or rejects a specific platform provider role request identified by `id`.
      Only COS Admins can perform this action.
      - Setting status to `granted` assigns the `PROVIDER` role to the user in Keycloak and
        sends an approval notification email to the user.
      - Setting status to `rejected` sends a rejection notification email to the user.
      Only requests in `pending` status can be updated.
    operationId: patch-auth-v2-platform-provider-requests
    security:
    - authorization: []
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - status
            properties:
              status:
                type: string
                enum: [granted, rejected]
          examples:
            Approve:
              value:
                status: granted
            Reject:
              value:
                status: rejected
    responses:
      '200':
        description: Platform provider role request updated successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  example: dx:controlPlane:success
                title:
                  type: string
                  example: Success
                detail:
                  type: string
                  example: Provider role request approved successfully
      '400':
        description: Bad request – invalid status value
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
            example:
              type: urn:dx:controlPlane:BadRequest
              title: Bad Request
              detail: Invalid status value. Allowed values are granted or rejected
      '401':
        description: Missing or invalid authorization token
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
            example:
              type: urn:dx:controlPlane:notAuthorized
              title: Not Authorized
              detail: Missing or invalid Bearer token
      '403':
        description: Forbidden – user does not have COS Admin role
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
            example:
              type: urn:dx:controlPlane:forbidden
              title: Forbidden
              detail: User does not have the required role.
      '404':
        description: No request found with the given ID
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
            example:
              type: urn:dx:controlPlane:notFound
              title: Not Found
              detail: No provider role request found with the given ID
    x-codeSamples:
    - lang: cURL
      label: Approve Platform Provider Request
      source: |
        curl --location --request PATCH 'https://${HOSTNAME}/iudx/v2/auth/admin/platform/provider-requests/<id>' \
        --header 'Authorization: Bearer <your-token>' \
        --header 'Content-Type: application/json' \
        --data '{"status": "granted"}'
    - lang: cURL
      label: Reject Platform Provider Request
      source: |
        curl --location --request PATCH 'https://${HOSTNAME}/iudx/v2/auth/admin/platform/provider-requests/<id>' \
        --header 'Authorization: Bearer <your-token>' \
        --header 'Content-Type: application/json' \
        --data '{"status": "rejected"}'
