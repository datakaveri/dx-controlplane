  parameters:
  - name: id
    in: path
    required: true
    description: 'UUID of the organisation for which to retrieve/put join requests.

      **Log Type:** `USER_ACTION`

      '
    schema:
      type: string
      format: uuid
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
