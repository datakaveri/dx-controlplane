/iudx/v2/auth/organisations/requests/approve:
  post:
    summary: 'AAA-003-PF Admin: Approve creation of new organisation'
    description: 'This API allows an AAA-003-PF Admin to approve or reject a pending organization creation request. The request
      body must include the `req_id` of the organization request and the `status` (granted or rejected). A successful response
      indicates that the organization request has been updated.

      **Log Type:** `USER_ACTION`

      '
    tags:
    - Organisation APIs
    operationId: post-auth-v2-approve-create_org
    security:
    - authorization: []
    requestBody:
      description: 'The request body specifies the details for approving or rejecting an organization creation request. -
        `req_id`: (Required) The unique ID of the organization creation request to be processed. - `status`: (Required) The
        new status for the request. Valid values are `granted` or `rejected`.

        '
      content:
        application/json:
          schema:
            type: object
            properties:
              req_id:
                type: string
              status:
                type: string
            required:
            - req_id
            - status
    responses:
      '201':
        description: Created
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                title:
                  type: string
                detail:
                  type: string
              x-examples:
                Example 1:
                  type: urn:dx:ControlPlane:success
                  title: Success
                  detail: Updated Sucessfully
            examples:
              Example 1:
                value:
                  type: urn:dx:ControlPlane:success
                  title: Success
                  detail: Updated Sucessfully
      '400':
        description: Bad Request
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                title:
                  type: string
                detail:
                  type: string
            examples:
              Example 1:
                value:
                  type: urn:dx:ControlPlane:badRequest
                  title: Bad Request
                  detail: No request found with given ID
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                title:
                  type: string
                detail:
                  type: string
            examples:
              Example 1:
                value:
                  type: urn:dx:as:InvalidAuthenticationToken
                  title: Token authentication failed
                  detail: Inactive Token
      '409':
        description: Conflict
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                title:
                  type: string
                ? ''
                : type: string
            examples:
              Example 1:
                value:
                  type: urn:dx:ControlPlane:conflict
                  title: Conflict
                  detail: 'ERROR: duplicate key value violates unique constraint "organizations_name_key" (23505)'
