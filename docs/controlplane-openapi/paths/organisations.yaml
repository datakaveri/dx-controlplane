/iudx/v2/auth/organizations/{organization_id}/hierarchy/definition-requests/{request_id}:
  parameters:
    - name: organization_id
      in: path
      required: true
      description: UUID of the organisation.
      schema:
        type: string
        format: uuid
    - name: request_id
      in: path
      required: true
      description: UUID of the hierarchy definition request.
      schema:
        type: string
        format: uuid

  get:
    tags:
      - Organisation APIs
    summary: Get a hierarchy definition request
    operationId: get-auth-v2-organisation-hierarchy-definition-request
    description: |
      Returns the hierarchy definition request identified by `request_id`.

      **Log Type:** `USER_ACTION`
    security:
      - authorization: []
    responses:
      '200':
        description: Hierarchy definition request
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  example: urn:dx:controlPlane:success
                title:
                  type: string
                  example: Success
                result:
                  $ref: ../components/schemas/organisation.yaml#/OrganizationHierarchyDefinitionRequest
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/Unauthorized
      '403':
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/Forbidden
      '404':
        description: Not Found - Request does not exist
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/NotFound

  put:
    tags:
      - Organisation APIs
    summary: Approve or reject a hierarchy definition request
    operationId: put-auth-v2-organisation-hierarchy-definition-request
    description: |
      Cos_admin approves or rejects the entire proposed department tree as one
      atomic unit. On approval, the whole tree is created, the organisation's
      hierarchy is enabled. The org_admin needs no department assignment --
      they administer the whole organisation by role.

      **Log Type:** `USER_ACTION`
    security:
      - authorization: []
    x-codeSamples:
      - lang: cURL
        label: Approve a hierarchy definition request
        source: |
          curl --location --request PUT 'https://${HOSTNAME}/iudx/v2/auth/organisations/{organization_id}/hierarchy/definition-requests/{request_id}' \
          --header 'Authorization: Bearer <your-token>' \
          --header 'Content-Type: application/json' \
          --data '{ "status": "granted" }'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - status
            properties:
              status:
                type: string
                enum: [granted, rejected]
              remarks:
                type: string
    responses:
      '200':
        description: Hierarchy definition request updated successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  example: urn:dx:controlPlane:success
                title:
                  type: string
                  example: Success
                result:
                  $ref: ../components/schemas/organisation.yaml#/OrganizationHierarchyDefinitionRequest
      '400':
        description: Bad Request - Invalid status
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/generalBadRequest
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/Unauthorized
      '403':
        description: Forbidden - Caller is not cos_admin
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/Forbidden
      '404':
        description: Not Found - Request does not exist
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/NotFound
      '409':
        description: Conflict - Request has already been processed
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/unAuthorizedAccess

/iudx/v2/auth/organizations/{organization_id}/users/{user_id}/dept-admin:
  parameters:
    - name: organization_id
      in: path
      required: true
      description: UUID of the organisation.
      schema:
        type: string
        format: uuid
    - name: user_id
      in: path
      required: true
      description: UUID of the member to assign as department admin.
      schema:
        type: string
        format: uuid

  put:
    tags:
      - Organisation APIs
    summary: Assign a member as department admin
    operationId: put-auth-v2-organisation-dept-admin
    description: |
      Org_admin, or any dept_admin who is an ancestor of the target
      department, assigns an existing organisation member as the admin of
      that department. The target user must already be a member of the
      organisation.

      **Log Type:** `USER_ACTION`
    security:
      - authorization: []
    x-codeSamples:
      - lang: cURL
        label: Assign a department admin
        source: |
          curl --location --request PUT 'https://${HOSTNAME}/iudx/v2/auth/organisations/{organization_id}/users/{user_id}/dept-admin' \
          --header 'Authorization: Bearer <your-token>' \
          --header 'Content-Type: application/json' \
          --data '{ "departmentId": "5fa85f64-5717-4562-b3fc-2c963f66afa8" }'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - departmentId
            properties:
              departmentId:
                type: string
                format: uuid
    responses:
      '200':
        description: Department admin assigned successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  example: urn:dx:controlPlane:success
                title:
                  type: string
                  example: Success
      '400':
        description: Bad Request - departmentId missing or invalid
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/generalBadRequest
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/Unauthorized
      '403':
        description: Forbidden - Caller is not the org_admin or an ancestor dept_admin of this department
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/Forbidden
      '404':
        description: Not Found - Department or target user does not exist
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/NotFound

/iudx/v2/auth/organizations/{organization_id}/dept-admin-requests:
  parameters:
    - name: organization_id
      in: path
      required: true
      description: UUID of the organisation.
      schema:
        type: string
        format: uuid

  post:
    tags:
      - Organisation APIs
    summary: Request to become admin of my own department
    operationId: post-auth-v2-organisation-dept-admin-requests
    description: |
      A member requests to become the admin of the department they already
      belong to. Approvable by the org_admin or any strict ancestor dept_admin
      above them (never by the department's own, not-yet-existing admin).

      **Log Type:** `USER_ACTION`
    security:
      - authorization: []
    responses:
      '201':
        description: Dept_admin request submitted successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  example: urn:dx:controlPlane:success
                title:
                  type: string
                  example: Success
                result:
                  $ref: ../components/schemas/organisation.yaml#/DeptAdminRequest
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/Unauthorized
      '403':
        description: Forbidden - Caller is not a member of any department
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/Forbidden
      '409':
        description: Conflict - Already admin of this department, or a request is already pending
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/unAuthorizedAccess

