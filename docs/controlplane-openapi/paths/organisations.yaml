/iudx/v2/auth/organisations/requests:
  get:
    summary: Get all organisation creation requests (COS Admin)
    tags:
    - Organisation APIs
    operationId: get-auth-v2-organisations-request
    description: 'Returns a paginated list of organisation creation requests. Supports filtering by entity type, status, name, and sector. Requires `cos_admin` role.

      **Log Type:** `USER_ACTION`

      '
    parameters:
    - $ref: ../components/parameters.yaml#/PageParam
    - $ref: ../components/parameters.yaml#/SizeParam
    - $ref: ../components/parameters.yaml#/SortingParam
    - $ref: ../components/parameters.yaml#/EntityTypeParam
    - $ref: ../components/parameters.yaml#/StatusParam
    - $ref: ../components/parameters.yaml#/OrgNameParam
    - $ref: ../components/parameters.yaml#/OrgSectorParam
    - $ref: ../components/parameters.yaml#/SearchTermParam
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  description: URN indicating the response status
                title:
                  type: string
                  description: Human-readable response title
                result:
                  type: array
                  description: List of organisation creation request records
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        description: Unique identifier of the creation request
                      requestedBy:
                        type: string
                        format: uuid
                        description: UUID of the user who submitted the request
                      name:
                        type: string
                        description: Name of the organisation
                      logoPath:
                        type: string
                        description: Path to the organisation logo
                      entityType:
                        type: string
                        description: Type of the organisation (e.g., Private, Public, Startup)
                      orgSector:
                        type: string
                        description: Sector of the organisation (e.g., Technology, Healthcare)
                      websiteLink:
                        type: string
                        description: Website URL of the organisation
                      address:
                        type: string
                        description: Physical address of the organisation
                      certificatePath:
                        type: string
                        description: Path to the organisation certificate document
                      pancardPath:
                        type: string
                        description: Path to the PAN card document
                      relevantDocPath:
                        type: string
                        nullable: true
                        description: Path to any relevant supporting document
                      status:
                        type: string
                        description: Current status of the request (pending, granted, rejected)
                      userName:
                        type: string
                        description: Display name of the requesting user
                      empId:
                        type: string
                        description: Employee ID of the requesting user
                      jobTitle:
                        type: string
                        description: Job title of the requesting user
                      orgManagerphoneNo:
                        type: string
                        description: Phone number of the organisation manager
                      managerEmail:
                        type: string
                        description: Email of the organisation manager
                      orgDocuments:
                        type: string
                        nullable: true
                        description: Path to organisation documents
                      createdAt:
                        type: string
                        format: date-time
                        description: Timestamp when the request was created
                      updatedAt:
                        type: string
                        format: date-time
                        description: Timestamp when the request was last updated
                      tableName:
                        type: string
                        description: Internal table name for the record
                paginationInfo:
                  $ref: ../components/schemas/pagination.yaml#/PaginationInfo
            examples:
              Example 1:
                value:
                  type: urn:dx:ControlPlane:success
                  title: Success
                  result:
                  - id: 41290efb-057b-4296-872c-a764f6ff5615
                    requestedBy: c908f4ed-69ef-4d27-8e50-8f95f89b6c4d
                    name: Quant Sandbox
                    logoPath: /logos/ai.png
                    entityType: Private
                    orgSector: Technology
                    websiteLink: https://ai.example.com
                    address: 123 Quant Labs, Bangalore, India
                    certificatePath: /documents/certificate.pdf
                    pancardPath: /documents/pancard.pdf
                    relevantDocPath: null
                    status: pending
                    userName: test test
                    empId: EMP12345
                    jobTitle: Manager
                    orgManagerphoneNo: +91-9876543210
                    managerEmail: manager@gmail.com
                    orgDocuments: null
                    createdAt: '2025-06-03T16:01:59.532782'
                    updatedAt: '2025-06-03T16:01:59.532782'
                    tableName: organization_create_requests
                  paginationInfo:
                    page: 1
                    size: 1
                    totalCount: 346
                    totalPages: 346
                    hasNext: true
                    hasPrevious: false
      '401':
        description: Unauthorized - Token invalid/expired or user not authorized
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/Unauthorized
      '403':
        description: Forbidden - Caller does not have `cos_admin` role
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/createNotificationForbidden
    security:
    - authorization: []
  post:
    summary: Submit a new organisation creation request (User)
    tags:
    - Organisation APIs
    description: 'Submits a new organisation creation request by the authenticated user. The request will be reviewed by a COS Admin who can approve or reject it. Requires an authenticated user token.

      **Log Type:** `USER_ACTION`

      '
    operationId: post-auth-v2-organisations-request
    requestBody:
      description: '- `name` : Name of the organization

        - `logo_path` : Path to the logo of the organization

        - `entity_type` : Type of the organization (e.g., Startup, Private, Government)

        - `org_sector` : Sector of the organization (e.g., Technology, Healthcare)

        - `website_link` : Website link of the organization

        - `address` : Address of the organization

        - `certificate_path` : Path to the certificate of the organization

        - `pancard_path` : Path to the PAN card of the user

        - `emp_id` : Employee ID of the organization

        - `job_title` : Job title of the person making the request

        - `phone_no` : Phone number of the organization

        - `organisation_documents` : Path to the organization documents

        - `manager_email` : Email of the organization manager

        - `relevant_doc_path` : Path to any relevant document

        '
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - name
            - entity_type
            - org_sector
            - website_link
            - address
            - certificate_path
            - pancard_path
            - emp_id
            - job_title
            - organisation_documents
            - manager_email
            properties:
              name:
                type: string
              logo_path:
                type: string
              entity_type:
                type: string
              org_sector:
                type: string
              website_link:
                type: string
              address:
                type: string
              certificate_path:
                type: string
              pancard_path:
                type: string
              emp_id:
                type: string
              job_title:
                type: string
              phone_no:
                type: string
              organisation_documents:
                type: string
              manager_email:
                type: string
              relevant_doc_path:
                type: string
                nullable: true
          examples:
            Example 1:
              value:
                name: Quantum Labs
                logo_path: /assets/logos/quantumlabs.png
                entity_type: Startup
                org_sector: Research & Development
                website_link: https://quantumlabs.io
                address: 42 Tech Boulevard, Hyderabad, India
                certificate_path: /docs/certificates/quantum_cert.pdf
                pancard_path: /docs/ids/quantum_pancard.pdf
                emp_id: EMP98765
                job_title: Operations Lead
                phone_no: +91-9123456789
                organisation_documents: /docs/organisations/quantum_docs.zip
                manager_email: manager@gmail.com
                relevant_doc_path: null
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                title:
                  type: string
                result:
                  type: object
                  properties:
                    id:
                      type: string
                    requestedBy:
                      type: string
                    name:
                      type: string
                    logoPath:
                      type: string
                    entityType:
                      type: string
                    orgSector:
                      type: string
                    websiteLink:
                      type: string
                    address:
                      type: string
                    certificatePath:
                      type: string
                    pancardPath:
                      type: string
                    relevantDocPath:
                      type: string
                      nullable: true
                    status:
                      type: string
                    userName:
                      type: string
                    empId:
                      type: string
                    jobTitle:
                      type: string
                    orgManagerphoneNo:
                      type: string
                    managerEmail:
                      type: string
                    orgDocuments:
                      type: string
                      nullable: true
                    createdAt:
                      type: string
                    updatedAt:
                      type: string
                    tableName:
                      type: string
            examples:
              Example 1:
                value:
                  type: urn:dx:ControlPlane:success
                  title: Success
                  result:
                    id: 4202493c-7c64-49b0-8f61-2000ca3d147c
                    requestedBy: c908f4ed-69ef-4d27-8e50-8f95f89b6c4d
                    name: Quants Sandbox
                    logoPath: /logos/ai.png
                    entityType: Private
                    orgSector: Technology
                    websiteLink: https://ai.example.com
                    address: 123 Quant Labs, Bangalore, India
                    certificatePath: /documents/certificate.pdf
                    pancardPath: /documents/pancard.pdf
                    relevantDocPath: null
                    status: pending
                    userName: test test
                    empId: EMP12345
                    jobTitle: Manager
                    orgManagerphoneNo: +91-9876543210
