      in: path
      required: true
      description: UUID of the request
      schema:
        type: string
        format: uuid
    - name: delegatorId
      in: query
      description: Unique ID of the delegator
      schema:
        type: string
        format: uuid
        pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                title:
                  type: string
                detail:
                  type: string
            examples:
              success:
                value:
                  type: urn:dx:controlPanel:success
                  title: Success
                  detail: Provider role updated
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                title:
                  type: string
                detail:
                  type: string
            examples:
