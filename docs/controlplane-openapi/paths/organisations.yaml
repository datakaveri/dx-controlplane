  post:
    tags:
    - Organisation – Join Requests
    summary: Submit an organisation join request (User)
    operationId: post-auth-v2-organisations-join-requests
    description: |
      Submits a request to join the specified organisation. The `user_id`, `user_name`,
      and `organization_id` are set automatically from the token and path parameter.

      **Validation rules:**
      - User must not already have a pending or granted join request for this org
      - `official_email` must not already be in use by another active join request
      - If the organisation has departments, `departmentId` is required; otherwise it must be omitted
      - `departmentRole` is the role asked for in that department: `member` (default) or
        `dept_admin`. `dept_admin` needs a department and a non-blank `purpose`;
        `purpose` is ignored for `member`.

      **Who approves:** a `member` request can be approved by the org_admin or the
      dept_admin of the chosen department or any department above it. A `dept_admin`
      request can only be approved by the org_admin or the dept_admin of a department
      *above* the chosen one. On approval the user becomes that department's dept_admin.

      **Log Type:** `USER_ACTION`
    security:
    - authorization: []
    x-codeSamples:
    - lang: cURL
      label: Submit org join request
      source: |
        curl --location --request POST 'https://${HOSTNAME}/iudx/v2/auth/organisations/{id}/join_requests' \
        --header 'Authorization: Bearer <your-token>' \
        --header 'Content-Type: application/json' \
        --data '{"job_title": "Software Engineer", "emp_id": "EMP001", "official_email": "john@techsolutions.com"}'
    - lang: cURL
      label: Join a department as its admin
      source: |
        curl --location --request POST 'https://${HOSTNAME}/iudx/v2/auth/organisations/{id}/join_requests' \
        --header 'Authorization: Bearer <your-token>' \
        --header 'Content-Type: application/json' \
        --data '{"job_title": "Lead", "emp_id": "EMP002", "official_email": "lead@techsolutions.com", "departmentId": "9b2e6f1c-1d3a-4c5b-8e7f-0a1b2c3d4e5f", "departmentRole": "dept_admin", "purpose": "I lead the Platform team and will review its members and assets."}'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - job_title
            - emp_id
            - official_email
            properties:
              job_title:
                type: string
                description: Job title of the applicant within the organisation.
              emp_id:
                type: string
                description: Employee ID of the applicant.
              official_email:
                type: string
                description: Official email of the applicant within the organisation. Must be unique.
              departmentId:
                type: string
                format: uuid
                description: |
                  Department to join, picked from the organisation's department tree.
                  Required when the organisation has departments; must be omitted otherwise.
              departmentRole:
                type: string
                enum: [member, dept_admin]
                default: member
                description: |
                  Role asked for in the chosen department. The UI's "User" is `member`
                  and "Admin" is `dept_admin`.
              purpose:
                type: string
                maxLength: 1000
                description: Why the user should administer the department. Required when `departmentRole` is `dept_admin`.
          examples:
            member:
              summary: Join a department as a User (member)
              value:
                job_title: Platform Engineer
                emp_id: ABC-0142
                official_email: priya.nair@abctech.example.com
                departmentId: 3e2a9f7c-5b3d-4c4a-9f0e-9d8c7b6a5f4e
                departmentRole: member
            deptAdmin:
              summary: Join a department as its Admin (purpose required)
              value:
                job_title: Head of Data Services
                emp_id: ABC-0057
                official_email: rahul.verma@abctech.example.com
                departmentId: 4f3b0a8d-6c4e-4d5b-8a1f-0e9d8c7b6a5f
                departmentRole: dept_admin
                purpose: I lead the Data Services team and will review its members, provider requests and datasets.
            flatOrganisation:
              summary: Organisation without departments
              value:
                job_title: Platform Engineer
                emp_id: ABC-0142
                official_email: priya.nair@abctech.example.com
    responses:
      '200':
        description: Join request created successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  example: urn:dx:controlPlane:success
                title:
                  type: string
                  example: Success
                detail:
                  type: string
                  example: Created Join request
      '400':
        description: Bad Request - Invalid request body
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/generalBadRequest
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/Unauthorized
      '409':
        description: Conflict - User already has an active join request or email already in use
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/generalBadRequest
