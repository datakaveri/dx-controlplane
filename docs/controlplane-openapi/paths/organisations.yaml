/iudx/v2/auth/user/organisations/requests/{id}:
  parameters:
  - name: id
    in: path
    required: true
    description: UUID of the organisation creation request to delete
    schema:
      type: string
      format: uuid
  delete:
    tags:
    - Organisation APIs
    summary: Delete a pending organisation creation request (User)
    operationId: delete-auth-v2-user-organisations-request
    description: |
      Deletes the user's own pending organisation creation request. Only `pending` requests
      can be deleted. The caller must be the original requester.

      **Log Type:** `USER_ACTION`
    security:
    - authorization: []
    x-codeSamples:
    - lang: cURL
      label: Delete pending org creation request
      source: |
        curl --location --request DELETE 'https://${HOSTNAME}/iudx/v2/auth/user/organisations/requests/{id}' \
        --header 'Authorization: Bearer <your-token>'
    responses:
      '200':
        description: Organisation creation request deleted successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  example: urn:dx:controlPlane:success
                title:
                  type: string
                  example: Success
                detail:
                  type: string
                  example: Organization request deleted successfully
      '400':
        description: Bad Request - Request not found or not in pending status
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/generalBadRequest
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/Unauthorized
      '403':
        description: Forbidden - Caller is not the original requester
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/Forbidden
            example:
              type: urn:dx:controlPlane:forbidden
              title: Forbidden
              detail: User does not have the required role.
