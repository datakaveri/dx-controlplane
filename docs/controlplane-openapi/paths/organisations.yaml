/iudx/v2/auth/organisation/join-request/{id}:
  parameters:
  - name: id
    in: path
    required: true
    description: UUID of the organisation join request to withdraw
    schema:
      type: string
      format: uuid
  patch:
    tags:
    - Organisation – Join Requests
    summary: Withdraw an organisation join request (User)
    operationId: withdraw-auth-v2-organisations-join-request
    description: |
      Allows the user to withdraw (set status to `withdrawn`) their own organisation
      join request. This is different from deletion — the record is retained but
      marked as withdrawn.

      **Log Type:** `USER_ACTION`
    security:
    - authorization: []
    requestBody:
      required: true
      description: |
        Request body containing the new status of the join request. Only `withdrawn` is allowed.
      content:
        application/json:
          schema:
            type: object
            required:
            - status
            properties:
              status:
                type: string
                enum:
                - withdrawn
                description: New status of the join request.
          examples:
            withdraw:
              value:
                status: withdrawn
    x-codeSamples:
    - lang: cURL
      label: Withdraw join request
      source: |
        curl --location --request PATCH 'https://${HOSTNAME}/iudx/v2/auth/organisation/join-request/{id}' \
        --header 'Authorization: Bearer <your-token>' \
        --header 'Content-Type: application/json' \
        --data '{
          "status": "withdrawn"
        }'
    responses:
      '200':
        description: Join request withdrawn successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  example: urn:dx:controlPlane:success
                title:
                  type: string
                  example: Success
                detail:
                  type: string
                  example: Organisation join request withdrawn successfully
      '400':
        description: Bad Request - Failed to withdraw join request
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/BadRequest
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/Unauthorized
      '403':
        description: Forbidden - Only pending join request can be withdrawn
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/Forbidden
            example:
              type: urn:dx:controlPlane:forbidden
              title: Forbidden
              detail: User does not have the required role.
      '404':
        description: Not Found - Request with given ID does not exist
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/NotFound
