/iudx/v2/auth/organization/user/provider_role/requests/{id}:
  put:
    summary: Update a provider role request (Org Admin)
    description: 'This API allows a organization administrator to update the status of a specific provider role request. The
      request is identified by its `id` in the path parameter. The request body should contain the new status for the provider
      role request. A successful response indicates that the provider role request has been updated.

      **Log Type:** `USER_ACTION`

      '
