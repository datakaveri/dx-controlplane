/iudx/v2/auth/organizations/{organization_id}/dept-admin-requests/{request_id}:
  parameters:
    - name: organization_id
      in: path
      required: true
      description: UUID of the organisation.
      schema:
        type: string
        format: uuid
    - name: request_id
      in: path
      required: true
      description: UUID of the dept_admin request.
      schema:
        type: string
        format: uuid

  put:
    tags:
      - Organisation – Department Admins
    summary: Approve or reject a dept_admin self-request
    operationId: put-auth-v2-organisation-dept-admin-request
    description: |
      Org_admin, or a strict ancestor dept_admin above the requester's
      department, approves or rejects the request.

      **Log Type:** `USER_ACTION`
    security:
      - authorization: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - status
            properties:
              status:
                type: string
                enum: [granted, rejected]
              remarks:
                type: string
          examples:
            approve:
              summary: Approve (only someone above the department may)
              value:
                status: granted
                remarks: Welcome aboard
            reject:
              summary: Reject
              value:
                status: rejected
                remarks: Platform already has an admin
    responses:
      '200':
        description: Dept_admin request updated successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  example: urn:dx:controlPlane:success
                title:
                  type: string
                  example: Success
      '400':
        description: Bad Request - Invalid status
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/generalBadRequest
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/Unauthorized
      '403':
        description: Forbidden - Caller is not an authorised approver for this department
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/Forbidden
      '404':
        description: Not Found - Request does not exist
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/NotFound
      '409':
        description: Conflict - Request has already been processed
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/unAuthorizedAccess
/iudx/v2/auth/organisations/{id}/department/join_requests:
  parameters:
  - name: id
    in: path
    required: true
    description: UUID of the organisation
    schema:
      type: string
      format: uuid
  get:
    tags:
    - Organisation – Join Requests
    summary: Get join requests for my department and its sub-departments (Dept Admin)
    operationId: get-auth-v2-organisations-department-join-requests
    description: |
      Returns a paginated list of join requests whose requested department is the
      department the caller administers or any of its sub-departments.
      Restricted to `dept_admin` users; the caller's organisation (from token) must
      match the `{id}` path parameter. Results are enriched with user role information.

      Requests to become the admin (`requested_role: dept_admin`) of the caller's *own*
      department are left out: only someone above that department can approve them.
      Such requests for sub-departments are included.

