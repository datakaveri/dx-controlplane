        --header 'Authorization: Bearer <your-token>' \
        --header 'Content-Type: application/json' \
        --data '{"status": "granted"}'
    - lang: cURL
      label: Reject provider role request
      source: |
        curl --location --request PUT 'https://${HOSTNAME}/iudx/v2/auth/organization/user/provider_role/requests/{id}' \
        --header 'Authorization: Bearer <your-token>' \
