/iudx/v2/auth/organisations/{id}/join_requests:
  parameters:
  - name: id
    in: path
    required: true
    description: UUID of the organisation
    schema:
      type: string
      format: uuid
  get:
    tags:
    - Organisation APIs
    summary: Get join requests for an organisation (Org Admin)
    operationId: get-auth-v2-organisations-join-requests
    description: |
      Returns a paginated list of join requests for the specified organisation.
      The caller's organisation ID (from token) must match the `{id}` path parameter.
      Results are enriched with user role information.

      **Log Type:** `USER_ACTION`
    security:
    - authorization: []
    parameters:
    - $ref: ../components/parameters.yaml#/PageParam
    - $ref: ../components/parameters.yaml#/SizeParam
    - $ref: ../components/parameters.yaml#/SortingParam
    - $ref: ../components/parameters.yaml#/StatusParam
    x-codeSamples:
    - lang: cURL
      label: Get org join requests
      source: |
        curl --location 'https://${HOSTNAME}/iudx/v2/auth/organisations/{id}/join_requests?status=pending&page=1&size=10' \
        --header 'Authorization: Bearer <your-token>'
    responses:
      '200':
        description: Paginated list of join requests for the organisation
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  example: urn:dx:controlPlane:success
                title:
                  type: string
                  example: Success
                result:
                  type: array
                  items:
                    allOf:
                    - $ref: ../components/schemas/organisation.yaml#/OrgJoinRequestItem
                    - type: object
                      properties:
                        roles:
                          type: array
                          items:
                            type: string
                          description: Keycloak roles of the user
                        accountEnabled:
                          type: boolean
                          description: Whether the user's account is active in Keycloak
                paginationInfo:
                  $ref: ../components/schemas/pagination.yaml#/PaginationInfo
            example:
              type: urn:dx:controlPlane:success
              title: Success
              result:
              - id: 7a1b2c3d-4e5f-6789-abcd-ef0123456789
                organizationId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                userId: c908f4ed-69ef-4d27-8e50-8f95f89b6c4d
                userName: John Doe
                status: pending
                jobTitle: Software Engineer
                empId: EMP001
                officialEmail: john@techsolutions.com
                requestedAt: '2025-06-04T10:54:53.301846'
                roles: [consumer]
                accountEnabled: true
              paginationInfo:
                page: 1
                size: 10
                totalCount: 5
                totalPages: 1
                hasNext: false
                hasPrevious: false
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/Unauthorized
      '403':
        description: Forbidden - Caller's org ID does not match path parameter
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/Forbidden
            example:
              type: urn:dx:controlPlane:forbidden
              title: Forbidden
              detail: User does not have the required role.
  post:
    tags:
    - Organisation APIs
    summary: Submit an organisation join request (User)
    operationId: post-auth-v2-organisations-join-requests
    description: |
      Submits a request to join the specified organisation. The `user_id`, `user_name`,
      and `organization_id` are set automatically from the token and path parameter.

      **Validation rules:**
      - User must not already have a pending or granted join request for this org
      - `official_email` must not already be in use by another active join request

      **Log Type:** `USER_ACTION`
    security:
    - authorization: []
    x-codeSamples:
    - lang: cURL
      label: Submit org join request
      source: |
        curl --location --request POST 'https://${HOSTNAME}/iudx/v2/auth/organisations/{id}/join_requests' \
        --header 'Authorization: Bearer <your-token>' \
        --header 'Content-Type: application/json' \
        --data '{"job_title": "Software Engineer", "emp_id": "EMP001", "official_email": "john@techsolutions.com"}'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - job_title
            - emp_id
            - official_email
            properties:
              job_title:
                type: string
                description: Job title of the applicant within the organisation.
              emp_id:
                type: string
                description: Employee ID of the applicant.
              official_email:
                type: string
                description: Official email of the applicant within the organisation. Must be unique.
    responses:
      '200':
        description: Join request created successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  example: urn:dx:controlPlane:success
                title:
                  type: string
                  example: Success
                detail:
                  type: string
                  example: Created Join request
      '400':
        description: Bad Request - Invalid request body
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/generalBadRequest
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/Unauthorized
      '409':
        description: Conflict - User already has an active join request or email already in use
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/generalBadRequest
/iudx/v2/auth/organisations/{org_id}/join_requests/{req_id}:
  parameters:
  - name: org_id
    in: path
    required: true
    description: UUID of the organisation
    schema:
      type: string
      format: uuid
  - name: req_id
    in: path
    required: true
    description: UUID of the join request to approve or reject
    schema:
      type: string
      format: uuid
  put:
    tags:
    - Organisation APIs
    summary: Approve or reject an organisation join request (Org Admin)
    operationId: put-auth-v2-organisations-join-requests
    description: |
      Allows an org admin to approve or reject a pending join request for their organisation.
      The caller's organisation ID (from token) must match the `{org_id}` path parameter.
      An email notification is sent to the user upon status update.

      **Log Type:** `USER_ACTION`
    security:
    - authorization: []
    x-codeSamples:
    - lang: cURL
      label: Approve join request
      source: |
        curl --location --request PUT 'https://${HOSTNAME}/iudx/v2/auth/organisations/{org_id}/join_requests/{req_id}' \
        --header 'Authorization: Bearer <your-token>' \
        --header 'Content-Type: application/json' \
        --data '{"status": "granted"}'
    - lang: cURL
      label: Reject join request
      source: |
        curl --location --request PUT 'https://${HOSTNAME}/iudx/v2/auth/organisations/{org_id}/join_requests/{req_id}' \
        --header 'Authorization: Bearer <your-token>' \
        --header 'Content-Type: application/json' \
        --data '{"status": "rejected"}'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - status
            properties:
              status:
                type: string
                enum: [granted, rejected]
                description: New status for the join request.
    responses:
      '200':
        description: Join request status updated successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  example: urn:dx:controlPlane:success
                title:
                  type: string
                  example: Success
                detail:
                  type: string
