/iudx/v2/auth/user/organisations/requests/{id}:
  parameters:
  - name: id
    in: path
    required: true
    description: UUID of the organisation creation request to delete or withdraw
    schema:
      type: string
      format: uuid
  delete:
    tags:
    - Organisation – Creation Requests
    summary: Delete a pending organisation creation request (User)
    operationId: delete-auth-v2-user-organisations-request
    description: |
      Deletes the user's own pending organisation creation request. Only `pending` requests
      can be deleted. The caller must be the original requester.

      **Log Type:** `USER_ACTION`
    security:
    - authorization: []
    x-codeSamples:
    - lang: cURL
      label: Delete pending org creation request
      source: |
        curl --location --request DELETE 'https://${HOSTNAME}/iudx/v2/auth/user/organisations/requests/{id}' \
        --header 'Authorization: Bearer <your-token>'
    responses:
      '200':
        description: Organisation creation request deleted successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  example: urn:dx:controlPlane:success
                title:
                  type: string
                  example: Success
                detail:
                  type: string
                  example: Organization request deleted successfully
      '400':
        description: Bad Request - Request not found or not in pending status
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/generalBadRequest
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/Unauthorized
      '403':
        description: Forbidden - Caller is not the original requester
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/Forbidden
            example:
              type: urn:dx:controlPlane:forbidden
              title: Forbidden
              detail: User does not have the required role.
  patch:
    tags:
    - Organisation – Creation Requests
    summary: Withdraw a pending organisation creation request (User)
    operationId: withdraw-auth-v2-user-organisations-request
    description: |
      Lets the requester cancel their own organisation creation request before a
      COS Admin approves or rejects it. Unlike `DELETE`, the record is kept with
      status `withdrawn`, so it still shows in the user's own request history.

      A withdrawn request leaves the COS Admin queue: `GET /iudx/v2/auth/organisations/requests`
      omits withdrawn requests unless called with `?status=withdrawn`, and it can no
      longer be approved or rejected.

      Only `pending` requests can be withdrawn. A request that is not the caller's own
      is reported as not found.

      **Log Type:** `USER_ACTION`
    security:
    - authorization: []
    requestBody:
      required: true
      description: Only `withdrawn` is allowed.
      content:
        application/json:
          schema:
            type: object
            required:
            - status
            properties:
              status:
                type: string
                enum:
                - withdrawn
                description: New status of the request.
          examples:
            withdraw:
              value:
                status: withdrawn
    x-codeSamples:
    - lang: cURL
      label: Withdraw org creation request
      source: |
        curl --location --request PATCH 'https://${HOSTNAME}/iudx/v2/auth/user/organisations/requests/{id}' \
        --header 'Authorization: Bearer <your-token>' \
        --header 'Content-Type: application/json' \
        --data '{"status": "withdrawn"}'
    responses:
      '200':
        description: Organisation creation request withdrawn successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  example: urn:dx:controlPlane:success
                title:
                  type: string
                  example: Success
                detail:
                  type: string
                  example: Organisation create request withdrawn successfully
      '400':
        description: Bad Request - `status` is missing or not `withdrawn`
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/generalBadRequest
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/Unauthorized
      '404':
        description: Not Found - No request with this ID belongs to the caller
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/NotFound
      '409':
        description: Conflict - The request is no longer pending (already granted, rejected or withdrawn)
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/generalBadRequest
            example:
              type: urn:dx:controlPlane:conflict
              title: Conflict
              detail: Only a pending request can be withdrawn; this request is already granted
