        --header 'Authorization: Bearer <your-token>'
    responses:
      '200':
        description: The user's provider role request, or empty object if none found
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  example: urn:dx:controlPlane:success
                title:
                  type: string
                  example: Success
                result:
                  type: object
                  nullable: true
                  properties:
                    id:
                      type: string
                      format: uuid
                    userId:
                      type: string
                      format: uuid
                    orgId:
                      type: string
                      format: uuid
                      nullable: true
                    providerType:
                      type: string
                      enum: [org, platform]
                    status:
                      type: string
                      enum: [pending, granted, rejected]
                    createdAt:
                      type: string
                      format: date-time
                    updatedAt:
                      type: string
                      format: date-time
                    roles:
                      type: array
                      items:
                        type: string
                    accountEnabled:
                      type: boolean
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
