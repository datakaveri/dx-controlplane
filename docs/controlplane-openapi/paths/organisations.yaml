      status, job title, employee ID, official email, and any assigned roles. Pagination information is also included in the
      response.

      **Log Type:** `USER_ACTION`

      '
    parameters:
    - name: status
      in: query
      required: false
      description: Filter join requests by their status.
      schema:
        type: string
        enum:
        - pending
        - granted
        - rejected
    - $ref: ../components/parameters.yaml#/PageParam
    - $ref: ../components/parameters.yaml#/SizeParam
