/iudx/v2/auth/organizations/{organization_id}/hierarchy/definition-requests:
  parameters:
    - name: organization_id
      in: path
      required: true
      description: UUID of the organisation.
      schema:
        type: string
        format: uuid

  post:
    tags:
      - Organisation – Hierarchy Definition
    summary: Propose departments for the organisation (define or add later)
    operationId: post-auth-v2-organisation-hierarchy-definition-requests
    description: |
      Org_admin proposes departments for their own organisation. Cos_admin approves
      or rejects the whole proposal as a single atomic unit (see the approve
      endpoint below) -- there is no per-department approval step.

      Every organisation starts flat. The first request defines its departments.
      Departments can be **added later** with further requests:
      - omit `parentDepartmentId` to add new top-level departments, or
      - set `parentDepartmentId` to an existing department to add departments
        (each with optional sub-departments) under it.

      Only one request can be pending per organisation at a time. The proposal is
      checked when submitted and again when approved.

      **Tree rules:**
      - The organisation itself is the top of the tree; with no `parentDepartmentId`
        the listed departments are top-level (level 1) departments, each with
        optional nested `subDepartments`.
      - Department names must be non-blank and unique among siblings -- including
        departments that already exist at the same place.
      - There is no depth limit in the API; the UI limits trees to 4 levels.
      - The org_admin administers the whole organisation by role and is not
        attached to any department.

      **Log Type:** `USER_ACTION`
    security:
      - authorization: []
    x-codeSamples:
      - lang: cURL
        label: Submit a department tree
        source: |
          curl --location --request POST 'https://${HOSTNAME}/iudx/v2/auth/organisations/{organization_id}/hierarchy/definition-requests' \
          --header 'Authorization: Bearer <your-token>' \
          --header 'Content-Type: application/json' \
          --data '{
            "departments": [
              {
                "name": "Engineering",
                "subDepartments": [
                  { "name": "Data Platform" },
                  { "name": "Field Systems" }
                ]
              },
              { "name": "Finance" }
            ]
          }'
      - lang: cURL
        label: Add departments later, under an existing department
        source: |
          curl --location --request POST 'https://${HOSTNAME}/iudx/v2/auth/organisations/{organization_id}/hierarchy/definition-requests' \
          --header 'Authorization: Bearer <your-token>' \
          --header 'Content-Type: application/json' \
          --data '{
            "parentDepartmentId": "2d1f8e6b-4a2c-4b3f-8e9d-8c7b6a5f4e3d",
            "departments": [ { "name": "Payments", "subDepartments": [ { "name": "Refunds" } ] } ]
          }'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - departments
            properties:
              departments:
                type: array
                minItems: 1
                description: |
                  The organisation's top-level departments, each with nested
                  `subDepartments`. The organisation itself is the implicit top
                  of the tree. No ids are sent -- the server generates them when
                  the tree is applied.
                items:
                  $ref: ../components/schemas/organisation.yaml#/ProposedDepartment
              parentDepartmentId:
                type: string
                format: uuid
                description: |
                  Existing department to add the departments under. Omit to add
                  top-level departments (and for an organisation's first request).
          examples:
            firstDepartments:
              summary: 'Flat organisation: define its first departments'
              value:
                departments:
                - name: Google
                  subDepartments:
                  - name: Engineering
                    subDepartments:
                    - name: Platform
                      subDepartments:
                      - name: Data Services
                - name: Finance
                  subDepartments:
                  - name: Payments
            addTopLevel:
              summary: 'Add later: new top-level departments'
              value:
                departments:
                - name: Legal
                - name: Human Resources
            addUnderExisting:
              summary: 'Add later: departments under an existing department (Finance)'
              value:
                parentDepartmentId: 5a4c1b9e-7d5f-4e6c-9b2a-1f0e9d8c7b6a
                departments:
                - name: Audit
                  subDepartments:
                  - name: Internal Audit
    responses:
      '201':
        description: Hierarchy definition request submitted successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  example: urn:dx:controlPlane:success
                title:
                  type: string
                  example: Success
                result:
                  $ref: ../components/schemas/organisation.yaml#/OrganizationHierarchyDefinitionRequest
            example:
              type: urn:dx:controlPlane:success
              title: Success
              result:
                id: 0a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
                organizationId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                parentNodeId: 5a4c1b9e-7d5f-4e6c-9b2a-1f0e9d8c7b6a
                departments:
                - name: Audit
                  subDepartments:
                  - name: Internal Audit
                    subDepartments: []
                status: pending
                remarks: null
                createdAt: '2026-11-20T09:30:00.000000'
                updatedAt: '2026-11-20T09:30:00.000000'
                parentDepartment:
                  id: 5a4c1b9e-7d5f-4e6c-9b2a-1f0e9d8c7b6a
                  name: Finance
                  hierarchy:
                  - id: 5a4c1b9e-7d5f-4e6c-9b2a-1f0e9d8c7b6a
                    name: Finance
                  hierarchyLabel: Finance
      '400':
        description: Bad Request - Invalid or empty proposed department tree
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/generalBadRequest
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/Unauthorized
      '403':
        description: Forbidden - Caller is not the organisation's admin
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/Forbidden
      '404':
        description: Not Found - Organisation does not exist, or `parentDepartmentId` is not one of its departments
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/NotFound
      '409':
        description: Conflict - A request is already pending, or a proposed name already exists at that place
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/unAuthorizedAccess

