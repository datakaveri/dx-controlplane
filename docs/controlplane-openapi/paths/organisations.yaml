/iudx/v2/auth/organisations/requests:
  get:
    tags:
    - Organisation – Creation Requests
    summary: Get all organisation creation requests (COS Admin)
    operationId: get-auth-v2-organisations-request
    description: |
      Returns a paginated list of all organisation creation requests submitted on the platform.
      Supports filtering by status, entity type, org name, sector, and free-text search.
      Withdrawn requests are omitted unless `status=withdrawn` is passed explicitly.
      Requires `cos_admin` role.

      **Log Type:** `USER_ACTION`
    security:
    - authorization: []
    parameters:
    - $ref: ../components/parameters.yaml#/PageParam
    - $ref: ../components/parameters.yaml#/SizeParam
    - $ref: ../components/parameters.yaml#/SortingParam
    - $ref: ../components/parameters.yaml#/EntityTypeParam
    - $ref: ../components/parameters.yaml#/StatusParam
    - $ref: ../components/parameters.yaml#/OrgNameParam
    - $ref: ../components/parameters.yaml#/OrgSectorParam
    - $ref: ../components/parameters.yaml#/SearchTermParam
    x-codeSamples:
    - lang: cURL
      label: Get all org create requests
      source: |
        curl --location 'https://${HOSTNAME}/iudx/v2/auth/organisations/requests?status=pending&page=1&size=10' \
        --header 'Authorization: Bearer <your-token>'
    responses:
      '200':
        description: Paginated list of organisation creation requests
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  example: urn:dx:controlPlane:success
                title:
                  type: string
                  example: Success
                result:
                  type: array
                  items:
                    $ref: ../components/schemas/organisation.yaml#/OrgCreateRequestItem
                paginationInfo:
                  $ref: ../components/schemas/pagination.yaml#/PaginationInfo
            example:
              type: urn:dx:controlPlane:success
              title: Success
              result:
              - id: 7e6d5c4b-3a29-4f18-8e07-d6c5b4a39281
                requestedBy: c908f4ed-69ef-4d27-8e50-8f95f89b6c4d
                name: ABC Technologies
                entityType: private
                orgSector: technology
                websiteLink: https://abctech.example.com
                address: 4th Floor, Tech Park, Bengaluru
                certificatePath: /docs/abc/certificate.pdf
                pancardPath: /docs/abc/pan.pdf
                status: pending
                userName: Asha Rao
                empId: ABC-0001
                jobTitle: Chief Technology Officer
                managerEmail: owner@abctech.example.com
                orgDocuments: /docs/abc/registration.pdf
                createdAt: '2026-11-20T09:30:00.000000'
                updatedAt: '2026-11-20T09:30:00.000000'
                departments:
                - name: Google
                  subDepartments:
                  - name: Engineering
                    subDepartments:
                    - name: Platform
                      subDepartments:
                      - name: Data Services
                        subDepartments: []
                - name: Finance
                  subDepartments:
                  - name: Payments
                    subDepartments: []
              - id: 8f7e6d5c-4b3a-4029-9f18-e7d6c5b4a392
                requestedBy: c908f4ed-69ef-4d27-8e50-8f95f89b6c4d
                name: Northwind Logistics
                entityType: private
                orgSector: technology
                websiteLink: https://abctech.example.com
                address: 4th Floor, Tech Park, Bengaluru
                certificatePath: /docs/abc/certificate.pdf
                pancardPath: /docs/abc/pan.pdf
                status: granted
                userName: Asha Rao
                empId: ABC-0001
                jobTitle: Chief Technology Officer
                managerEmail: owner@abctech.example.com
                orgDocuments: /docs/abc/registration.pdf
                createdAt: '2026-11-20T09:30:00.000000'
                updatedAt: '2026-11-20T09:30:00.000000'
                departments: []
              paginationInfo:
                page: 1
                size: 10
                totalCount: 2
                totalPages: 1
                hasNext: false
                hasPrevious: false
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/Unauthorized
      '403':
        description: Forbidden - Caller does not have `cos_admin` role
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/Forbidden
            example:
              type: urn:dx:controlPlane:forbidden
              title: Forbidden
              detail: User does not have the required role.
  post:
    tags:
    - Organisation – Creation Requests
    summary: Submit an organisation creation request (User)
    operationId: post-auth-v2-organisations-request
    description: |
      Submits a new request to create an organisation on the platform. The request will be
      reviewed by a COS Admin who can approve or reject it.

      **Validation rules:**
      - User must not already have a pending or granted org create request
      - Organisation name must be unique (case-insensitive, among pending/granted requests)
      - Manager email must not already be in use by another active org request
      - `requested_by` and `user_name` are set automatically from the authenticated token
      - `departments` (optional) proposes the organisation's department hierarchy along with
        the request. It is validated on submission (non-empty, no blank names, no duplicate
        names under the same parent) and applied when the COS Admin grants the request. Omit it
        to create a flat organisation; the hierarchy can still be defined later via a hierarchy
        definition request.

      **Log Type:** `USER_ACTION`
    security:
    - authorization: []
    x-codeSamples:
    - lang: cURL
      label: Submit org creation request
      source: |
        curl --location --request POST 'https://${HOSTNAME}/iudx/v2/auth/organisations/requests' \
        --header 'Authorization: Bearer <your-token>' \
        --header 'Content-Type: application/json' \
        --data '{
          "name": "Tech Solutions Pvt Ltd",
          "entity_type": "private",
          "org_sector": "technology",
          "website_link": "https://techsolutions.example.com",
          "address": "123 Tech Park, Bengaluru",
          "certificate_path": "/docs/cert.pdf",
          "pancard_path": "/docs/pan.pdf",
          "emp_id": "EMP001",
          "job_title": "CTO",
          "manager_email": "manager@techsolutions.com",
          "organisation_documents": "/docs/org.pdf"
        }'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - name
            - entity_type
            - org_sector
            - website_link
            - address
            - certificate_path
            - pancard_path
            - emp_id
            - job_title
            - manager_email
            - organisation_documents
            properties:
              name:
                type: string
                description: Name of the organisation. Must be unique across all pending/granted requests.
              entity_type:
                type: string
                description: Type of entity (e.g. private, government, academic, ngo).
              org_sector:
                type: string
                description: Sector the organisation operates in (e.g. technology, healthcare).
              website_link:
                type: string
                description: Official website URL of the organisation.
              address:
                type: string
                description: Registered address of the organisation.
              certificate_path:
                type: string
                description: File path or URL of the organisation's registration certificate.
              pancard_path:
                type: string
                description: File path or URL of the PAN card.
              emp_id:
                type: string
                description: Employee ID of the applicant within the organisation.
              job_title:
                type: string
                description: Job title of the applicant.
              manager_email:
                type: string
                description: Official email of the organisation manager. Must be unique.
              organisation_documents:
                type: string
                description: Path or URL to supporting organisation documents.
              logo_path:
                type: string
                nullable: true
                description: Optional path or URL to the organisation logo.
              relevant_doc_path:
                type: string
                nullable: true
                description: Optional path or URL to any other relevant document.
              phone_no:
                type: string
                nullable: true
                description: Optional contact phone number.
              departments:
                type: array
                minItems: 1
                description: |
                  Optional. The organisation's top-level departments, each with nested
                  `subDepartments`. The organisation itself is the implicit top of the tree; no ids
                  are sent. Applied when the request is granted.
                items:
                  $ref: ../components/schemas/organisation.yaml#/ProposedDepartment
          examples:
            withDepartments:
              summary: Organisation with a department tree (up to 4 levels deep)
              value:
                name: ABC Technologies
                entity_type: private
                org_sector: technology
                website_link: https://abctech.example.com
                address: 4th Floor, Tech Park, Bengaluru
                certificate_path: /docs/abc/certificate.pdf
                pancard_path: /docs/abc/pan.pdf
                emp_id: ABC-0001
                job_title: Chief Technology Officer
                manager_email: owner@abctech.example.com
                organisation_documents: /docs/abc/registration.pdf
                departments:
                - name: Google
                  subDepartments:
                  - name: Engineering
                    subDepartments:
                    - name: Platform
                      subDepartments:
                      - name: Data Services
                - name: Finance
                  subDepartments:
                  - name: Payments
            flat:
              summary: Flat organisation (no departments)
              value:
                name: ABC Technologies
                entity_type: private
                org_sector: technology
                website_link: https://abctech.example.com
                address: 4th Floor, Tech Park, Bengaluru
                certificate_path: /docs/abc/certificate.pdf
                pancard_path: /docs/abc/pan.pdf
                emp_id: ABC-0001
                job_title: Chief Technology Officer
                manager_email: owner@abctech.example.com
                organisation_documents: /docs/abc/registration.pdf
    responses:
      '200':
        description: Organisation creation request submitted successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  example: urn:dx:controlPlane:success
                title:
                  type: string
                  example: Success
                result:
                  $ref: ../components/schemas/organisation.yaml#/OrgCreateRequestItem
            example:
              type: urn:dx:controlPlane:success
              title: Success
              result:
                id: 7e6d5c4b-3a29-4f18-8e07-d6c5b4a39281
                requestedBy: c908f4ed-69ef-4d27-8e50-8f95f89b6c4d
                name: ABC Technologies
                entityType: private
                orgSector: technology
                websiteLink: https://abctech.example.com
                address: 4th Floor, Tech Park, Bengaluru
                certificatePath: /docs/abc/certificate.pdf
                pancardPath: /docs/abc/pan.pdf
                status: pending
                userName: Asha Rao
                empId: ABC-0001
                jobTitle: Chief Technology Officer
                managerEmail: owner@abctech.example.com
                orgDocuments: /docs/abc/registration.pdf
                createdAt: '2026-11-20T09:30:00.000000'
                updatedAt: '2026-11-20T09:30:00.000000'
                departments:
                - name: Google
                  subDepartments:
                  - name: Engineering
                    subDepartments:
                    - name: Platform
                      subDepartments:
                      - name: Data Services
                        subDepartments: []
                - name: Finance
                  subDepartments:
                  - name: Payments
                    subDepartments: []
      '400':
        description: Bad Request - Body missing or invalid
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/generalBadRequest
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/Unauthorized
      '409':
        description: Conflict - Duplicate request, name, or manager email already in use
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/generalBadRequest
/iudx/v2/auth/organisations/requests/approve:
  post:
    tags:
    - Organisation – Creation Requests
    summary: Approve or reject an organisation creation request (COS Admin)
    operationId: post-auth-v2-approve-create_org
    description: |
      Allows a COS Admin to approve or reject a pending organisation creation request.
      On approval, the organisation is created and the requester is notified. If the request
      carries a `proposed_hierarchy`, its department tree is created for the new organisation in the same call.

      **Log Type:** `USER_ACTION`
    security:
    - authorization: []
    x-codeSamples:
    - lang: cURL
      label: Approve org creation request
      source: |
        curl --location --request POST 'https://${HOSTNAME}/iudx/v2/auth/organisations/requests/approve' \
        --header 'Authorization: Bearer <your-token>' \
        --header 'Content-Type: application/json' \
        --data '{"req_id": "3fa85f64-5717-4562-b3fc-2c963f66afa6", "status": "granted"}'
    - lang: cURL
      label: Reject org creation request
      source: |
        curl --location --request POST 'https://${HOSTNAME}/iudx/v2/auth/organisations/requests/approve' \
        --header 'Authorization: Bearer <your-token>' \
        --header 'Content-Type: application/json' \
        --data '{"req_id": "3fa85f64-5717-4562-b3fc-2c963f66afa6", "status": "rejected"}'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - req_id
            - status
            properties:
              req_id:
                type: string
                format: uuid
                description: UUID of the org creation request to approve or reject.
              status:
                type: string
                enum: [granted, rejected]
                description: New status for the request.
          examples:
            approve:
              summary: 'Approve: creates the organisation and its departments'
              value:
                req_id: 7e6d5c4b-3a29-4f18-8e07-d6c5b4a39281
                status: granted
            reject:
              summary: Reject
              value:
                req_id: 7e6d5c4b-3a29-4f18-8e07-d6c5b4a39281
                status: rejected
    responses:
      '200':
        description: Request status updated successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  example: urn:dx:controlPlane:success
                title:
                  type: string
                  example: Success
                detail:
                  type: string
                  example: Organisation create request approved successfully
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/Unauthorized
      '403':
        description: Forbidden - Caller does not have `cos_admin` role
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/Forbidden
            example:
              type: urn:dx:controlPlane:forbidden
              title: Forbidden
              detail: User does not have the required role.
      '404':
        description: Not Found - Request with given ID does not exist
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/NotFound
      '409':
        description: Conflict - The request is not pending (already granted, rejected or withdrawn by the requester)
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/generalBadRequest
            example:
              type: urn:dx:controlPlane:conflict
              title: Conflict
              detail: Request has already been withdrawn
