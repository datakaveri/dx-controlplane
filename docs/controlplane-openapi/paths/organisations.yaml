/iudx/v2/auth/organizations/{organization_id}/hierarchy/definition-requests:
  parameters:
    - name: organization_id
      in: path
      required: true
      description: UUID of the organisation.
      schema:
        type: string
        format: uuid

  post:
    tags:
      - Organisation APIs
    summary: Submit a department hierarchy definition request
    operationId: post-auth-v2-organisation-hierarchy-definition-requests
    description: |
      Org_admin submits the organisation's entire proposed department tree in
      one request. Cos_admin approves or rejects the whole tree as a single
      atomic unit (see the approve endpoint below) -- there is no per-department
      approval step.

      Every organisation starts flat. The hierarchy can be defined only once:
      the organisation must not already have a department tree, and departments
      cannot be added individually afterwards.

      **Tree rules:**
      - The organisation itself is the top of the tree; the listed departments
        are its top-level (level 1) departments, each with optional nested
        `subDepartments`.
      - Department names must be non-blank and unique among siblings.
      - The org_admin administers the whole organisation by role and is not
        attached to any department.

      **Log Type:** `USER_ACTION`
    security:
      - authorization: []
    x-codeSamples:
      - lang: cURL
        label: Submit a department tree
        source: |
          curl --location --request POST 'https://${HOSTNAME}/iudx/v2/auth/organisations/{organization_id}/hierarchy/definition-requests' \
          --header 'Authorization: Bearer <your-token>' \
          --header 'Content-Type: application/json' \
          --data '{
            "departments": [
              {
                "name": "Engineering",
                "subDepartments": [
                  { "name": "Data Platform" },
                  { "name": "Field Systems" }
                ]
              },
              { "name": "Finance" }
            ]
          }'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - departments
            properties:
              departments:
                type: array
                minItems: 1
                description: |
                  The organisation's top-level departments, each with nested
                  `subDepartments`. The organisation itself is the implicit top
                  of the tree. No ids are sent -- the server generates them when
                  the tree is applied.
                items:
                  $ref: ../components/schemas/organisation.yaml#/ProposedDepartment
    responses:
      '201':
        description: Hierarchy definition request submitted successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  example: urn:dx:controlPlane:success
                title:
                  type: string
                  example: Success
                result:
                  $ref: ../components/schemas/organisation.yaml#/OrganizationHierarchyDefinitionRequest
      '400':
        description: Bad Request - Invalid or empty proposed department tree
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/generalBadRequest
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/Unauthorized
      '403':
        description: Forbidden - Caller is not the organisation's admin
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/Forbidden
      '404':
        description: Not Found - Organisation does not exist
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/NotFound
      '409':
        description: Conflict - Organisation already has a hierarchy, or a request is already pending
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/unAuthorizedAccess

  get:
    tags:
