                        description: Official email of the user.
                      requestedAt:
                        type: string
                        description: Timestamp when the join request was made.
                      processedAt:
                        type: string
                        description: Timestamp when the join request was processed.
                      roles:
                        type: array
                        items:
                          type: string
                        description: Roles associated with the user within the organization.
                      tableName:
                        type: string
                        description: Internal table name for the request.
                paginationInfo:
                  type: object
                  properties:
                    page:
                      type: integer
                      description: Current page number.
                    size:
                      type: integer
                      description: Number of items per page.
                    totalCount:
                      type: integer
                      description: Total number of documents which matched the query.
                    totalPages:
                      type: integer
                      description: Total number of pages available.
                    hasNext:
                      type: boolean
                      description: Indicates if more pages are available.
                    hasPrevious:
