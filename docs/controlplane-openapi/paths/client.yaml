/iudx/v2/auth/client:
  post:
    tags:
    - Client APIs
    description: 'Create a new client credential (clientId and clientSecret) for the authenticated user. The generated credentials can be used to obtain access tokens via the `/auth/v2/token` endpoint. Requires a valid authorization token.

      '
    operationId: post-create-client-secret
    security:
    - authorization: []
    responses:
      '201':
        description: Client credentials created successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  example: dx:controlPlane:success
                title:
                  type: string
                  example: Success
                result:
                  type: object
                  properties:
                    userId:
                      type: string
                      format: uuid
                      example: e0782a4e-3bdb-43e3-be8c-7beafb89efc8
                    clientId:
                      type: string
                      format: uuid
                      example: b321c4a8-7183-425b-9942-6b6b668c628c
                    clientSecret:
                      type: string
                      example: 9a9c944dfb215e444135d76c6baa8c6e51272a33
                    createdAt:
                      type: string
                      format: date-time
                      example: '2025-09-12T07:43:54.999972'
                    updatedAt:
                      type: string
                      format: date-time
                      example: '2025-10-29T11:38:48.246431'
      '400':
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/GenericBadRequestResponse
      '401':
        description: Unauthorized - Missing or invalid token
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/UnauthorizedResponse
            example:
              type: urn:dx:controlPlane:notAuthorized
              title: Not Authorized
              detail: Missing or invalid Bearer token
      '403':
        description: Forbidden - Insufficient permissions
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ForbiddenResponse
            example:
              type: urn:dx:controlPlane:forbidden
              title: Forbidden
              detail: User does not have the required role.
      '500':
        description: Internal Server Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/InternalServerErrorResponse
    x-codeSamples:
    - lang: curl
      label: Example request
      source: 'curl --location --request POST ''https://${HOSTNAME}/iudx/v2/auth/client'' \

        --header ''Authorization: Bearer <token>''

        '
