            example:
              type: urn:dx:controlPlane:forbidden
              title: Forbidden
              detail: User does not have the required role.
      '500':
        description: Internal Server Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/InternalServerErrorResponse
    x-codeSamples:
    - lang: cURL
      label: Fetch Admin Activity Logs
      source: 'curl --location ''https://${HOSTNAME}/iudx/v2/auditing/admin/activity?page=1&size=10'' \

        --header ''Authorization: Bearer <your-token>''

        '
/iudx/v2/auditing/reportactivity/admin:
