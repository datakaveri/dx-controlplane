        description: Forbidden
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ForbiddenResponse
            example:
              type: urn:dx:controlPlane:forbidden
              title: Forbidden
              detail: User does not have the required role.
    x-codeSamples:
    - lang: cURL
      label: Admin Csv Activity Logs
      source: 'curl --location ''https://${HOSTNAME}//iudx/v2/auditing/reportactivity/admin?page=1&size=10'' \

        --header ''Authorization: Bearer <your-token>''

        '
