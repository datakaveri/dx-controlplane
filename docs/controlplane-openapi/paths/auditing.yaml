    description: Csv file for a list of activity logs for admin. **Platform admins** (`cos_admin`) can access all activity
      logs, while **organization admins** (`cos_org`) can access logs only for their own organization.
    security:
    - authorization: []
    parameters:
    - $ref: ../components/parameters.yaml#/UserIdParam
    - $ref: ../components/parameters.yaml#/AssetTypeParam
    - $ref: ../components/parameters.yaml#/AssetAccessPolicyParam
    - $ref: ../components/parameters.yaml#/ActionParam
    - $ref: ../components/parameters.yaml#/LogTypeParam
    - $ref: ../components/parameters.yaml#/SandboxTypeParam
    - $ref: ../components/parameters.yaml#/OrganizationIdParam
