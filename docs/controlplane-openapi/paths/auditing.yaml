    - $ref: ../components/parameters.yaml#/TimeRelParam
    - $ref: ../components/parameters.yaml#/PageParam
    - $ref: ../components/parameters.yaml#/SizeParam
    - $ref: ../components/parameters.yaml#/SortingParam
    responses:
      '200':
        description: List of admin activity logs
        content:
          application/json:
            schema:
              $ref: ../components/schemas/auditing.yaml#/AuditActivitySuccessResponse
      '400':
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/BadRequestResponse
      '401':
        description: Unauthorized
        content:
