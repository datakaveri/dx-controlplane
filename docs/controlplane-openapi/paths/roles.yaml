                    time:
                      type: string
                      example: 2016–2020
                    location:
                      type: string
                      example: Delhi
              projects:
                type: array
                description: Projects completed by the user
                items:
                  type: object
                  properties:
                    institute:
                      type: string
                      example: ICMR
                    time:
                      type: string
                      example: '2021'
                    location:
                      type: string
                      example: Delhi
                    about:
                      type: string
