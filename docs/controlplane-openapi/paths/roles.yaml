  put:
    summary: (User) Update First Name, Last Name, Social Media Information
    tags:
    - Role APIs
    operationId: put-auth-v2-user
    description: |
      Updates the profile of the currently authenticated user in Keycloak.

      The following fields can be updated:
      - `first_name` / `last_name` — updated directly on the Keycloak user record
      - `twitter_account`, `linkedin_account`, `github_account` — stored as Keycloak user attributes

      All fields are optional. Only provided fields are updated; omitted fields are left unchanged.

      **Log Type:** `USER_ACTION`
    x-codeSamples:
      - lang: cURL
        label: Update user profile
        source: |
          curl --location --request PUT 'https://${HOSTNAME}/iudx/v2/auth/user' \
