                    organisationName: Quants Sandbox
                    sub: 436cb796-5826-458b-a914-a54721f70997
                    emailVerified: true
                    kycVerified: false
                    name: Test User
                    preferredUsername: testuser
                    givenName: Test
                    familyName: User
                    email: test@example.com
                    pending_roles:
                    - provider
                    organisation:
                      id: 98e74f31-4e40-4615-85b8-61256f0bc7c4
                      organisationId: e87246e2-5da5-40b0-973c-690d2f48f879
                      userId: 436cb796-5826-458b-a914-a54721f70997
