/iudx/v2/auth/user/password:
  put:
    summary: (User) Change Password
    tags:
    - Role APIs
    operationId: put-auth-v2-user-password
    description: |
      Allows the currently authenticated user to change their Keycloak account password.

      Only `new_password` is required. The password must satisfy the following policy:
      - 8–20 characters long
      - At least one uppercase letter
      - At least one lowercase letter
      - At least one digit
      - At least one special character

      **Log Type:** `USER_ACTION`
    x-codeSamples:
      - lang: cURL
        label: Change password
        source: |
          curl --location --request PUT 'https://${HOSTNAME}/iudx/v2/auth/user/password' \
          --header 'Authorization: Bearer <your-token>' \
          --header 'Content-Type: application/json' \
          --data '{
            "new_password": "Strong@123"
          }'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - new_password
            properties:
              new_password:
                type: string
                description: New password satisfying the platform password policy
                minLength: 8
                maxLength: 20
                pattern: ^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,20}$
                example: Strong@123
    responses:
      '200':
        description: Password changed successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  example: dx:controlPlane:success
                title:
                  type: string
                  example: Success
                result:
                  type: string
                  description: Success message
            examples:
              Success:
                value:
                  type: urn:dx:controlPlane:success
                  title: Success
                  result: User password updated successfully
      '400':
        description: Bad Request - Invalid or missing `new_password`, or password does not meet policy
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/BadRequest
      '401':
        description: Unauthorized - Token missing or invalid
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/Unauthorized
            example:
              type: urn:dx:controlPlane:notAuthorized
              title: Not Authorized
              detail: Missing or invalid Bearer token
      '403':
        description: Forbidden - Insufficient scope
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/Forbidden
            example:
              type: urn:dx:controlPlane:forbidden
              title: Forbidden
              detail: User does not have the required role.
      '500':
        description: Internal Server Error
    security:
    - authorization: []
