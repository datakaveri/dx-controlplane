/iudx/v2/auth/user/description/info:
  post:
    summary: (ADARV) Add user profile info
    tags:
    - Role APIs
    operationId: post-auth-v2-user-info
    description: |
      Creates an extended user profile record (about, experience, education, projects, publications, skills).
      The `userId` is automatically taken from the JWT subject — do not pass it in the body.

      **Log Type:** `USER_ACTION`
    x-codeSamples:
      - lang: cURL
        label: Add user profile info
        source: |
          curl --location --request POST 'https://${HOSTNAME}/iudx/v2/auth/user/description/info' \
          --header 'Authorization: Bearer <your-token>' \
          --header 'Content-Type: application/json' \
          --data '{
            "about": "Researcher at ICMR",
            "skills": ["Python", "Data Analysis"],
            "experience": [{"role": "Researcher", "time": "2020–present", "location": "Delhi"}]
          }'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              about:
                type: string
                description: Short bio about the user
                example: Researcher at ICMR with 5 years of experience
              experience:
                type: array
                description: List of work experiences
                items:
                  type: object
                  properties:
                    role:
                      type: string
                      example: ICMR Researcher
                    time:
                      type: string
                      example: Jan 2020–present (4yrs)
                    location:
                      type: string
                      example: Delhi
              education:
                type: array
                description: Educational qualifications
                items:
                  type: object
                  properties:
                    institute:
                      type: string
