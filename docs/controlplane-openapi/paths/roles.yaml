              publications:
                type: array
                description: Publications by the user
                items:
                  type: object
                  properties:
                    institute:
                      type: string
                      example: ICMR
                    time:
                      type: string
                      example: '2021'
                    location:
                      type: string
                      example: Delhi
                    about:
                      type: string
                      example: Paper on privacy-preserving IoT data sharing
              skills:
                type: array
                description: List of skill tags
                items:
                  type: string
                  example: Python
    responses:
