/iudx/v2/auth/user/password:
  put:
    summary: (User) Change Password
    description: 'Allows the logged-in user to change their password.

      Only the new password needs to be provided.

      '
    tags:
    - Role APIs
    operationId: put-auth-v2-user-password
    security:
    - authorization: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - new_password
            properties:
              new_password:
                type: string
                description: 'Password must be 8–20 characters long and include at least one uppercase letter, one lowercase
                  letter, one number, and one special character.

                  '
                minLength: 8
                maxLength: 20
                pattern: ^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,20}$
                example: Strong@123
    responses:
      '200':
        description: Password changed successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  example: urn:dx:ControlPlane:success
                title:
                  type: string
                  example: Password Change Successful
                result:
                  type: string
                  example: Password updated successfully.
      '400':
        description: Bad Request - Failed password policy validation
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  example: urn:dx:ControlPlane:error
                title:
                  type: string
                  example: Password Change Failed
                detail:
                  type: string
                  example: New password does not meet policy requirements.
      '401':
        description: Unauthorized - Missing or invalid authentication token
      '500':
        description: Internal Server Error
