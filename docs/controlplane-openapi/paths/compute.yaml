            schema:
              $ref: ../components/schemas/common.yaml#/Unauthorized
/iudx/v2/auth/compute/requests/{id}:
  parameters:
  - name: id
    in: path
    required: true
    description: UUID of the compute role request to update
    schema:
      type: string
      format: uuid
  put:
    summary: Approve or reject a compute role request (COS Admin)
    tags:
    - Compute APIs
    description: 'Allows a COS Admin to grant or reject a pending compute role request. The `status` field in the request body should be set to `granted` or `rejected`. Requires `cos_admin` role.

      **Log Type:** `COMPUTE`

      '
    operationId: put-auth-v2-compute-role-request
    security:
    - authorization: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                description: New status for the compute role request. Must be `granted` or `rejected`.
                enum:
                - granted
                - rejected
            required:
            - status
          examples:
            grant:
              summary: Grant compute role
              value:
                status: granted
            reject:
              summary: Reject compute role
              value:
                status: rejected
    responses:
      '200':
        description: Compute role request updated successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  description: URN indicating the response status
                title:
                  type: string
                  description: Human-readable response title
                detail:
                  type: string
                  description: Description of the action taken
            examples:
              success:
                value:
                  type: urn:dx:ControlPlane:success
                  title: Success
                  detail: Updated Request
      '400':
        description: Bad Request - Invalid status value or request format
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/generalBadRequest
      '401':
        description: Unauthorized - Token invalid or expired
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/Unauthorized
      '403':
        description: Forbidden - Caller does not have `cos_admin` role
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/createNotificationForbidden
