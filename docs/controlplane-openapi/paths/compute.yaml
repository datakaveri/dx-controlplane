  post:
    summary: Create a compute role request (User)
    tags:
    - Compute APIs
    description: 'Submits a new request for the compute role. The request will be reviewed by a COS Admin who can grant or reject it. Once granted, the user gains access to compute/sandbox functionality. Requires an authenticated user token.

      **Log Type:** `COMPUTE`

      '
    operationId: post-auth-v2-compute-role-request
    security:
    - authorization: []
    responses:
      '200':
        description: Compute role request created successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  description: URN indicating the response status
                title:
                  type: string
                  description: Human-readable response title
                result:
                  type: object
                  description: The newly created compute role request
                  properties:
                    id:
                      type: string
                      format: uuid
                      description: Unique identifier of the created request
                    userId:
                      type: string
                      format: uuid
                      description: UUID of the requesting user
                    userName:
                      type: string
                      description: Display name of the requesting user
                    status:
                      type: string
                      description: Status of the request (will be `pending` upon creation)
                    approvedBy:
                      type: string
                      format: uuid
                      nullable: true
                      description: Will be null upon creation
                    createdAt:
                      type: string
                      format: date-time
                      description: Timestamp when the request was created
                    updatedAt:
                      type: string
                      format: date-time
                      description: Timestamp when the request was last updated
                    tableName:
                      type: string
                      description: Internal table name for the record
