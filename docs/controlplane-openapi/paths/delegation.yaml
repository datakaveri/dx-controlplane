  put:
    summary: Delete a delegation grant
    description: >
      Deletes an active delegation grant by updating its status to `DELETED`.
      The delegation record is retained for audit and historical purposes.
      Only the delegator (user who granted the delegation) can delete it.
      
      **Log Type:** `USER_ACTION`
    tags:
      - Delegation APIs
    operationId: post-auth-v2-delegation-delete
    security:
      - authorization: [ ]
    parameters:
      - name: id
        in: path
        required: true
        description: UUID of the delegation grant to delete
        schema:
          type: string
          format: uuid
        example: 292b8526-29f1-4893-a0aa-f72cec65c6fc
    responses:
      '200':
        description: Delegation deleted successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  example: urn:dx:controlPlane:success
                title:
                  type: string
                  example: Success
                result:
                  type: object
                  properties:
                    delegationId:
                      type: string
                      format: uuid
                      example: a33b5619-e842-4fcd-807a-3e8053ae43a1
                    status:
                      type: string
                      example: deleted
            example:
              type: urn:dx:controlPlane:success
              title: Success
              result:
                delegationId: a33b5619-e842-4fcd-807a-3e8053ae43a1
                status: deleted

      '400':
        description: Bad Request - Invalid delegation ID or delegation is not active
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/generalBadRequest

      '401':
        description: Unauthorized - Token invalid or expired
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/Unauthorized

      '403':
        description: Forbidden - Caller is not the delegator
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
            example:
              type: urn:dx:controlPlane:forbidden
              title: Forbidden
              detail: Only the delegator can delete this delegation

      '404':
        description: Delegation not found
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
            example:
              type: urn:dx:controlPlane:notFound
              title: Not Found
              detail: Delegation grant not found

      '500':
        description: Internal Server Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
