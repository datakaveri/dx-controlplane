                    constraints:
                      type: array
                      minItems: 1
                      items:
                        type: object
                        required:
                          - scope
                        properties:
                          scope:
                            $ref: ../components/schemas/delegation.yaml#/DelegationScope
                          entityId:
                            type: array
                            nullable: true
                            items:
                              type: string
                              format: uuid
                          entityType:
                            allOf:
                              - $ref: ../components/schemas/delegation.yaml#/DelegationEntityType
                            nullable: true

          examples:
            remove_constraints:
              summary: Remove specific constraints
              value:
                roles:
                  - role: org_admin
                    constraints:
                      - scope: org-asset-management
                        entityId:
                          - dd96f3d9-9654-434d-882b-c35a9fa6fc35
                        entityType: adex:DataBank
                      - scope: org-asset-publish
                        entityId:
                          - 4a1b3c4d-5e6f-7890-ab12-cd3456789012
                        entityType: adex:AiModel

    responses:
