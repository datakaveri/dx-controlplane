        description: Constraints removed successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  example: urn:dx:controlPlane:success
                title:
                  type: string
                  example: Success
                result:
                  type: object
                  properties:
                    delegationId:
                      type: string
                      format: uuid
                    status:
                      type: string
                      example: constraints_removed

      '400':
        description: Invalid request or constraint definition
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/generalBadRequest

      '401':
        description: Unauthorized - Token invalid or expired
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/Unauthorized
      '403':
        description: Forbidden - User is not the delegator
        content:
