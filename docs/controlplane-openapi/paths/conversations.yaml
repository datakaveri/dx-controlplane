/iudx/v2/requests/{request_id}/conversations:
  get:
    tags:
    - Conversations
    operationId: get-threaded-message
    summary: Get all messages
    description: 'Paginated conversation thread for a request. Conversations are initiated in the context of a specific entity-driven request
     — such as joining an organisation, creating an organisation, or submitting a credit request — identified by the request_id.
    Returns root messages with up to 2 levels of nested replies. Each level shows first 3 replies inline.

      '
    security:
    - authorization: []
    parameters:
    - name: request_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - $ref: '../components/parameters.yaml#/PageParam'
    - $ref: '../components/parameters.yaml#/SizeParam'
    responses:
      '200':
        description: Conversation messages fetched successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  example: dx:controlPlane:success
                title:
                  type: string
                  example: Success
                result:
                  type: array
                  items:
                    $ref: '../components/schemas/conversation.yaml#/ThreadedMessage'
                paginationInfo:
                  $ref: '../components/schemas/pagination.yaml#/PaginationInfo'
      '400':
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/GenericBadRequestResponse'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/UnauthorizedResponse'
      '500':
        description: Internal Server Error
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/InternalServerErrorResponse'
  post:
    tags:
    - Conversations
    operationId: post-request-conversation
    summary: Create message
    description: >
      Post a new message(of type question, answer, or internal note) within a request conversation.
      The sender_role must be either 'requester' or 'approver'.
      Set internal_note to true for notes visible only to users with role approver, or false for messages visible to all participants.
      Leave parent_msg_id as null to post a root-level message; provide a parent_msg_id to post as a reply to an existing message.
    security:
    - authorization: []
    parameters:
    - name: request_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - sender_role
              - message_type
              - request_type
              - content
            properties:
              parent_msg_id:
                type: string
                format: uuid
                nullable: true
                description: Null for root-level messages; provide a valid message UUID to post as a reply to an existing message.
              sender_role:
                type: string
                enum: [ requester, approver ]
                description: Role of the sender. Must be either 'requester' or 'approver'.
              message_type:
                type: string
                enum: [ text, question, answer ]
              request_type:
                type: string
                enum: [ join_orgs, create_orgs, credit_request ]
                description: The type of entity-driven request this conversation belongs to.
              content:
                type: string
                description: The message body.
              internal_note:
                type: boolean
                description: Set to true for notes visible only to internal team members; false for messages visible to all participants.
    responses:
      '200':
        description: Message created successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  example: dx:controlPlane:success
                title:
                  type: string
                  example: Success
                result:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    requestType:
                      type: string
                      example: join_orgs
                    requestTypeId:
                      type: string
                      format: uuid
                    parentMsgId:
                      type: string
                      format: uuid
                      nullable: true
                      description: Null if this is a root-level message; otherwise the UUID of the parent message.
                    senderId:
                      type: string
                      format: uuid
                    senderRole:
                      type: string
                      enum: [ requester, approver ]
                      example: requester
                    messageType:
                      type: string
                      example: text
                    content:
                      type: string
                    isInternal:
                      type: boolean
                      enum: [ true, false ]
                    createdAt:
                      type: string
                      format: date-time
                    replyCount:
                      type: integer
                    hasReplies:
                      type: boolean
      '400':
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/GenericBadRequestResponse'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/UnauthorizedResponse'
      '500':
        description: Internal Server Error
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/InternalServerErrorResponse'
/iudx/v2/requests/{request_id}/conversations/{msg_id}:
  get:
    tags:
    - Conversations
    operationId: get-request-conversation-by-id
    summary: Get single message
    description: 'Fetch a specific message with its replies. Each message belongs to a conversation tied to an entity-driven request (e.g. org join, org creation, credit request)
    identified by request_id and message id.Any user can run this. '
    security:
    - authorization: []
    parameters:
    - name: request_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: msg_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    responses:
      '200':
        description: Conversation message fetched successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  example: dx:controlPlane:success
                title:
                  type: string
                  example: Success
                result:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                      example: c0ca7a6c-597f-4e03-b861-bb912b3cb1ec
                    requestType:
                      type: string
                    senderId:
                      type: string
                      format: uuid
                      example: 1dc28cc6-d614-461a-9b8f-d6110feb3e2f
                    senderRole:
                      type: string
                      example: new user
                    messageType:
                      type: string
                      example: question
                    content:
                      type: string
                      example: do ggggg have to add my phone number also ?
                    isInternal:
                      type: boolean
                      example: false
                    createdAt:
                      type: string
                      format: date-time
                      example: '2026-05-05T08:52:22.936019Z'
  put:
    tags:
    - Conversations
    operationId: put-request-conversation
    summary: Update message
    description: The message created by the user earlier can be edited using this. 'content' , 'metadata' or 'is_internal' can be changed.
    security:
    - authorization: []
    parameters:
    - name: request_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: msg_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            minProperties: 1
            properties:
              content:
                type: string
                nullable: true
                additionalProperties: true
              metadata:
                type: object
                nullable: true
                additionalProperties: true
              is_internal:
                type: boolean
                nullable: true
                enum: [ true, false ]
                additionalProperties: true
    responses:
      '200':
        description: Message updated successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  example: dx:controlPlane:success
                title:
                  type: string
                  example: Success
                result:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    requestType:
                      type: string
                      example: join_orgs
                    requestTypeId:
                      type: string
                      format: uuid
                    parentMsgId:
                      type: string
                      format: uuid
                      nullable: true
                    senderId:
                      type: string
                      format: uuid
                    senderRole:
                      type: string
                      example: approver
                    messageType:
                      type: string
                      example: question
                    content:
                      type: string
                    isInternal:
                      type: boolean
                    createdAt:
                      type: string
                      format: date-time
                    replyCount:
                      type: integer
                      example: 0
                    hasReplies:
                      type: boolean
                      example: false
      '400':
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/GenericBadRequestResponse'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/UnauthorizedResponse'
      '500':
        description: Internal Server Error
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/InternalServerErrorResponse'
  delete:
    tags:
    - Conversations
    operationId: delete-request-conversation
    summary: Delete message
    description: Delete a message - by the user who created the message.
    security:
    - authorization: []
    parameters:
    - name: request_id
      in: path
      required: true
      schema:
        type: string
    - name: msg_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    responses:
      '200':
        description: Conversation message deleted
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  example: urn:dx:as:Success
                title:
                  type: string
                  example: Success
                detail:
                  type: string
                  example: Conversation message deleted successfully
/iudx/v2/requests/{request_id}/conversations/{msg_id}/reply:
  post:
    tags:
      - Conversations
    operationId: post-request-conversation-reply
    summary: Reply to message
    description: >
      Reply to a specific message or question. The msg_id in the path is automatically
      set as the parent_msg_id for this reply. The sender_role must be either 'requester'
      or 'approver'. Set internal_note to true to create a reply visible only to 'approver';
      false to make it visible to all conversation participants(approver and requester).
    security:
      - authorization: []
    parameters:
      - name: request_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: msg_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The UUID of the message being replied to. Automatically becomes the parent_msg_id of this reply.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - sender_role
              - message_type
              - content
            properties:
              sender_role:
                type: string
                enum: [requester, approver]
                description: Role of the sender. Must be either 'requester' or 'approver'.
              message_type:
                type: string
                description: Type of the reply message.
              content:
                type: string
                description: The reply message body.
              internal_note:
                type: boolean
                description: >
                  Set to true to mark this reply as an internal note — visible only to the
                  approver. Set to false for replies visible to all conversation participants.
    responses:
      '200':
        description: Reply created successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  example: dx:controlPlane:success
                title:
                  type: string
                  example: Success
                result:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    requestType:
                      type: string
                      example: join_orgs
                    requestTypeId:
                      type: string
                      format: uuid
                    parentMsgId:
                      type: string
                      format: uuid
                    senderId:
                      type: string
                      format: uuid
                    senderRole:
                      type: string
                      example: requester
                    messageType:
                      type: string
                      example: text
                    content:
                      type: string
                    isInternal:
                      type: boolean
                    createdAt:
                      type: string
                      format: date-time
                    replyCount:
                      type: integer
                      example: 0
                    hasReplies:
                      type: boolean
                      example: false
      '400':
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/GenericBadRequestResponse'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/UnauthorizedResponse'
      '500':
        description: Internal Server Error
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/InternalServerErrorResponse'
