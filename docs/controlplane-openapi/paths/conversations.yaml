                    requestTypeId:
                      type: string
                      format: uuid
                    parentMsgId:
                      type: string
                      format: uuid
                    senderId:
                      type: string
                      format: uuid
                    senderRole:
                      type: string
                      example: requester
                    messageType:
                      type: string
                      example: text
                    content:
                      type: string
                    isInternal:
                      type: boolean
                    createdAt:
                      type: string
