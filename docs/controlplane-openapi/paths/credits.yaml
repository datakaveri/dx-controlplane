    operationId: get-auth-v2-admin-user-credit-balance
    summary: Get a user's credit balance by ID (COS Admin)
    description: 'Returns the credit balance for the specified user. Requires `cos_admin` role. The target user must have completed KYC verification.

      **Log Type:** `COMPUTE`

      '
    tags:
    - Credit APIs
    security:
    - authorization: []
    responses:
      '200':
        description: User credit balance retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                balance:
                  type: number
                  format: double
                  description: Current credit balance of the user
            examples:
              success:
                value:
                  balance: 10000.0
      '401':
        description: Unauthorized - Token invalid/expired or KYC not verified
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/Unauthorized
      '403':
        description: Forbidden - Caller does not have `cos_admin` role
      '404':
        description: User credit record not found
      '500':
        description: Internal server error
/iudx/v2/auth/user/credit/request:
  get:
    summary: Get the current user's credit requests
    description: 'Returns a paginated list of credit requests submitted by the currently authenticated user. Supports filtering by status and pagination. Requires an authenticated user token.

      **Log Type:** `COMPUTE`

      '
    tags:
    - Credit APIs
    operationId: get-auth-v2-user-credit
    security:
    - authorization: []
    parameters:
    - $ref: ../components/parameters.yaml#/PageParam
    - $ref: ../components/parameters.yaml#/SizeParam
    - $ref: ../components/parameters.yaml#/SortingParam
    - $ref: ../components/parameters.yaml#/StatusParam
    responses:
      '200':
        description: Credit requests retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  description: URN indicating the response status
                title:
                  type: string
                  description: Human-readable response title
                result:
                  type: array
                  description: List of credit request records
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        description: Unique identifier of the credit request
                      userId:
                        type: string
                        format: uuid
                        description: UUID of the user who submitted the request
                      userName:
                        type: string
                        description: Display name of the requesting user
                      amount:
                        type: integer
                        description: Requested credit amount
                      status:
                        type: string
                        description: Current status of the request (pending, granted, rejected)
                      requestedAt:
                        type: string
                        format: date-time
                        description: Timestamp when the request was submitted
                      processedAt:
                        type: string
                        format: date-time
                        description: Timestamp when the request was processed
                      tableName:
                        type: string
                        description: Internal table name for the record
                paginationInfo:
                  $ref: ../components/schemas/pagination.yaml#/PaginationInfo
            examples:
              success:
                value:
                  type: urn:dx:ControlPlane:success
                  title: Success
                  result:
                  - id: f1061c0c-21fd-46ad-9cb3-83e479b8635d
                    userId: 436cb796-5826-458b-a914-a54721f70997
                    userName: test test
                    amount: 10000
                    status: pending
                    requestedAt: '2025-06-04T09:47:27.323861'
                    processedAt: '2025-06-04T09:47:27.323861'
                    tableName: credit_requests
                  paginationInfo:
                    page: 1
                    size: 10
                    totalCount: 346
                    totalPages: 35
                    hasNext: true
                    hasPrevious: false
      '400':
        description: Bad Request - Invalid query parameters
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/generalBadRequest
      '401':
        description: Unauthorized - Token invalid or expired
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/Unauthorized
/iudx/v2/auth/user/credit/request/{id}:
  delete:
    tags:
    - Credit APIs
    summary: Delete a pending credit request (User)
    description: 'Deletes a pending credit request submitted by the currently authenticated user. Only requests with `pending` status can be deleted. Requires an authenticated user token.

      **Log Type:** `COMPUTE`

      '
    operationId: delete-auth-v2-user-credit
    parameters:
    - name: id
      in: path
      required: true
      description: UUID of the credit request to delete
      schema:
        type: string
        format: uuid
        pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
    responses:
      '200':
        description: Credit request deleted successfully
      '400':
        description: Bad Request - Schema validation failed or incorrect query parameters
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/updateNotificationBadRequest
      '401':
        description: Unauthorized - Token invalid or expired, or caller lacks permission
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/Unauthorized
    security:
    - authorization: []
