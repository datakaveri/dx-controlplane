/iudx/v2/auth/user/compute/requests/{id}:
  delete:
    tags:
    - Credit APIs
    summary: Delete a pending compute request (User)
    description: 'Deletes a pending compute request submitted by the currently authenticated user. Only requests with `pending` status can be deleted. Requires an authenticated user token.

      **Log Type:** `COMPUTE`

      '
    operationId: delete-auth-v2-user-compute-role-request
    x-codeSamples:
    - lang: cURL
      label: Delete pending compute request
      source: |
        curl --location --request DELETE 'https://${HOSTNAME}/iudx/v2/auth/user/compute/requests/{id}' \
        --header 'Authorization: Bearer <your-token>'
    parameters:
    - name: id
      in: path
      required: true
      description: UUID of the compute request to delete
      schema:
        type: string
        format: uuid
        pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
    responses:
      '200':
        description: Compute request deleted successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                title:
                  type: string
                detail:
                  type: string
                  example: Pending Compute Request deleted successfully
      '400':
        description: Bad Request - Only pending compute requests can be deleted
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/updateNotificationBadRequest
      '401':
        description: Unauthorized - Token invalid or expired
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/Unauthorized
            example:
              type: urn:dx:controlPlane:notAuthorized
              title: Not Authorized
              detail: Missing or invalid Bearer token
      '403':
        description: Forbidden - Caller did not submit this compute request
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
            example:
              type: urn:dx:controlPlane:forbidden
              title: Forbidden
              detail: User does not have the required role.
      '404':
        description: Not Found - Compute request with given ID does not exist
    security:
    - authorization: []
