/iudx/v2/auth/user/credit/balance:
  get:
    operationId: get-auth-v2-user-credit-balance
    summary: Get the specified user's credit balance
    description: "Returns the credit balance for the specified user (KYC-verified).\n\n **Log Type:** `COMPUTE`\n"
    tags:
    - Credit APIs
    security:
    - authorization: []
    responses:
      '200':
        description: User credit balance retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                balance:
                  type: number
                  format: double
      '401':
        description: Unauthorized or KYC not verified
      '404':
        description: User credit record not found
      '500':
        description: Internal server error
/iudx/v2/auth/admin/user/credit/balance/{id}:
  parameters:
