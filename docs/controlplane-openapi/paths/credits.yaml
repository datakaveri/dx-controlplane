                  properties:
                    id:
                      type: string
                      format: uuid
                      description: Unique identifier of the credit record
                    userId:
                      type: string
                      format: uuid
                      description: UUID of the user
                    balance:
                      type: number
                      format: double
                      description: Current credit balance
                    expirationDate:
                      type: string
                      format: date-time
                      nullable: true
