/iudx/v2/auth/user/credit/balance:
  get:
    operationId: get-auth-v2-user-credit-balance
    summary: Get the current user's credit balance
    x-codeSamples:
    - lang: cURL
      label: Get my credit balance
      source: |
        curl --location 'https://${HOSTNAME}/iudx/v2/auth/user/credit/balance' \
        --header 'Authorization: Bearer <your-token>'
    description: 'Returns the credit balance for the currently authenticated user. The user must have completed KYC verification to access this endpoint. Requires an authenticated user token.

      **Log Type:** `COMPUTE`

      '
    tags:
    - Credit APIs
    security:
    - authorization: []
    responses:
      '200':
        description: User credit balance retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                title:
                  type: string
                result:
                  type: object
                  description: The user's credit record
                  properties:
                    id:
                      type: string
                      format: uuid
                      description: Unique identifier of the credit record
                    userId:
                      type: string
                      format: uuid
                      description: UUID of the user
                    balance:
                      type: number
                      format: double
                      description: Current credit balance
                    expirationDate:
                      type: string
                      format: date-time
                      nullable: true
                      description: Expiration date of the current credit grant
                    updatedAt:
                      type: string
                      format: date-time
                      description: Timestamp when the balance was last updated
            examples:
              success:
                value:
                  type: urn:dx:controlPlane:success
                  title: Success
                  result:
                    id: 9f1a2b3c-4d5e-6789-abcd-ef0123456789
                    userId: 436cb796-5826-458b-a914-a54721f70997
                    balance: 10000.0
                    expirationDate: '2025-12-31T23:59:59'
                    updatedAt: '2025-06-04T10:45:06.361576'
      '401':
        description: Unauthorized - Token invalid/expired or KYC not verified
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/Unauthorized
            example:
              type: urn:dx:controlPlane:notAuthorized
              title: Not Authorized
              detail: Missing or invalid Bearer token
      '404':
        description: User credit record not found
