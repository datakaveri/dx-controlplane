/iudx/v2/auth/user/credit/request:
  get:
    summary: Get the current user's credit requests
    description: 'Returns a paginated list of credit requests submitted by the currently authenticated user. Supports filtering by status and pagination. Requires an authenticated user token.

      **Log Type:** `COMPUTE`

      '
    tags:
    - Credit APIs
    operationId: get-auth-v2-user-credit
    x-codeSamples:
    - lang: cURL
      label: Get my credit requests
      source: |
        curl --location 'https://${HOSTNAME}/iudx/v2/auth/user/credit/request' \
        --header 'Authorization: Bearer <your-token>'
    security:
    - authorization: []
    responses:
      '200':
        description: Credit requests retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  description: URN indicating the response status
                title:
                  type: string
                  description: Human-readable response title
                result:
                  type: array
                  description: List of the user's credit request records
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        description: Unique identifier of the credit request
                      userId:
                        type: string
                        format: uuid
                        description: UUID of the user who submitted the request
                      userName:
                        type: string
                        description: Display name of the requesting user
                      additionalInfo:
                        type: object
                        nullable: true
                        description: Optional additional context provided when submitting the request
                      status:
                        type: string
                        enum: [pending, granted, rejected]
                        description: Current status of the request
                      requestedAt:
                        type: string
                        format: date-time
                        description: Timestamp when the request was submitted
                      processedAt:
                        type: string
                        format: date-time
                        nullable: true
                        description: Timestamp when the request was processed, or null if still pending
            examples:
              success:
                value:
                  type: urn:dx:controlPlane:success
                  title: Success
                  result:
                  - id: f1061c0c-21fd-46ad-9cb3-83e479b8635d
                    userId: 436cb796-5826-458b-a914-a54721f70997
                    userName: test test
                    additionalInfo:
                      purpose: research
                    status: pending
                    requestedAt: '2025-06-04T09:47:27.323861'
                    processedAt: null
      '401':
        description: Unauthorized - Token invalid or expired
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/Unauthorized
            example:
              type: urn:dx:controlPlane:notAuthorized
              title: Not Authorized
              detail: Missing or invalid Bearer token
/iudx/v2/auth/user/credit/request/{id}:
  delete:
    tags:
    - Credit APIs
    summary: Delete a pending credit request (User)
    description: 'Deletes a pending credit request submitted by the currently authenticated user. Only requests with `pending` status can be deleted. Requires an authenticated user token.

      **Log Type:** `COMPUTE`

      '
    operationId: delete-auth-v2-user-credit
    x-codeSamples:
    - lang: cURL
      label: Delete pending credit request
      source: |
        curl --location --request DELETE 'https://${HOSTNAME}/iudx/v2/auth/user/credit/request/{id}' \
        --header 'Authorization: Bearer <your-token>'
    parameters:
    - name: id
      in: path
      required: true
      description: UUID of the credit request to delete
      schema:
        type: string
        format: uuid
        pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
    responses:
      '200':
        description: Credit request deleted successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                title:
                  type: string
                detail:
                  type: string
                  example: Pending Credit Request deleted successfully
      '400':
        description: Bad Request - Only pending requests can be deleted
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/updateNotificationBadRequest
      '401':
        description: Unauthorized - Token invalid or expired
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/Unauthorized
            example:
              type: urn:dx:controlPlane:notAuthorized
              title: Not Authorized
              detail: Missing or invalid Bearer token
      '403':
        description: Forbidden - Caller did not submit this request
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
            example:
              type: urn:dx:controlPlane:forbidden
              title: Forbidden
              detail: User does not have the required role.
      '404':
        description: Not Found - Credit request with given ID does not exist
    security:
    - authorization: []
