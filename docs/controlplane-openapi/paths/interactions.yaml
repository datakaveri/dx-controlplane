/iudx/v2/user/feedback:
  post:
    tags:
    - User Interactions
    summary: Post user feedback on entity
    description: 'Submit user feedback for a specific data asset, including an optional star rating (1-5) and/or a structured action subtype with associated data. The user must have already interacted with the asset (e.g., via download or API access). Requires an authenticated user token.

      '
    operationId: post-user-feedback
    security:
    - authorization: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - asset_id
            properties:
              asset_id:
                type: string
                format: uuid
                description: UUID of the asset to provide feedback on
              entity_rating:
                type: integer
                minimum: 1
                maximum: 5
                description: Star rating from 1 (lowest) to 5 (highest)
              action_subtype:
                type: string
                description: Structured feedback category (e.g., data quality, documentation)
              action_subdata:
                type: object
                description: Additional structured data associated with the feedback
    responses:
      '200':
        description: Feedback successfully recorded
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                title:
                  type: string
                detail:
                  type: string
            example:
              type: "urn:dx:controlPlane:success"
              title: "Success"
              detail: "Interaction updated successfully"
      '400':
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/GenericBadRequestResponse
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/UnauthorizedResponse
            example:
              type: urn:dx:controlPlane:notAuthorized
              title: Not Authorized
              detail: Missing or invalid Bearer token
      '500':
        description: Internal Server Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/InternalServerErrorResponse
  get:
    tags:
    - User Interactions
    summary: Get user feedback
    description: 'Retrieve paginated user feedback with optional filters by user, asset, or action subtype. Requires an authenticated user token.

      '
    operationId: get-user-feedback
    security:
    - authorization: []
    parameters:
    - name: user_id
      in: query
      description: Filter by user UUID
      required: false
      schema:
        type: string
        format: uuid
    - name: asset_id
      in: query
      description: Filter by asset UUID
      required: false
      schema:
        type: string
        format: uuid
    - name: action_subtype
      in: query
      description: Filter by action subtype (repeatable)
      required: false
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    - $ref: ../components/parameters.yaml#/PageParam
    - $ref: ../components/parameters.yaml#/SizeParam
    responses:
      '200':
        description: Successfully retrieved user feedback
        content:
          application/json:
            schema:
              $ref: ../components/schemas/interaction.yaml#/UserFeedbackPaginatedResponse
      '400':
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/GenericBadRequestResponse
      '500':
        description: Internal Server Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/InternalServerErrorResponse
    x-codeSamples:
    - lang: cURL
      label: Get user feedback
      source: 'curl --location ''https://${HOSTNAME}/iudx/v2/user/feedback?asset_id=811e9876-9381-4a25-8ad1-e8b289616ab8&action_subtype=bookmark&page=1&size=10''

        '
  delete:
    tags:
    - User Interactions
    summary: Delete user feedback
    description: 'Clears the feedback fields (entity_rating, action_subtype, action_subdata) for a specific feedback entry.
      The record itself is retained. User should be the one who has already interacted with the asset before.

      '
    operationId: delete-user-feedback
    security:
    - authorization: []
    parameters:
    - name: id
      in: query
      description: UUID of the asset entry to delete
      required: true
      schema:
        type: string
        format: uuid
    responses:
      '200':
        description: Feedback fields cleared successfully
      '400':
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/GenericBadRequestResponse
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/UnauthorizedResponse
            example:
              type: urn:dx:controlPlane:notAuthorized
              title: Not Authorized
              detail: Missing or invalid Bearer token
      '500':
        description: Internal Server Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/InternalServerErrorResponse
    x-codeSamples:
    - lang: cURL
      label: Delete user feedback
      source: 'curl --location --request DELETE ''https://${HOSTNAME}/iudx/v2/user/feedback?id=811e9876-9381-4a25-8ad1-e8b289616ab8''
        --header ''Authorization: Bearer ${TOKEN}''

        '
