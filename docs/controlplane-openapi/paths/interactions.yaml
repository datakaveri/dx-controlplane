/iudx/v2/user/interactions:
  post:
    tags:
    - User Interactions
    operationId: post-user-intraction
    summary: Create or update user interaction (like, dislike, bookmark)
    description: 'Allows a user to like, dislike, bookmark, or remove an interaction on an entity. Uses a single unified endpoint
      for all interaction types.

      '
    security:
    - authorization: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/interaction.yaml#/UserInteractionRequest
          examples:
            like:
              summary: Like an entity
              value:
                assetId: e74112d5-b58b-401e-a799-712b473279ea
                assetType: DATABANK
                actionType: LIKE
            dislike:
              summary: Dislike an entity
              value:
                assetId: e74112d5-b58b-401e-a799-712b473279ea
                assetType: DATABANK
                actionType: DISLIKE
            bookmark:
              summary: Bookmark an entity
              value:
                assetId: e74112d5-b58b-401e-a799-712b473279ea
                assetType: DATABANK
                actionType: BOOKMARK
            removeVote:
              summary: Remove vote (neutral)
              value:
                assetId: e74112d5-b58b-401e-a799-712b473279ea
                assetType: DATABANK
                actionType: NEUTRAL
            removeBookmark:
              summary: Remove bookmark
              value:
                assetId: e74112d5-b58b-401e-a799-712b473279ea
                assetType: DATABANK
                actionType: UNBOOKMARK
    responses:
      '200':
        description: Interaction recorded successfully
        content:
          application/json:
            schema:
              $ref: ../components/schemas/interaction.yaml#/InteractionResponse
      '400':
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/GenericBadRequestResponse
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/UnauthorizedResponse
            example:
              type: urn:dx:controlPlane:notAuthorized
              title: Not Authorized
              detail: Missing or invalid Bearer token
      '403':
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ForbiddenResponse
            example:
              type: urn:dx:controlPlane:forbidden
              title: Forbidden
              detail: User does not have the required role.
      '500':
        description: Internal Server Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/InternalServerErrorResponse
    x-codeSamples:
    - lang: cURL
      label: submit interaction
      source: 'curl --location ''https://${HOSTNAME}/iudx/v2/user/interactions'' \

        --header ''Authorization: Bearer <jwt token>'' \

        --header ''Content-Type: application/json'' \

        --data ''{

        "assetId": "e74112d5-b58b-401e-a799-712b473279ea",

        "assetType": "DATABANK",

        "actionType": "LIKE"

        }''

        '
  get:
    tags:
    - User Interactions
    operationId: get-user-interaction
    summary: Get user interaction status for an entity
    description: 'Returns a paginated list of entities the authenticated user has interacted with (liked, disliked, bookmarked),
      including the interaction state per entity.

      '
    security:
    - authorization: []
    parameters:
    - name: assetId
      in: query
      description: Unique identifier of the asset
      required: false
      schema:
        type: string
        format: uuid
    - name: assetType
      in: query
      description: Type of the asset
      required: false
      schema:
        type: string
        enum:
        - DATABANK
        - AI_MODEL
        - USECASE
    - name: actionType
      in: query
      description: Type of interaction action
      required: false
      schema:
        type: string
        enum:
        - LIKE
        - DISLIKE
        - BOOKMARK
    - $ref: ../components/parameters.yaml#/PageParam
    - $ref: ../components/parameters.yaml#/SizeParam
    - $ref: ../components/parameters.yaml#/SortingParam
    responses:
      '200':
        description: Successfully retrieved user interaction status
        content:
          application/json:
            schema:
              $ref: ../components/schemas/interaction.yaml#/UserInteractionResponse
      '400':
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/GenericBadRequestResponse
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/UnauthorizedResponse
            example:
              type: urn:dx:controlPlane:notAuthorized
              title: Not Authorized
              detail: Missing or invalid Bearer token
      '403':
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ForbiddenResponse
            example:
              type: urn:dx:controlPlane:forbidden
              title: Forbidden
              detail: User does not have the required role.
      '500':
        description: Internal Server Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/InternalServerErrorResponse
    x-codeSamples:
    - lang: cURL
      label: Get User Interaction Status
      source: 'curl --location ''https://${HOSTNAME}/iudx/v2/user/interactions'' \

        --header ''Content-Type: application/json'' \

        --header ''Authorization: Bearer <jwt token>''

        '
