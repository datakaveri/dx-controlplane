    - User Interactions
    summary: Get provider feedback
    description: 'Retrieve paginated provider feedback with optional filters by user, asset, or type. Requires an authenticated user token.

      '
    operationId: get-provider-feedback
    security:
    - authorization: []
    parameters:
    - name: userId
      in: query
      description: Filter by user UUID
      required: false
      schema:
        type: string
        format: uuid
    - name: assetId
      in: query
      description: Filter by asset UUID
      required: false
      schema:
        type: string
        format: uuid
    - name: type
      in: query
      description: Filter by action subtype (repeatable)
      required: false
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    - $ref: ../components/parameters.yaml#/PageParam
    - $ref: ../components/parameters.yaml#/SizeParam
    responses:
      '200':
        description: Successfully retrieved Provider feedback
        content:
          application/json:
            schema:
              $ref: ../components/schemas/interaction.yaml#/ProviderFeedbackPaginatedResponse
      '400':
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/GenericBadRequestResponse
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/UnauthorizedResponse
            example:
              type: urn:dx:controlPlane:notAuthorized
              title: Not Authorized
              detail: Missing or invalid Bearer token
      '500':
        description: Internal Server Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/InternalServerErrorResponse
    x-codeSamples:
    - lang: cURL
      label: Get provider feedback (by asset)
      source: 'curl --location ''https://${HOSTNAME}/iudx/v2/provider/feedback?assetId=811e9876-9381-4a25-8ad1-e8b289616ab8&page=1&size=10'' \

        --header ''Authorization: Bearer <your-token>''

        '
    - lang: cURL
      label: Get provider feedback (by type, repeatable)
      source: 'curl --location ''https://${HOSTNAME}/iudx/v2/provider/feedback?type=FAQ&type=DATA_DESCRIPTION&page=1&size=10'' \

        --header ''Authorization: Bearer <your-token>''

        '
    - lang: cURL
      label: Get provider feedback (by user)
      source: 'curl --location ''https://${HOSTNAME}/iudx/v2/provider/feedback?userId=fd62ba22-d338-4dad-b09c-2bccfa20b04a&page=1&size=10'' \

        --header ''Authorization: Bearer <your-token>''

        '
  delete:
    tags:
    - User Interactions
    summary: Delete provider feedback
    description: 'Clears a specific provider feedback entry (identified by asset and feedback type) submitted by the
      authenticated user. User should be the one who has already interacted with the asset before.

      '
    operationId: delete-provider-feedback
    security:
    - authorization: []
    parameters:
    - name: assetId
      in: query
      description: UUID of the asset whose feedback should be cleared
      required: true
      schema:
        type: string
        format: uuid
    - name: type
      in: query
      description: Feedback type of the entry to clear
      required: true
      schema:
        type: string
        enum:
        - FAQ
        - FEEDBACK
        - INFO
        - DATA_DESCRIPTION
        - SUGGESTION
    responses:
      '200':
        description: Feedback fields cleared successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                title:
                  type: string
                detail:
                  type: string
            example:
              type: "urn:dx:controlPlane:success"
              title: "Success"
              detail: "Interaction deleted successfully"
      '400':
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/GenericBadRequestResponse
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/UnauthorizedResponse
            example:
              type: urn:dx:controlPlane:notAuthorized
              title: Not Authorized
              detail: Missing or invalid Bearer token
      '500':
        description: Internal Server Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/InternalServerErrorResponse
    x-codeSamples:
    - lang: cURL
      label: Delete provider feedback
      source: 'curl --location --request DELETE ''https://${HOSTNAME}/iudx/v2/provider/feedback?assetId=811e9876-9381-4a25-8ad1-e8b289616ab8&type=FAQ''
        --header ''Authorization: Bearer <your-token>''

        '
