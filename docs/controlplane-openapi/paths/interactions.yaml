/iudx/v2/user/feedback/{id}:
  put:
    tags:
      - User Interactions
    summary: Approve or reject user feedback
    description: >
      Approve or reject a pending user feedback entry. This API is restricted to
      COS Admin users.


      Only feedback entries with `PENDING` status can be processed. Once feedback
      is approved or rejected, its status cannot be changed through this API.


      When approving feedback, the `comment` field is optional. When rejecting
      feedback, a non-empty `comment` is mandatory and should describe the reason
      for rejection.


      A rejected feedback entry remains associated with the submitting user but
      is not considered for public/provider feedback listings or rating summaries.
    operationId: put-platform-user-feedback
    security:
      - authorization: []
    parameters:
      - name: id
        in: path
        description: UUID of the feedback entry to approve or reject
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - status
            properties:
              status:
                type: string
                description: Status to apply to the pending feedback
                enum:
                  - APPROVED
                  - REJECTED
              comment:
                type: string
                description: >
                  Reason for the moderation decision. Required when status is
                  `REJECTED` and optional when status is `APPROVED`.
          examples:
            approve:
              summary: Approve feedback
              value:
                status: "APPROVED"
            approveWithComment:
              summary: Approve feedback with comment
              value:
                status: "APPROVED"
                comment: "Feedback reviewed and approved."
            reject:
              summary: Reject feedback with reason
              value:
                status: "REJECTED"
                comment: "The feedback does not provide sufficient information."
    responses:
      '200':
        description: Feedback status updated successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                title:
                  type: string
                detail:
                  type: string
            example:
              type: "urn:dx:controlPlane:success"
              title: "Success"
              detail: "Feedback status updated successfully"
      '400':
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/GenericBadRequestResponse
            examples:
              invalidStatus:
                summary: Invalid feedback status
                value:
                  type: urn:dx:controlPlane:badRequest
                  title: Bad Request
                  detail: "status must be APPROVED or REJECTED"
              missingComment:
                summary: Missing rejection comment
                value:
                  type: urn:dx:controlPlane:badRequest
                  title: Bad Request
                  detail: "Comment is required when rejecting feedback"
              invalidFeedbackId:
                summary: Invalid feedback UUID
                value:
                  type: urn:dx:controlPlane:badRequest
                  title: Bad Request
                  detail: "Invalid feedback id"
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/UnauthorizedResponse
            example:
              type: urn:dx:controlPlane:notAuthorized
              title: Not Authorized
              detail: Missing or invalid Bearer token
      '403':
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ForbiddenResponse
            example:
              type: urn:dx:controlPlane:forbidden
              title: Forbidden
              detail: Only COS Admin users can approve or reject feedback
      '404':
        description: Pending feedback not found
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                title:
                  type: string
                detail:
                  type: string
            example:
              type: "urn:dx:controlPlane:notFound"
              title: "Not Found"
              detail: "Pending feedback not found"
      '500':
        description: Internal Server Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/InternalServerErrorResponse
    x-codeSamples:
      - lang: cURL
        label: Approve user feedback
        source: 'curl --location --request PUT ''https://${HOSTNAME}/iudx/v2/user/feedback/9179b887-04ef-4ce5-ab3a-b5bbd39ea3c8'' \

          --header ''Authorization: Bearer <your-token>'' \

          --header ''Content-Type: application/json'' \

          --data ''{

          "status": "APPROVED"

          }'''
      - lang: cURL
        label: Reject user feedback
        source: 'curl --location --request PUT ''https://${HOSTNAME}/iudx/v2/user/feedback/9179b887-04ef-4ce5-ab3a-b5bbd39ea3c8'' \

          --header ''Authorization: Bearer <your-token>'' \

          --header ''Content-Type: application/json'' \

          --data ''{

          "status": "REJECTED",

          "comment": "The feedback does not provide sufficient information."

          }'''
/iudx/v2/user/feedback/user:
  get:
    tags:
      - User Interactions
    summary: Get my user feedback
    description: >
      Retrieve a paginated list of feedback submitted by the authenticated
      consumer. The response contains only feedback created by the requesting
      user. Consumers can optionally filter their feedback by asset, action
      subtype, rating, or feedback creation time. The user identity is derived
      from the authenticated user token and cannot be supplied as a query
      parameter.
    operationId: get-my-user-feedback
    security:
      - authorization: []
    parameters:
      - name: assetId
        in: query
        description: Filter feedback by asset UUID
        required: false
        schema:
          type: string
          format: uuid

      - name: actionSubtype
        in: query
        description: Filter by action subtype (repeatable)
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string

      - name: rating
        in: query
        description: Filter by star rating (repeatable)
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 5

      - name: time
        in: query
        description: >
          Start of the feedback-creation time window. Requires `timerel`;
          requires `endtime` for `between`/`during`.
        required: false
        schema:
          type: string
          format: date-time

      - name: endtime
        in: query
        description: >
          End of the feedback-creation time window. Only used with
          `timerel=between` or `timerel=during`.
        required: false
        schema:
          type: string
          format: date-time

      - name: timerel
        in: query
        description: >
          Temporal relation to apply against the feedback creation time
          when `time` is provided.
        required: false
        schema:
          type: string
          enum:
            - before
            - after
            - between
            - during

      - $ref: ../components/parameters.yaml#/PageParam

      - $ref: ../components/parameters.yaml#/SizeParam

      - name: sort
        in: query
        description: >
          Sort results by feedback creation time. Format:
          `feedbackCreatedAt:asc` or `feedbackCreatedAt:desc`.
          Defaults to `feedbackCreatedAt:desc`.
        required: false
        schema:
          type: string
        example: feedbackCreatedAt:desc

    responses:
      '200':
        description: Successfully retrieved feedback submitted by the authenticated user
        content:
          application/json:
            schema:
              $ref: ../components/schemas/interaction.yaml#/UserFeedbackPaginatedResponse

      '400':
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/GenericBadRequestResponse

      '500':
        description: Internal Server Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/InternalServerErrorResponse

    x-codeSamples:
      - lang: cURL
        label: Get my feedback
        source: |
          curl --location 'https://${HOSTNAME}/iudx/v2/user/feedback/user?page=1&size=10' \
            --header 'Authorization: Bearer <your-token>'

      - lang: cURL
        label: Get my feedback by asset
        source: |
          curl --location 'https://${HOSTNAME}/iudx/v2/user/feedback/user?assetId=811e9876-9381-4a25-8ad1-e8b289616ab8&page=1&size=10' \
            --header 'Authorization: Bearer <your-token>'
