/iudx/v2/user/feedback:
  post:
    tags:
      - User Interactions
    summary: Post user feedback on entity
    description: >
      Submit user feedback for a specific data asset: a star rating (1-5) and/or
      a structured action subtype with associated data. The user must have
      already interacted with the asset (e.g., via download or API access).
      Requires an authenticated user token.

      At least one of `entityRating` or the `actionSubtype`/`actionSubdata` pair
      must be provided.

      `actionSubtype` and `actionSubdata` are a paired field: if either one is
      provided, the other is also required.

      This endpoint is used only to create feedback for the first time. If
      feedback already exists for the specified asset, the request is rejected
      and the consumer must use the PUT endpoint to update the feedback while
      it is still in `PENDING` status.
    operationId: post-user-feedback
    security:
      - authorization: [ ]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - assetId
              - assetType
              - entityRating
            properties:
              assetId:
                type: string
                format: uuid
                description: UUID of the asset to provide feedback on
              assetType:
                type: string
                description: Type of the asset to provide feedback on
                enum:
                  - DATABANK
                  - AI_MODEL
                  - USECASE
              entityRating:
                type: integer
                minimum: 1
                maximum: 5
                description: Star rating from 1 (lowest) to 5 (highest)
              actionSubtype:
                type: string
                description: >-
                  Structured feedback category (e.g., data quality, documentation).
                  Required if actionSubdata is provided.
              actionSubdata:
                type: object
                description: >-
                  Additional structured data associated with the feedback.
                  Required if actionSubtype is provided.
          examples:
            ratingOnly:
              summary: Star rating only
              value:
                assetId: "9179b887-04ef-4ce5-ab3a-b5bbd39ea3c8"
                assetType: "DATABANK"
                entityRating: 5
            structuredOnly:
              summary: Structured feedback only (no rating)
              value:
                assetId: "9179b887-04ef-4ce5-ab3a-b5bbd39ea3c8"
                assetType: "AI_MODEL"
                actionSubtype: "documentation"
                actionSubdata:
                  comment: "Documentation is missing usage examples."
            full:
              summary: Star rating and structured feedback
              value:
                assetId: "9179b887-04ef-4ce5-ab3a-b5bbd39ea3c8"
                assetType: "DATABANK"
                entityRating: 4
                actionSubtype: "data_quality"
                actionSubdata:
                  comment: "The data is accurate and well documented."
            useCase:
              summary: Feedback on a use case asset
              value:
                assetId: "811e9876-9381-4a25-8ad1-e8b289616ab8"
                assetType: "USECASE"
                entityRating: 3
                actionSubtype: "relevance"
                actionSubdata:
                  comment: "Useful but could cover more edge cases."
    responses:
      '200':
        description: Feedback successfully recorded
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                title:
                  type: string
                detail:
                  type: string
            example:
              type: "urn:dx:controlPlane:success"
              title: "Success"
              detail: "Feedback submitted successfully"
      '400':
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/GenericBadRequestResponse
            examples:
              missingRequiredField:
                summary: Missing required field
                value:
                  type: urn:dx:controlPlane:badRequest
                  title: Bad Request
                  detail: Missing or malformed request
              missingFeedbackContent:
                summary: Neither entityRating nor actionSubtype/actionSubdata provided
                value:
                  type: urn:dx:controlPlane:badRequest
                  title: Bad Request
                  detail: At least one of entityRating or actionSubtype/actionSubdata must be provided
              orphanSubtype:
                summary: actionSubtype provided without actionSubdata
                value:
                  type: urn:dx:controlPlane:badRequest
                  title: Bad Request
                  detail: actionSubdata is required when actionSubtype is provided
              orphanSubdata:
                summary: actionSubdata provided without actionSubtype
                value:
                  type: urn:dx:controlPlane:badRequest
                  title: Bad Request
                  detail: actionSubtype is required when actionSubdata is provided
              invalidRating:
                summary: entityRating out of range
                value:
                  type: urn:dx:controlPlane:badRequest
                  title: Bad Request
                  detail: entityRating must be between 1 and 5
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/UnauthorizedResponse
            example:
              type: urn:dx:controlPlane:notAuthorized
              title: Not Authorized
              detail: Missing or invalid Bearer token
      '500':
        description: Internal Server Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/InternalServerErrorResponse
    x-codeSamples:
    - lang: cURL
      label: Post user feedback (rating + structured)
      source: 'curl --location ''https://${HOSTNAME}/iudx/v2/user/feedback'' \

        --header ''Authorization: Bearer <your-token>'' \

        --header ''Content-Type: application/json'' \

        --data ''{

        "assetId": "9179b887-04ef-4ce5-ab3a-b5bbd39ea3c8",

        "assetType": "DATABANK",

        "entityRating": 4,

        "actionSubtype": "data_quality",

        "actionSubdata": {

        "comment": "The data is accurate and well documented."

        }

        }''

        '
    - lang: cURL
      label: Post user feedback (rating only)
      source: 'curl --location ''https://${HOSTNAME}/iudx/v2/user/feedback'' \

        --header ''Authorization: Bearer <your-token>'' \

        --header ''Content-Type: application/json'' \

        --data ''{

        "assetId": "9179b887-04ef-4ce5-ab3a-b5bbd39ea3c8",

        "assetType": "DATABANK",

        "entityRating": 5

        }''

        '
    - lang: cURL
      label: Post user feedback (structured only)
      source: 'curl --location ''https://${HOSTNAME}/iudx/v2/user/feedback'' \

        --header ''Authorization: Bearer <your-token>'' \

        --header ''Content-Type: application/json'' \

        --data ''{

        "assetId": "9179b887-04ef-4ce5-ab3a-b5bbd39ea3c8",

        "assetType": "AI_MODEL",

        "actionSubtype": "documentation",

        "actionSubdata": {

        "comment": "Documentation is missing usage examples."

        }

        }''

        '
  put:
    tags:
      - User Interactions
    summary: Update user feedback on entity
    description: >
      Update previously submitted user feedback for a specific data asset.
      The feedback must have been submitted by the authenticated user and
      must currently be in `PENDING` status.

      At least one of `entityRating` or the `actionSubtype`/`actionSubdata`
      pair must be provided.

      `actionSubtype` and `actionSubdata` are a paired field: if either one
      is provided, the other is also required. `entityRating` may be supplied
      independently of the `actionSubtype`/`actionSubdata` pair.

      Feedback can only be updated while it is in `PENDING` status, before
      it has been reviewed by the COS Admin. Once feedback is `APPROVED` or
      `REJECTED`, it cannot be modified.

      If no feedback exists for the specified asset and authenticated user,
      the request is rejected. To submit feedback for the first time, use
      the POST /iudx/v2/user/feedback endpoint.

    operationId: put-user-feedback
    security:
      - authorization: [ ]

    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - assetId
              - assetType
            properties:
              assetId:
                type: string
                format: uuid
                description: UUID of the asset for which the feedback is being updated

              assetType:
                type: string
                description: Type of the asset for which the feedback is being updated
                enum:
                  - DATABANK
                  - AI_MODEL
                  - USECASE

              entityRating:
                type: integer
                minimum: 1
                maximum: 5
                description: >
                  Updated star rating from 1 (lowest) to 5 (highest).
                  Optional when structured feedback is provided.

              actionSubtype:
                type: string
                description: >
                  Updated structured feedback category (e.g., data quality,
                  documentation). Required if actionSubdata is provided.

              actionSubdata:
                type: object
                description: >
                  Updated additional structured data associated with the
                  feedback. Required if actionSubtype is provided.

          examples:
            ratingOnly:
              summary: Update star rating only
              value:
                assetId: "9179b887-04ef-4ce5-ab3a-b5bbd39ea3c8"
                assetType: "DATABANK"
                entityRating: 4

            structuredOnly:
              summary: Update structured feedback only
              value:
                assetId: "9179b887-04ef-4ce5-ab3a-b5bbd39ea3c8"
                assetType: "AI_MODEL"
                actionSubtype: "documentation"
                actionSubdata:
                  comment: "Documentation should include more usage examples."

            full:
              summary: Update star rating and structured feedback
              value:
                assetId: "9179b887-04ef-4ce5-ab3a-b5bbd39ea3c8"
                assetType: "DATABANK"
                entityRating: 4
                actionSubtype: "data_quality"
                actionSubdata:
                  comment: "The data is accurate but some records need correction."

            useCase:
              summary: Update feedback on a use case asset
              value:
                assetId: "811e9876-9381-4a25-8ad1-e8b289616ab8"
                assetType: "USECASE"
                entityRating: 3
                actionSubtype: "relevance"
                actionSubdata:
                  comment: "Useful use case, but more edge cases should be covered."

    responses:
      '200':
        description: Feedback successfully updated
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                title:
                  type: string
                detail:
                  type: string
            example:
              type: "urn:dx:controlPlane:success"
              title: "Success"
              detail: "Feedback updated successfully"

      '400':
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/GenericBadRequestResponse
            examples:
              missingRequiredField:
                summary: Missing required field
                value:
                  type: urn:dx:controlPlane:badRequest
                  title: Bad Request
                  detail: Missing or malformed request

              missingFeedbackContent:
                summary: Neither entityRating nor actionSubtype/actionSubdata provided
                value:
                  type: urn:dx:controlPlane:badRequest
                  title: Bad Request
                  detail: >
                    At least one of entityRating or
                    actionSubtype/actionSubdata must be provided

              orphanSubtype:
                summary: actionSubtype provided without actionSubdata
                value:
                  type: urn:dx:controlPlane:badRequest
                  title: Bad Request
                  detail: >
                    actionSubdata is required when actionSubtype is provided

              orphanSubdata:
                summary: actionSubdata provided without actionSubtype
                value:
                  type: urn:dx:controlPlane:badRequest
                  title: Bad Request
                  detail: >
                    actionSubtype is required when actionSubdata is provided

              invalidRating:
                summary: entityRating out of range
                value:
                  type: urn:dx:controlPlane:badRequest
                  title: Bad Request
                  detail: entityRating must be between 1 and 5

              feedbackNotFound:
                summary: Feedback does not exist
                value:
                  type: urn:dx:controlPlane:badRequest
                  title: Bad Request
                  detail: >
                    Feedback not found for the specified asset

              feedbackNotPending:
                summary: Feedback is no longer pending
                value:
                  type: urn:dx:controlPlane:badRequest
                  title: Bad Request
                  detail: >
                    Feedback can only be updated while it is in PENDING status

      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/UnauthorizedResponse
            example:
              type: urn:dx:controlPlane:notAuthorized
              title: Not Authorized
              detail: Missing or invalid Bearer token

      '500':
        description: Internal Server Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/InternalServerErrorResponse

    x-codeSamples:
      - lang: cURL
        label: Update user feedback (rating + structured)
        source: |
          curl --location --request PUT '${HOSTNAME}/iudx/v2/user/feedback' \
            --header 'Authorization: Bearer <your-token>' \
            --header 'Content-Type: application/json' \
            --data '{
              "assetId": "9179b887-04ef-4ce5-ab3a-b5bbd39ea3c8",
              "assetType": "DATABANK",
              "entityRating": 4,
              "actionSubtype": "data_quality",
              "actionSubdata": {
                "comment": "The data is accurate but some records need correction."
              }
            }'

      - lang: cURL
        label: Update user feedback (rating only)
        source: |
          curl --location --request PUT '${HOSTNAME}/iudx/v2/user/feedback' \
            --header 'Authorization: Bearer <your-token>' \
            --header 'Content-Type: application/json' \
            --data '{
              "assetId": "9179b887-04ef-4ce5-ab3a-b5bbd39ea3c8",
              "assetType": "DATABANK",
              "entityRating": 4
            }'

      - lang: cURL
        label: Update user feedback (structured only)
        source: |
          curl --location --request PUT '${HOSTNAME}/iudx/v2/user/feedback' \
            --header 'Authorization: Bearer <your-token>' \
            --header 'Content-Type: application/json' \
            --data '{
              "assetId": "9179b887-04ef-4ce5-ab3a-b5bbd39ea3c8",
              "assetType": "AI_MODEL",
              "actionSubtype": "documentation",
              "actionSubdata": {
                "comment": "Documentation should include more usage examples."
              }
            }'

      - lang: cURL
        label: Update feedback on a use case asset
        source: |
          curl --location --request PUT '${HOSTNAME}/iudx/v2/user/feedback' \
            --header 'Authorization: Bearer <your-token>' \
            --header 'Content-Type: application/json' \
            --data '{
              "assetId": "811e9876-9381-4a25-8ad1-e8b289616ab8",
              "assetType": "USECASE",
              "entityRating": 3,
              "actionSubtype": "relevance",
              "actionSubdata": {
                "comment": "Useful use case, but more edge cases should be covered."
              }
            }'
  delete:
    tags:
    - User Interactions
    summary: Delete user feedback
    description: 'Clears the feedback fields (entityRating, actionSubtype, actionSubdata) for the
     authenticated user''s feedback entry on the given asset.
      The record itself is retained. User should be the one who has already interacted with the asset before.

      '
    operationId: delete-user-feedback
    security:
    - authorization: []
    parameters:
    - name: assetId
      in: query
      description: UUID of the asset whose feedback (from the authenticated user) should be cleared
      required: true
      schema:
        type: string
        format: uuid
    responses:
      '200':
        description: Feedback fields cleared successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                title:
                  type: string
                detail:
                  type: string
            example:
              type: "urn:dx:controlPlane:success"
              title: "Success"
              detail: "Feedback deleted successfully"
      '400':
        description: Bad Request
        content:
          application/json:
            schema:
