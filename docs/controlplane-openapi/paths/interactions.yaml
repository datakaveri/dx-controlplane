/iudx/v2/user/feedback:
  post:
    tags:
      - User Interactions
    summary: Post user feedback on entity
    description: >
      Submit user feedback for a specific data asset: a star rating (1-5) and/or
      a structured action subtype with associated data. The user must have
      already interacted with the asset (e.g., via download or API access).
      Requires an authenticated user token.


      At least one of `entityRating` or the `actionSubtype`/`actionSubdata` pair
      must be provided; a request with neither results in a 400 Bad Request.


      `actionSubtype` and `actionSubdata` are a paired field: if either one is
      provided, the other is also required. Providing only one of the two
      results in a 400 Bad Request. `entityRating` may be supplied independently
      of the `actionSubtype`/`actionSubdata` pair. Calling this endpoint again
      for the same `assetId` updates the existing feedback entry instead of
      creating a duplicate.
    operationId: post-user-feedback
    security:
      - authorization: [ ]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - assetId
              - assetType
              - entityRating
            properties:
              assetId:
                type: string
                format: uuid
                description: UUID of the asset to provide feedback on
              assetType:
                type: string
                description: Type of the asset to provide feedback on
                enum:
                  - DATABANK
                  - AI_MODEL
                  - USECASE
              entityRating:
                type: integer
                minimum: 1
                maximum: 5
                description: Star rating from 1 (lowest) to 5 (highest)
              actionSubtype:
                type: string
                description: >-
                  Structured feedback category (e.g., data quality, documentation).
                  Required if actionSubdata is provided.
              actionSubdata:
                type: object
                description: >-
                  Additional structured data associated with the feedback.
                  Required if actionSubtype is provided.
          examples:
            ratingOnly:
              summary: Star rating only
              value:
                assetId: "9179b887-04ef-4ce5-ab3a-b5bbd39ea3c8"
                assetType: "DATABANK"
                entityRating: 5
            structuredOnly:
              summary: Structured feedback only (no rating)
              value:
                assetId: "9179b887-04ef-4ce5-ab3a-b5bbd39ea3c8"
                assetType: "AI_MODEL"
                actionSubtype: "documentation"
                actionSubdata:
                  comment: "Documentation is missing usage examples."
            full:
              summary: Star rating and structured feedback
              value:
                assetId: "9179b887-04ef-4ce5-ab3a-b5bbd39ea3c8"
                assetType: "DATABANK"
                entityRating: 4
                actionSubtype: "data_quality"
                actionSubdata:
                  comment: "The data is accurate and well documented."
            useCase:
              summary: Feedback on a use case asset
              value:
                assetId: "811e9876-9381-4a25-8ad1-e8b289616ab8"
                assetType: "USECASE"
                entityRating: 3
                actionSubtype: "relevance"
                actionSubdata:
                  comment: "Useful but could cover more edge cases."
    responses:
      '200':
        description: Feedback successfully recorded
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                title:
                  type: string
                detail:
                  type: string
            example:
              type: "urn:dx:controlPlane:success"
              title: "Success"
              detail: "Interaction updated successfully"
      '400':
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/GenericBadRequestResponse
            examples:
              missingRequiredField:
                summary: Missing required field
                value:
                  type: urn:dx:controlPlane:badRequest
                  title: Bad Request
                  detail: Missing or malformed request
              missingFeedbackContent:
                summary: Neither entityRating nor actionSubtype/actionSubdata provided
                value:
                  type: urn:dx:controlPlane:badRequest
                  title: Bad Request
                  detail: At least one of entityRating or actionSubtype/actionSubdata must be provided
              orphanSubtype:
                summary: actionSubtype provided without actionSubdata
                value:
                  type: urn:dx:controlPlane:badRequest
                  title: Bad Request
                  detail: actionSubdata is required when actionSubtype is provided
              orphanSubdata:
                summary: actionSubdata provided without actionSubtype
                value:
                  type: urn:dx:controlPlane:badRequest
                  title: Bad Request
                  detail: actionSubtype is required when actionSubdata is provided
              invalidRating:
                summary: entityRating out of range
                value:
                  type: urn:dx:controlPlane:badRequest
                  title: Bad Request
                  detail: entityRating must be between 1 and 5
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/UnauthorizedResponse
            example:
              type: urn:dx:controlPlane:notAuthorized
              title: Not Authorized
              detail: Missing or invalid Bearer token
      '500':
        description: Internal Server Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/InternalServerErrorResponse
    x-codeSamples:
    - lang: cURL
      label: Post user feedback (rating + structured)
      source: 'curl --location ''https://${HOSTNAME}/iudx/v2/user/feedback'' \

        --header ''Authorization: Bearer <your-token>'' \

        --header ''Content-Type: application/json'' \

        --data ''{

        "assetId": "9179b887-04ef-4ce5-ab3a-b5bbd39ea3c8",

        "assetType": "DATABANK",

        "entityRating": 4,

        "actionSubtype": "data_quality",

        "actionSubdata": {

        "comment": "The data is accurate and well documented."

        }

        }''

        '
    - lang: cURL
      label: Post user feedback (rating only)
      source: 'curl --location ''https://${HOSTNAME}/iudx/v2/user/feedback'' \

        --header ''Authorization: Bearer <your-token>'' \

        --header ''Content-Type: application/json'' \

        --data ''{

        "assetId": "9179b887-04ef-4ce5-ab3a-b5bbd39ea3c8",

        "assetType": "DATABANK",

        "entityRating": 5

        }''

        '
    - lang: cURL
      label: Post user feedback (structured only)
      source: 'curl --location ''https://${HOSTNAME}/iudx/v2/user/feedback'' \

        --header ''Authorization: Bearer <your-token>'' \

        --header ''Content-Type: application/json'' \

        --data ''{

        "assetId": "9179b887-04ef-4ce5-ab3a-b5bbd39ea3c8",

        "assetType": "AI_MODEL",

        "actionSubtype": "documentation",

        "actionSubdata": {

        "comment": "Documentation is missing usage examples."

        }

        }''

        '
  get:
    tags:
    - User Interactions
    summary: Get user feedback
    description: 'Retrieve paginated user feedback with optional filters by user, asset, or action subtype. Requires an authenticated user token.

      '
    operationId: get-user-feedback
    security:
    - authorization: []
    parameters:
    - name: userId
      in: query
      description: Filter by user UUID
      required: false
      schema:
        type: string
        format: uuid
    - name: assetId
      in: query
      description: Filter by asset UUID
      required: false
      schema:
        type: string
        format: uuid
    - name: actionSubtype
      in: query
      description: Filter by action subtype (repeatable)
      required: false
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    - name: rating
      in: query
      description: Filter by star rating (repeatable)
      required: false
      style: form
      explode: true
      schema:
        type: array
        items:
          type: integer
          minimum: 1
          maximum: 5
    - name: time
      in: query
      description: Start of the rating-creation time window. Requires `timerel`; requires `endtime` for `between`/`during`.
      required: false
      schema:
        type: string
        format: date-time
    - name: endtime
      in: query
      description: End of the rating-creation time window. Only used with `timerel=between` or `timerel=during`.
      required: false
      schema:
        type: string
        format: date-time
    - name: timerel
      in: query
      description: Temporal relation to apply against `ratingCreatedAt` when `time` is provided.
      required: false
      schema:
        type: string
        enum:
          - before
          - after
          - between
          - during
    - $ref: ../components/parameters.yaml#/PageParam
    - $ref: ../components/parameters.yaml#/SizeParam
    - name: sort
      in: query
      description: 'Sort results by rating creation time. Format: `ratingCreatedAt:asc` or `ratingCreatedAt:desc`. Defaults to `ratingCreatedAt:desc`.'
      required: false
      schema:
        type: string
      example: ratingCreatedAt:desc
    responses:
      '200':
        description: Successfully retrieved user feedback
        content:
          application/json:
            schema:
              $ref: ../components/schemas/interaction.yaml#/UserFeedbackPaginatedResponse
      '400':
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/GenericBadRequestResponse
      '500':
        description: Internal Server Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/InternalServerErrorResponse
    x-codeSamples:
    - lang: cURL
      label: Get user feedback (by asset)
      source: 'curl --location ''https://${HOSTNAME}/iudx/v2/user/feedback?assetId=811e9876-9381-4a25-8ad1-e8b289616ab8&page=1&size=10'' \

        --header ''Authorization: Bearer <your-token>''

        '
    - lang: cURL
      label: Get user feedback (by user)
      source: 'curl --location ''https://${HOSTNAME}/iudx/v2/user/feedback?userId=fd62ba22-d338-4dad-b09c-2bccfa20b04a&page=1&size=10'' \

        --header ''Authorization: Bearer <your-token>''

        '
    - lang: cURL
      label: Get user feedback (by action subtype, repeatable)
      source: 'curl --location ''https://${HOSTNAME}/iudx/v2/user/feedback?actionSubtype=data_quality&actionSubtype=documentation&page=1&size=10'' \

        --header ''Authorization: Bearer <your-token>''

        '
    - lang: cURL
      label: Get user feedback (unfiltered, paginated)
      source: 'curl --location ''https://${HOSTNAME}/iudx/v2/user/feedback?page=1&size=10'' \

        --header ''Authorization: Bearer <your-token>''

        '
  delete:
    tags:
    - User Interactions
    summary: Delete user feedback
    description: 'Clears the feedback fields (entityRating, actionSubtype, actionSubdata) for the
     authenticated user''s feedback entry on the given asset.
      The record itself is retained. User should be the one who has already interacted with the asset before.

      '
    operationId: delete-user-feedback
    security:
    - authorization: []
    parameters:
    - name: assetId
      in: query
      description: UUID of the asset whose feedback (from the authenticated user) should be cleared
      required: true
      schema:
        type: string
        format: uuid
    responses:
      '200':
        description: Feedback fields cleared successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                title:
                  type: string
                detail:
                  type: string
            example:
              type: "urn:dx:controlPlane:success"
              title: "Success"
              detail: "Interaction deleted successfully"
      '400':
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/GenericBadRequestResponse
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/UnauthorizedResponse
            example:
              type: urn:dx:controlPlane:notAuthorized
              title: Not Authorized
              detail: Missing or invalid Bearer token
      '404':
        description: Not Found
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                title:
                  type: string
                detail:
                  type: string
            example:
              type: "urn:dx:controlPlane:notFound"
              title: "Not Found"
              detail: "Feedback not found"
      '500':
        description: Internal Server Error
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/InternalServerErrorResponse
    x-codeSamples:
    - lang: cURL
      label: Delete user feedback
      source: 'curl --location --request DELETE ''https://${HOSTNAME}/iudx/v2/user/feedback?assetId=811e9876-9381-4a25-8ad1-e8b289616ab8''
        --header ''Authorization: Bearer <your-token>''

        '
