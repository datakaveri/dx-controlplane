      label: Delete user feedback
      source: 'curl --location --request DELETE ''https://${HOSTNAME}/iudx/v2/user/feedback?assetId=811e9876-9381-4a25-8ad1-e8b289616ab8''
        --header ''Authorization: Bearer <your-token>''

        '
/iudx/v2/user/feedback/platform:
  get:
    tags:
      - User Interactions
    summary: Get user feedback for platform review
    description: >
      Retrieve a paginated list of user feedback submitted for platform assets
      that is currently pending COS Admin review. This endpoint is restricted to
      users with the `cos_admin` role. COS Admins can use the returned feedback
      to review each submission and subsequently approve or reject it through
      the feedback approval API. Optional filters can be used to narrow the
      pending feedback by user, asset, action subtype, rating, or feedback
      creation time.
    operationId: get-platform-user-feedback
    security:
      - authorization: []
    parameters:
      - name: userId
        in: query
        description: Filter by user UUID
        required: false
        schema:
          type: string
          format: uuid
      - name: assetId
        in: query
        description: Filter by asset UUID
        required: false
        schema:
          type: string
          format: uuid
      - name: actionSubtype
        in: query
        description: Filter by action subtype (repeatable)
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: rating
        in: query
        description: Filter by star rating (repeatable)
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 5
      - name: time
        in: query
        description: Start of the rating-creation time window. Requires `timerel`; requires `endtime` for `between`/`during`.
        required: false
        schema:
          type: string
          format: date-time
      - name: endtime
        in: query
