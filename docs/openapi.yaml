      summary: Create subscription
      description: Create a new NGSI-LD subscription to do streaming, used as consumer api's.
      operationId: postSubscriptions
      security:
        - authorization: [ ]
      requestBody:
        description: Create Subscription details
        required: true
        content:
          application/json:
            schema:
              anyOf:
                - $ref: '#/components/schemas/createastreamingsubscriptionrequest'
                - $ref: '#/components/schemas/createastreamingsubscriptionrequest2'
                - $ref: '#/components/schemas/createastreamingsubscriptionrequest3'
                - $ref: '#/components/schemas/createastreamingsubscriptionrequest4'
                - $ref: '#/components/schemas/createastreamingsubscriptionrequest5'

      responses:
        '201':
          description: Subscription created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NgsiLdSubscriptionResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NgsiLdSubscriptionErrorResponse400'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NgsiLdSubscriptionErrorResponse401'
        '409':
          description: Conflict - Subscription already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NgsiLdSubscriptionErrorResponse409'
        '500':
          description: Internal Server Error
          content:
            application/json:
