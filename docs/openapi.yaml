          items:
            type: object
            properties:
              name:
                type: string
                enum: [ NGSI-LD,GATEWAY, OGC, FILE ]
            required:
              - name
      required:
        - name
        - type
        - shortDescription
        - description
        - tags
        - accessPolicy
        - organizationType
        - fileFormat
        - industry
        - yearRange
        - uploadFrequency
        - license
        - resourceServer
