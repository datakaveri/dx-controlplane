  /iudx/v2/auth/asset/request:
    post:
      summary: Create Asset Request
      tags:
        - Asset APIs
      operationId: post-auth-v2-asset-request
      requestBody:
        description: >
          - `asset_id` : The catalogue ID of the asset for which the request is to be created
          - `type` : The type of usage of asset
          - `additional_info` : Optional extra details about requester and intent
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                asset_id:
                  type: string
                  format: uuid
                  pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                type:
                  type: string
                  enum:
                    - SFTP
                    - API
                  minLength: 1
                additional_info:
                  description: >
                    Used to define additional information to access data for educational, research,
                    testing, non-commercial, or academic purposes.
                  type: object
              required:
                - asset_id
                - type
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/createNotificationSuccessResponse'
        '400':
          description: Bad Request – Schema validation or missing/invalid fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generalBadRequest'
              examples:
                Example:
                  value:
                    type: urn:dx:asset:badRequest
                    title: Bad Request
                    detail: Request could not be created, as the assetId or type is invalid
        '401':
          description: Unauthorized – Token invalid/expired or user not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '403':
          description: Forbidden – User cannot create request on own asset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/createNotificationForbidden'
        '404':
          description: Not Found – Asset not found in the catalogue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/createNotificationResourceNotFoundResponse'
        '409':
          description: Conflict – A request for the asset already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/createNotificationConflictResponse'
      security:
        - authorization: [ ]
    get:
      tags:
        - Asset APIs
      summary: List Org Admin User Asset Requests
      description: >
        Lists all the latest asset requests made by the org admin user calling the API,
        regardless of the request status.
      operationId: get-auth-v2-asset-request
