                  title:
                    type: string
                    example: Invalid Syntax
                  detail:
                    type: string
                    example: "Wrong Item Type"

      x-codeSamples:
        - lang: cURL
          label: list indexed filter values
          source: |
            curl --location 'https://example.com/iudx/v2/cat/list' \
