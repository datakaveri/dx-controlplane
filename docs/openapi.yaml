      example:
        q: "sat"
        autoComplete: true
        fuzzy: true
        filter:
          - "id"
          - "label"
          - "name"
          - "description"
          - "tags"
    SearchCriteriaRequest:
      type: object
      additionalProperties: false   # (or true, if you prefer)
      properties:
        searchCriteria:
          type: array
          items:
            $ref: '#/components/schemas/SearchCriteria'
        filter:
          type: array
          items:
            type: string
          description: List of fields to return
      required:
        - searchCriteria
    TextSearchRequest:
      type: object
      additionalProperties: false
      properties:
        q:
          type: string
          description: The search query string.
        fuzzy:
          type: boolean
          description: Enables fuzzy matching.
        autoComplete:
          type: boolean
          description: Enables autocomplete suggestions.
      required:
        - q
    ComplexSearchRequest:
      type: object
      additionalProperties: false
      properties:
        q:
          type: string
          description: The search query string.
        fuzzy:
          type: boolean
          description: Enables fuzzy matching.
        autoComplete:
          type: boolean
          description: Enables autocomplete suggestions.
        searchCriteria:
          type: array
          items:
            $ref: '#/components/schemas/SearchCriteria'
          description: List of property-based search criteria.
      required:
        - q
        - searchCriteria
    SearchCriteria:
      type: object
      additionalProperties: false
      required:
        - field
        - searchType
        - values
      properties:
        field:
          type: string
          description: Name of the property to filter.
        searchType:
          type: string
          enum:
            - term
            - betweenTemporal
            - beforeTemporal
            - afterTemporal
            - betweenRange
            - beforeRange
            - afterRange
          description: |
            Type of search to apply. Valid types:
            - term: Property match
            - betweenTemporal: ISO datetime range
            - beforeTemporal: Before datetime
            - afterTemporal: After datetime
            - betweenRange: Numeric range
            - beforeRange: Less than value
            - afterRange: Greater than value
        values:
          type: array
          items:
            oneOf:
              - type: string
              - type: number
          description: |
            Values for the selected `searchType`. Required value format:
            - `term`: One or more strings
            - `betweenTemporal`: Two ISO date-time strings
            - `beforeTemporal` / `afterTemporal`: One ISO date-time string
            - `betweenRange`: Two numbers
            - `beforeRange` / `afterRange`: One number
