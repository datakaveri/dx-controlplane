          type: integer
        department:
          type: string
        resourceType:
          type: string
        industry:
          type: string
        geoCoverage:
          type: string
        yearRange:
          type: string
        verifiedBy:
          type: string
        uploadFrequency:
          type: string
        license:
          type: string
        dataDescriptor:
          type: object
          description: >
            A JSON object describing the structure or schema of the dataset.
            Must be a valid JSON object (not a stringified JSON). 
            Any key-value pairs are allowed. Flattened in Elasticsearch for flexible nested key indexing.
          additionalProperties: true
          example:
            columns:
              - name: "temperature"
                type: "float"
              - name: "humidity"
                type: "integer"
            formatVersion: "v1.0"
        dataSample:
          type: object
          description: >
            Sample or representative data for the dataset.
            Must be passed as a **valid JSON object**, not as a string.
            Flattened in Elasticsearch for flexible nested key indexing.
