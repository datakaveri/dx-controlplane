            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /iudx/v2/cat/item/access:
    get:
      tags:
        - CAT Entity
      description: |
        Get an item with **access policy enforcement**. - If `accessPolicy=open`, the item is accessible to anyone. - If `accessPolicy=restricted`, user access will be validated. - If `accessPolicy=private`, only the owner or users with admin roles(either cos_admin or org_admin) can access it.
        If a Bearer token is provided in the Authorization header, the request will be authenticated, and access checks will be performed accordingly.
        ❗ For items with `accessPolicy=restricted` or `accessPolicy=private`, a valid token **must** be provided. Otherwise, the request will be rejected with a **401 Unauthorized** error.
        ### Delegator Access
        - If `isDelegator=true`, the caller is treated as a delegator accessing
          the item on behalf of a **delegate**.
        - In this case, `did` is mandatory. - Delegation scopes are validated to ensure the delegator has access to
          the requested item.
        - If delegation does not exist or scope does not permit access,
          the request will be rejected with **403 Forbidden**.

        **Log Type:** `ASSET`
      operationId: get item with accessPolicy
      security:
        - optionalAuth: []
      parameters:
        - name: id
          in: query
          description: ID of the DX Entity
          required: true
          schema:
            type: string
            format: uuid
            pattern: ^[a-zA-Z0-9]{8}-[a-zA-Z0-9]{4}-[a-zA-Z0-9]{4}-[a-zA-Z0-9]{4}-[a-zA-Z0-9]{12}$
        - name: isDelegator
          in: query
          description: |
            Indicates whether the caller is accessing the item as a delegator. Defaults to `false` when not provided.
          required: false
          schema:
            type: boolean
            default: false
        - name: did
          in: query
          description: |
            Delegate DID. **Mandatory when `isDelegator=true`**.
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Found the item (access granted).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/successResponseForGetAIModelEntityWithAccess'
                  - $ref: '#/components/schemas/successResponseForGetDataBankEntityWithAccess'
                  - $ref: '#/components/schemas/successResponseForGetAdexAppsEntityWithAccess'
        '400':
          description: Invalid ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/invalidIdErrorResponse'
              example:
                type: dx:controlPlane:badRequest
                title: Bad Request
                detail: Missing or malformed request
        '401':
          description: Missing or invalid authentication token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                MissingToken:
                  summary: Missing Bearer token
                  value:
                    type: dx:controlPlane:notAuthorized
                    title: Not Authorized
                    detail: Missing Bearer token
                InvalidToken:
                  summary: Invalid token format
                  value:
                    type: dx:controlPlane:notAuthorized
                    title: Not Authorized
                    detail: Invalid token format
        '403':
          description: Forbidden – user does not have access based on `accessPolicy`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponseWithObjects'
              examples:
                Forbidden:
                  value:
                    type: dx:controlPlane:forbidden
                    title: Forbidden
                    detail: No ACTIVE policy exists for this user/item
                NoDelegation:
                  summary: Delegation does not exist or is invalid
                  value:
                    type: dx:controlPlane:forbidden
                    title: Forbidden
                    detail: Delegation doesn't exist for delegator and delegate
                ScopeDenied:
                  summary: Delegation scope does not allow access
                  value:
                    type: dx:controlPlane:forbidden
                    title: Forbidden
                    detail: Delegator not authorized for this item
        '404':
          description: Didn't find the item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/invalidIdErrorResponse'
              example:
                type: dx:controlPlane:notFound
                title: Not Found
                detail: doc doesn't exist
      x-codeSamples:
        - lang: cURL
          label: get item with accessPolicy
          source: |
            curl --location --request GET 'https://${HOSTNAME}/iudx/v2/cat/item/access?id=uuid' \
            --header 'Authorization: Bearer <token>'
        - lang: cURL
          label: get item with accessPolicy (delegator)
          source: |
            curl --location --request GET
            'https://${HOSTNAME}/iudx/v2/cat/item/access?id=uuid&isDelegator=true&did=delegate-did' \
            --header 'Authorization: Bearer <token>'
  /iudx/v2/auth/jwks:
    get:
      operationId: get-auth-v2-jwks
      summary: Get public key in JWKS format.
