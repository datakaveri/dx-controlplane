  /iudx/v2/user/feedback:
    post:
      tags:
        - User Interactions
      summary: Post user feedback on entity
      description: |
        Submit user feedback for a specific data asset, including an optional star rating (1-5) and/or a structured action subtype with associated data. The user must have already interacted with the asset (e.g., via download or API access). Requires an authenticated user token.
      operationId: post-user-feedback
      security:
        - authorization: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - asset_id
              properties:
                asset_id:
                  type: string
                  format: uuid
                  description: UUID of the asset to provide feedback on
                entity_rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                  description: Star rating from 1 (lowest) to 5 (highest)
                action_subtype:
                  type: string
                  description: Structured feedback category (e.g., data quality, documentation)
                action_subdata:
                  type: object
                  description: Additional structured data associated with the feedback
      responses:
        '200':
          description: Feedback successfully recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericBadRequestResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
    get:
      tags:
        - User Interactions
      summary: Get user feedback
      description: |
        Retrieve paginated user feedback with optional filters by user, asset, or action subtype. Requires an authenticated user token.
      operationId: get-user-feedback
      security:
        - authorization: []
      parameters:
        - name: user_id
          in: query
          description: Filter by user UUID
          required: false
          schema:
            type: string
            format: uuid
        - name: asset_id
          in: query
          description: Filter by asset UUID
          required: false
          schema:
            type: string
            format: uuid
        - name: action_subtype
          in: query
          description: Filter by action subtype (repeatable)
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Successfully retrieved user feedback
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserFeedbackPaginatedResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericBadRequestResponse'
