  /iudx/v2/acl_servers:
    get:
      summary: List ACL Servers
      operationId: list acl servers
      tags:
        - ACL Servers
      security:
        - authorization: []
      description: |
        Retrieves the list of available ACL APD servers that can be associated
        with datasets, assets, or resources during onboarding.

        ACL servers are responsible for managing access control policies for
        consumers and delegates. Providers can choose an ACL server while
        onboarding metadata so that access requests for the asset can later
        be governed through the selected ACL APD server.

        **Access Control**
        - Accessible only to users with `cos_admin` or `org_admin` roles.

        **Role-based behavior**
        - `cos_admin`: Returns all ACL servers available in the system.
        - `org_admin`: Returns only the ACL servers created by the requesting organization administrator.

        **Usage**
        - Typically used by provider onboarding workflows to fetch the list
          of available ACL servers before publishing dataset metadata.
        - The returned `id` should be referenced while onboarding assets/resources.
      responses:
        '200':
          description: ACL servers retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - type
                  - title
                  - result
                properties:
                  type:
                    type: string
                    example: dx:controlPlane:success
                  title:
                    type: string
                    example: Success
                  result:
                    type: array
                    items:
                      $ref: '#/components/schemas/AclServer'
              example:
                type: dx:controlPlane:success
                title: Success
                result:
                  - id: 2ef0f344-dc41-4369-a50b-1515a0db5db2
                    name: DX ACL APD Server
                    url: acl-apd.iudx.io
                    owner_id: 1dc28cc6-d614-461a-9b8f-d6110feb3e2f
                    visibility: PUBLIC
                    status: ACTIVE
                    created_at: '2025-09-29T08:38:27.149785'
                    updated_at: '2025-09-29T08:38:27.149785'
        '401':
          description: Unauthorized - Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingToken:
                  value:
                    type: dx:controlPlane:notAuthorized
                    title: Not Authorized
                    detail: Missing Bearer token
                invalidToken:
                  value:
                    type: dx:controlPlane:notAuthorized
                    title: Not Authorized
                    detail: Invalid token format
        '403':
          description: Forbidden - Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                type: dx:controlPlane:forbidden
                title: Forbidden
                detail: User does not have the required role.
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-codeSamples:
        - lang: cURL
          label: List ACL Servers
          source: |
            curl --location \
            'https://${HOSTNAME}/iudx/v2/acl_servers' \
            --header 'Authorization: Bearer <YOUR_ACCESS_TOKEN>'
    post:
      summary: Create an ACL Server
      operationId: create acl server
      tags:
        - ACL Servers
      security:
        - authorization: []
      description: |
        Creates a new ACL APD server configuration.

        ACL servers are used for managing access policies for assets/resources.
        Providers can associate one of the configured ACL servers while
        onboarding metadata into the catalogue.

        **Access Control**
        - Accessible only to users with `cos_admin` or `org_admin` roles.

        **Notes**
        - The created ACL server will initially be in `PENDING` status.
        - Ownership is automatically assigned to the requesting user’s organization.
        - The configured URL should point to a valid DX ACL APD deployment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AclServerCreateRequest'
            example:
              name: DX ACL APD Server
              url: acl-apd.iudx.io
              visibility: PUBLIC
      responses:
        '201':
          description: ACL Server created successfully
          content:
            application/json:
              schema:
