  /iudx/v2/cat/assets/share:
    post:
      tags:
        - Share Assets
      description: |
        Share owned catalogue assets with specific users or organizations.

        This API controls discovery visibility of assets for other users in catalogue APIs
        such as `/search`, `/list`, and `/count`.

        Sharing an asset allows the target users or organization members to discover the asset
        through catalogue discovery APIs. This does not automatically grant operational access
        to the asset. ACL authorization checks continue to remain independent.

        Supported share types:
        - USER → Share asset with specific users
        - ORGANIZATION → Share asset with all users belonging to an organization

        Notes:
        - Only asset owners can perform sharing operations.
        - The API supports sharing assets with any accessType.
        - Existing PUBLIC asset visibility behaviour remains unchanged.
        - Duplicate active share entries are ignored safely.
      operationId: share asset visibility
      security:
        - authorization: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - itemId
                - shareType
                - ids
              properties:
                itemId:
                  type: string
                  format: uuid
                  description: Asset item identifier
                  example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                shareType:
                  type: string
                  enum:
                    - USER
                    - ORGANIZATION
                  description: Type of visibility sharing
                ids:
                  type: array
                  description: |
                    List of target userIds or organizationIds depending on shareType
                  items:
                    type: string
                    format: uuid
                  example:
                    - 2aa85f64-5717-4562-b3fc-2c963f66afa1
                    - 2aa85f64-5717-4562-b3fc-2c963f66afa2
            examples:
              userShare:
                summary: Share asset with users
                value:
                  itemId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  shareType: USER
                  ids:
                    - 2aa85f64-5717-4562-b3fc-2c963f66afa1
                    - 2aa85f64-5717-4562-b3fc-2c963f66afa2
              organizationShare:
                summary: Share asset with organizations
                value:
                  itemId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  shareType: ORGANIZATION
                  ids:
                    - 8bb85f64-5717-4562-b3fc-2c963f66afa8
      responses:
        '200':
          description: Asset shared successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    example: dx:controlPlane:success
                  title:
                    type: string
