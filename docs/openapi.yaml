          headers:
            Content-Type:
              schema:
                type: string
              description: application/json
          content:
            application/json:
              schema:
                description: ''
                type: object
                properties:
                  keys:
                    type: array
                    uniqueItems: true
                    minItems: 1
                    items:
                      required:
                        - kty
                        - x5t#S256
                        - crv
                        - kid
                        - x5c
                        - x
                        - 'y'
                      properties:
                        kty:
                          type: string
                          minLength: 1
                        x5t#S256:
                          type: array
                          minLength: 1
                        crv:
                          type: string
                          minLength: 1
                        kid:
                          type: string
                          minLength: 1
                        x5c:
                          type: string
                          minLength: 1
                        x:
                          type: string
                          minLength: 1
                        'y':
                          type: string
                          minLength: 1
                required:
                  - keys
              examples:
                Certificate:
                  value:
                    keys:
                      - kty: EC
                        x5t#S256: tCrGI3X7KS4WhHwGqR89Z6lWwPidOAb_CFYCzQpQN3M
                        crv: P-256
                        kid: ES256
                        x5c:
                          - 
                        x: rVwOLOln7NhUdfZOQFfTOtJ62AgdKUeYZm8DgWCWJHY
                        'y': ml0_eXYqa_eMyTPop0rqqIVRQk8Y2o3Ux_PzvSTuN6w
      x-codeSamples:
        - lang: curl
          label: Example request
          source: |
            curl --location 'https://${HOSTNAME}/iudx/v2/auth/jwks'
      description: Get the public key in JWKS format to authenticate/validate the generated JWT using `/auth/v2/token`
  /iudx/v2/auth/token:
    parameters: []
    post:
      summary: Create Token
      operationId: post-auth-v2-token
      tags:
        - token
      description: |
        Issue a JWT access token using client credentials. Supports three modes: (1) **Identity token** - provide only clientId and clientSecret to get an identity token, (2) **Access token** - additionally provide an `itemId` in the request body to get an access token scoped to a specific resource, (3) **Delegate access token** - additionally provide a `delegationId` header to act on behalf of a delegator. The token is signed using ES256 and can be validated using the public key from `/auth/v2/jwks`.
      parameters:
        - in: header
          name: clientId
          required: true
          description: UUID of the client obtained from the client registration API
          schema:
            type: string
            format: uuid
            minLength: 36
            maxLength: 36
        - in: header
          name: clientSecret
          required: true
          description: Secret key associated with the clientId
          schema:
            type: string
            minLength: 10
            maxLength: 100
        - in: header
          name: delegationId
          required: false
          description: UUID of the delegation grant. Required when requesting a delegate access token on behalf of a delegator.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    example: urn:dx:controlPanel:success
                  title:
                    type: string
                    example: Success
                  result:
                    type: object
                    properties:
                      access_token:
                        type: string
                        description: The issued JWT access token
                        example: eyJ0eXAiOiJKv2QiLCJhbGciOiJFUzI1NiJ9...
                      token_type:
                        type: string
                        example: jwt
                      expires_in_minutes:
                        type: integer
                        description: Token validity period in minutes
                        example: 60
        '400':
          description: Bad Request - Missing or invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericBadRequestResponse'
        '401':
          description: Unauthorized - Invalid client credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
      x-codeSamples:
        - lang: curl
          label: Identity token request
          source: |
            curl --location --request POST 'https://${HOSTNAME}/iudx/v2/auth/token' \
                  --header 'clientId: dd0f645d-e286-40f5-ba73-1d3a06aaaa1e' \
                  --header 'clientSecret: dd45b0da4c3614249b8cfcb2e8a418b2b0293cfb'
        - lang: curl
          label: Access token request
          source: |
            curl --location 'https://${HOSTNAME}/iudx/v2/auth/token' \
                --header 'clientId: dd0f645d-e286-40f5-ba73-1d3a06aaaa1e' \
                --header 'clientSecret: dd45b0da4c3614249b8cfcb2e8a418b2b0293cfb' \
                --header 'Content-Type: application/json' \
                --data '{
                        "itemId":"74436122-e6f6-45bf-be53-7ee2c257826b"
                      }'
        - lang: curl
          label: Delegate Access token request
          source: |
            curl --location 'https://${HOSTNAME}/iudx/v2/auth/token' \
                --header 'clientId: dd0f645d-e286-40f5-ba73-1d3a06aaaa1e' \
                --header 'clientSecret: dd45b0da4c3614249b8cfcb2e8a418b2b0293cfb' \
                --header 'delegationId: 66e5c06f-d318-4522-9f23-26b327bd307b' \
                --header 'Content-Type: application/json' \
                --data '{
                        "itemId":"74436122-e6f6-45bf-be53-7ee2c257826b"
                      }'
