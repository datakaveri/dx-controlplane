openapi: 3.0.2
info:
  title: Dx- Control Plane - Catalogue - Authentication , Authorization and Accounting (AAA) Server
  version: 1.1.0
  description: |-

    # About DX AAA

     Dx Control Plane **Auth Server (AAA)**  is a core component of the Dx Control Plane responsible for validating JWT tokens and enforcing **Role-Based Access Control (RBAC)** on incoming API requests. The **Keycloak Server** acts as the **Identity Provider (IdP)** and issues signed JWT tokens upon successful user login or registration. The AAA validates the token by verifying its signature, expiration, and integrity, and extracts user roles from the token claims.
    This enables secure access to platform services such as organization management, credit management, compute APIs, and KYC check APIs. Users can be assigned roles such as `compute`, `publisher`, `org_admin`, and `cos_admin`, which determine the API operations they are authorized to perform.
    The Auth Server ensures that only authorized users can perform actions according to their role, by matching the required role for each API with the roles present in the user's JWT. Additionally, audit logging tracks authentication and authorization events for security and troubleshooting purposes. 

    # About DX Catalogue
     The DX Catalogue is a core component of the Dx Control Plane responsible for  dataset discovery portal and metadata store.It enables *Providers* of datasources to describe them with DX  based annotations to make discovery and consumption of data both automatable and semantically describable. For search and discovery, it allows users to search through text and geo-based queries.  The catalogue is a [JSON-LD](https://json-ld.org/) document stored and based on the  [RDF](https://www.w3.org/RDF/) information exchange model. 
    #  Configurations
    - **Server**: 
      - In the doc, we display the server url to be https://${HOSTNAME} with the hostname as ${HOSTNAME}
      - This could be configured according to the deployment
    - **Base path**:
         - Base path is the path on which API is served, relative to the host
         - It is the initial part of the API
         - These base path values could be configured according to the deployment
         - The base path for [DX AAA Server](https://github.com/datakaveri/iudx-aaa-server) is set to `/iudx/v2/auth`
         - The base path for [DX Catalogue Server](https://github.com/datakaveri/iudx-catalogue-server) is set to `/iudx/v2/cat`
     - **Request Samples**:
      - The `<tokenValue>` in the header of request sample could be replaced with respective token value [Also refer Tokens section [here](#section/Tokens)]
      - The `<payload>` in the request sample could be replaced with the payload given adjacent to the request sample    

    # API HTTP Responses
     Apart from the response codes specified in each API, the API server may respond with certain 4xx and 5xx error codes which are related to common API Gateway behaviours.
     The application should address them accordingly.

       
  contact:
    name: For support contact CDPG Team at
    email: ${SUPPORT_EMAIL}
    url: https://dataforpublicgood.org.in/
  license:
    name: Apache 2.0
servers:
  - url: https://${HOSTNAME}
    description: dynamic server url
tags:
  - name: ACL Servers
    description: |
      Manage APD (Access Policy Decision) ACL server registrations. ACL servers enforce
      authorization policies that decide which consumers can access which data resources.
      Only `cos_admin` can register or delete ACL servers.
  - name: Activity Logs
    description: |
      Retrieve audit logs of user API activity. Consumers can view their own activity history;
      COS Admins can view activity across all users. Supports time-based filtering and pagination.
  - name: Activity Report
    description: |
      Download CSV reports of platform activity logs for offline analysis and auditing.
      Requires `cos_admin` role.
  - name: App
    description: |
      App IDs provide a way to grant restricted, scoped access to platform APIs without exposing
      the user's primary credentials. A user creates an App ID with a specific set of roles and
      scopes, then shares the `appId` and `appSecret` with another user or service. The recipient
      can then use these credentials to access platform APIs — but only within the roles and scopes
      defined at the time the App ID was created.
  - name: CAT Entity
    description: |
      CRUD operations for catalogue items — the metadata documents that describe datasets,
      resource groups, resource servers, and other data entities on the platform.
      Providers manage their own items; COS Admins can manage any item.
      Items follow the [JSON-LD](https://json-ld.org/) format with DX-defined annotations.
  - name: Certificate API
    description: |
      Public key certificate APIs. Exposes the JWKS endpoint (`/auth/v2/jwks`) for verifying
      JWT token signatures using the platform's public key (ES256 algorithm).
  - name: Client APIs
    description: |
      Manage client secrets for programmatic, credential-based authentication.
      Client credentials allow external services or scripts to authenticate without
      requiring a user-level JWT token.
  - name: Compute APIs
    description: |
      Manage compute role requests. Users without the `compute` role can request it here.
      COS Admins review and approve or reject requests. Once approved, the `compute` role
      is assigned to the user in Keycloak, granting access to sandbox and compute infrastructure.

      **Status values:** `pending` → `granted` or `rejected`

      A previously rejected request can be re-submitted and is re-activated to `pending`
      rather than creating a duplicate record.
  - name: Conversations
    description: |
      Threaded message exchanges attached to entity-driven requests such as org join,
      org create, and credit requests. Each conversation is scoped to a `request_id`.

      - Supports root-level messages and nested replies.
      - Senders identify as `requester` or `approver`.
      - Messages can be marked `is_internal: true` to make them visible only to approvers.
      - Metadata (arbitrary JSON) can be attached to any message.
  - name: Credit APIs
    description: |
      Manage the platform credit system used to control access to compute infrastructure.
      Credits are granted by COS Admins and consumed when running compute workloads.

      **Flows:**
      - Users submit a credit request; COS Admins grant (with `amount` and `expiration_date`) or reject it.
      - COS Admins can directly add or deduct credits from a user's balance.
      - Users can query their current balance and request history.

      **Status values:** `pending` → `granted` or `rejected`
  - name: Delegation APIs
    description: |
      Delegation allows an authenticated user (the **delegator**) to grant another user
      (the **delegate**) the ability to act on their behalf. Delegations are scoped by role
      and optionally restricted by specific scopes and entity types, each with their own expiry.
  - name: Discovery – My Assets
    description: |
      Search and count APIs for catalogue assets scoped to the currently authenticated user —
      assets they own, have been granted access to, or that match their roles and permissions.
  - name: Discovery – Public
    description: |
      Unauthenticated full-text and geo-based search and count APIs for discovering
      publicly available catalogue assets across the platform.
  - name: KYC APIs
    description: |
      Know Your Customer (KYC) verification management. KYC is a prerequisite before users
      can access credit balance, submit credit requests, or request the compute role.
      COS Admins can initiate or revoke a user's KYC verification.
  - name: Leaderboard
    description: |
      Read-only leaderboard APIs that rank providers, organisations, and assets based on
      platform interaction metrics such as views, likes, and usage frequency.
  - name: List Available Filters
    description: |
      Returns the set of attribute-based filter keys that can be used in catalogue
      search queries (e.g. resource type, tags, domains).
  - name: Organisation APIs
    description: |
      Full lifecycle management of organisations on the platform.

      **Flows covered:**
      - Organisation creation requests (submit, admin approval, withdrawal)
      - Organisation join requests (submit, admin approval, rejection, withdrawal)
      - Member management (list users, update roles, remove users)
      - Provider role requests within an organisation
      - Reports for org create, join, and provider role request activity

      **Roles involved:** Consumer, Org Admin, COS Admin
  - name: Organisation Assets Management
    description: |
      Browse and filter assets registered under a specific organisation.
      Supports visibility control, pagination, and attribute-based filtering.
  - name: Platform Assets Management
    description: |
      Browse and filter all assets registered on the platform, regardless of organisation.
      Intended for platform-wide discovery by admins and authorised users.
  - name: Platform Provider Requests
    description: |
      Provider role requests for users who are **not part of any organisation**. This is the
      platform track — an alternative to the organisation-based provider request flow.

      - **Consumer** — submits, views, or withdraws their own request.
      - **COS Admin** — reviews, approves, or rejects all requests.

      On approval, the `PROVIDER` role is automatically assigned in Keycloak.
      A user can only have one active (pending or granted) provider role request at a time,
      across both platform and organisation tracks.
  - name: Resource Servers
    description: |
      Manage resource server registrations. A resource server represents a deployed data
      endpoint that participates in the DX access control ecosystem for policy enforcement
      and token validation. Only `cos_admin` can register or delete resource servers.
  - name: Role APIs
    description: |
      User profile management and custom role APIs.

      **Covers:**
      - Get and update user info (self and admin views)
      - Password management
      - Admin-level user lookups and status updates
      - Custom role system: assign scoped custom roles to other users, list them, and delete them.
        Custom roles are stored in the platform DB and also reflected in Keycloak attributes.
  - name: Share Assets
    description: |
      Control asset visibility across organisations and users. Providers can grant or revoke
      access to their catalogue assets for specific organisations or individual users,
      making assets discoverable to a targeted audience beyond the default visibility rules.
  - name: Shared Assets
    description: |
      View catalogue assets that have been explicitly shared with the currently authenticated
      user by other providers or organisations.
  - name: Subscriptions
    description: |
      Manage NGSI-LD streaming subscriptions. Consumers subscribe to real-time data streams
      from resource entities. Each subscription is identified by a queue name and is bound
      to specific entity IDs and resource groups. Subscriptions can be created, listed,
      retrieved by ID, updated, and deleted.
  - name: token
    description: |
      JWT access token issuance APIs. Supports three token modes:

      - **Identity token** — provide `clientId` and `clientSecret` to get a basic identity token.
      - **Access token** — additionally provide an `itemId` to get a token scoped to a specific resource.
      - **Delegation token** — additionally provide a `delegationId` header to act on behalf of a delegator.

      Tokens are signed using ES256. Validate them against the JWKS endpoint (`/auth/v2/jwks`).
  - name: User Interactions
    description: |
      APIs for recording and querying user interactions with catalogue assets (views, likes, dislikes).
      Also includes user and provider feedback submission and retrieval, and a metrics sync
      endpoint that pushes interaction counts into aggregated stores used for leaderboard ranking.
  - name: Ingestion type(API/SFTP) APIs
    description: |
      Manage data ingestion adaptor registrations for API-based and SFTP-based ingestion pipelines.
      Providers register adaptors to connect their data sources to the DX platform ingestion layer.
paths:
  /iudx/v2/auth/app:
    post:
      tags:
        - App
      summary: Create an appId
      operationId: post-appId
      security:
        - authorization: []
      description: |
        Creates a new App ID for the authenticated user with a defined expiry. The App ID is
        paired with an App Secret at creation time — together these act as credentials that can
        be shared with another user or service to grant them restricted access scoped to the
        roles and permissions defined in this App ID. Requires an authenticated user token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostAppIdRequest'
      responses:
        '200':
          description: AppId created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppIdResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericBadRequestResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
      x-codeSamples:
        - lang: cURL
          label: Create AppId
          source: |
            curl --location 'https://${HOSTNAME}/iudx/v2/auth/app' \
            --header 'Authorization: Bearer <token>' \
            --header 'Content-Type: application/json' \
            --data '{
              "expiry_at": "2026-12-31T23:59:59Z"
            }'
    get:
      tags:
        - App
      summary: Get user's appIds
      operationId: get-appId
      security:
        - authorization: []
      description: |

        Retrieves all App IDs created by the authenticated user, including their current status
        (active or disabled), expiry timestamps, and associated scopes. Supports pagination via
        `page` and `size` query parameters and sorting via the `sorting` parameter.
        Requires an authenticated user token.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortingParam'
      responses:
        '200':
          description: Successfully retrieved apps
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAppsSuccessResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericBadRequestResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
      x-codeSamples:
        - lang: cURL
          label: Get AppIds
          source: |
            curl --location 'https://${HOSTNAME}/iudx/v2/auth/app' \
            --header 'Authorization: Bearer <token>'
  /iudx/v2/auth/app/{appId}:
    delete:
      tags:
        - App
      summary: Delete an appId
      operationId: delete-appId
      security:
        - authorization: []
      description: |
        Permanently removes an App ID owned by the authenticated user. Once deleted, any user
        or service using this `appId` and `appSecret` pair will immediately lose access to all
        APIs they were accessing through it. This action cannot be undone.
        Requires an authenticated user token.
      parameters:
        - name: appId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Unique identifier of the appId
      responses:
        '200':
          description: AppId status deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    example: dx:controlPlane:success
                  title:
                    type: string
                    example: Success
                  detail:
                    type: string
                    example: Deleted app id status successfully
              example:
                type: dx:controlPlane:success
                title: Success
                detail: Deleted app id status successfully
        '204':
          description: AppId deleted successfully
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericBadRequestResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
      x-codeSamples:
        - lang: cURL
          label: Delete AppId
          source: |
            curl --location --request DELETE \
            'https://${HOSTNAME}/iudx/v2/auth/app/7db00cd6-89e7-428b-a8d8-3b97bdd1e6b9' \
            --header 'Authorization: Bearer <token>'
    patch:
      tags:
        - App
      summary: Update appId status(active/disable)
      operationId: update-appId-status
      security:
        - authorization: []
      description: |
        Enables or disables an App ID owned by the authenticated user. Setting status to `disable`
              temporarily blocks all access for anyone using this `appId` and `appSecret` without
              permanently deleting it. Setting it back to `active` restores access. Use this to
              temporarily revoke access without losing the App ID configuration.
              Requires an authenticated user token.
      parameters:
        - name: appId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Unique identifier of the appId
        - name: status
          in: query
          required: true
          schema:
            type: string
            description: status of the appId
            enum:
              - active
              - disable
      responses:
        '200':
          description: AppId status updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    example: dx:controlPlane:success
                  title:
                    type: string
                    example: Success
                  detail:
                    type: string
                    example: App credentials status updated to active successfully
              example:
                type: dx:controlPlane:success
                title: Success
                detail: App credentials status updated to active successfully
        '204':
          description: AppId status updated successfully
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericBadRequestResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
      x-codeSamples:
        - lang: cURL
          label: Update AppId Status
          source: |
            curl --location --request PATCH \
            'https://${HOSTNAME}/iudx/v2/auth/app/7db00cd6-89e7-428b-a8d8-3b97bdd1e6b9?status=disable' \
            --header 'Authorization: Bearer <token>'
  /iudx/v2/auth/asset/request:
    post:
      summary: Create Asset Request
      tags:
        - Ingestion type(API/SFTP) APIs
      operationId: post-auth-v2-asset-request
      description: |
        Creates a data ingestion request (SFTP/API) for the authenticated user for a specific asset
        in the catalogue. The request is created in `PENDING` status and must be approved by a `cos_admin`.

        **Allowed Roles:** `provider`

        **Log Type:** `USER_ACTION`
      requestBody:
        description: |
          - `asset_id`: The catalogue ID of the asset for which the request is to be created
          - `type`: The type of data ingestion — either `SFTP` or `API`
          - `additional_info`: Optional extra details about the requester and intent (e.g. purpose, description)
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                asset_id:
                  type: string
                  format: uuid
                  pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                type:
                  type: string
                  enum:
                    - SFTP
                    - API
                  minLength: 1
                additional_info:
                  description: |
                    Used to define additional information to access data for educational, research,
                    testing, non-commercial, or academic purposes.
                  type: object
              required:
                - asset_id
                - type
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/createNotificationSuccessResponse'
        '400':
          description: Bad Request – Schema validation or missing/invalid fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generalBadRequest'
              examples:
                Example:
                  value:
                    type: urn:dx:asset:badRequest
                    title: Bad Request
                    detail: Request could not be created, as the assetId or type is invalid
        '401':
          description: Unauthorized – Token invalid/expired or user not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '403':
          description: Forbidden – User cannot create request on own asset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/createNotificationForbidden'
        '404':
          description: Not Found – Asset not found in the catalogue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/createNotificationResourceNotFoundResponse'
        '409':
          description: Conflict – A request for the asset already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/createNotificationConflictResponse'
      security:
        - authorization: []
    get:
      tags:
        - Ingestion type(API/SFTP) APIs
      summary: List Asset Requests
      description: |
        Lists all the latest asset requests visible to the authenticated user, regardless of status.
        Results are scoped by the caller's role — a `provider` sees only their own requests,
        while `org_admin` and `cos_admin` can see requests across their scope.

        **Allowed Roles:** `provider`, `org_admin`, `cos_admin`

        Supports pagination and the following filter query parameters:

        | Query Parameter | Description                                      |
        |-----------------|--------------------------------------------------|
        | `type`          | Filter by ingestion type — `SFTP` or `API`. Only this filter returns a filtered response. |
        | `status`        | Filter by request status (e.g. `PENDING`, `GRANTED`, `REJECTED`) |
        | `userId`        | Filter by the ID of the user who made the request |
        | `assetId`       | Filter by the catalogue asset ID |
        | `requestedAt`   | Filter by the time the request was made |
        | `updatedAt`     | Filter by the last updated time |

        **Log Type:** `USER_ACTION`
      operationId: get-auth-v2-asset-request
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortingParam'
        - $ref: '#/components/parameters/TimeParam'
        - $ref: '#/components/parameters/EndTimeParam'
        - $ref: '#/components/parameters/TimeRelParam'
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum:
              - SFTP
              - API
          description: Filter asset requests by ingestion type. This is the primary filter that returns a filtered response.
      responses:
        '200':
          description: Successfully fetched all asset requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetRequest'
              examples:
                ListResults:
                  value:
                    type: urn:dx:asset:success
                    title: Success
                    results:
                      - requestId: ea48d233-5d3b-4bdb-9545-691680c99cee
                        status: GRANTED
                        type: SFTP
                        additionalInfo:
                          name: John Doe
                          email: john.doe@example.org
                          phone: 9876543210
                          purpose: research
                          description: This dataset will be used for non-commercial, educational purposes
                        user:
                          userId: a13eb955-c691-4fd3-b200-f18bc78810b5
                          firstName: John
                          lastName: Doe
                          email: john.doe@example.org
                          organization: Open Science Org
                        updatedAt: '2025-06-04T07:25:08.663637'
                        requestedAt: '2025-06-04T09:10:57.267564'
                    paginationInfo:
                      page: 1
                      size: 1
                      totalCount: 10
                      totalPages: 10
                      hasNext: true
                      hasPrevious: false
        '400':
          description: Bad Request – Schema validation failed or incorrect query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/updateNotificationBadRequest'
        '401':
          description: Unauthorized - Token invalid or expired, or caller lacks permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '403':
          description: Forbidden - User does not have the required role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponse'
      security:
        - authorization: []
  /iudx/v2/auth/asset/request/{id}:
    put:
      summary: Update Asset Request Status
      tags:
        - Ingestion type(API/SFTP) APIs
      operationId: put-auth-v2-asset-request
      description: |
        Updates the status of an existing data ingestion access request by its ID.
        Only a `cos_admin` with the `asset-management` scope can perform this action.
        Use this to approve, reject, or update the state of a pending asset request.

        **Allowed Roles:** `cos_admin`

        **Required Scope:** `asset-management`

        **Log Type:** `USER_ACTION`
      parameters:
        - name: id
          in: path
          required: true
          description: Unique ID of the asset request
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      requestBody:
        description: Status to update in the asset request
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                status:
                  type: string
              required:
                - status
      responses:
        '200':
          description: Status update successful
          content:
            application/json:
              schema:
                type: string
                example: Asset request updated successfully
        '400':
          description: Bad Request – Schema validation or invalid status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generalBadRequest'
        '401':
          description: Unauthorized – Token invalid/expired or user not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '403':
          description: Forbidden – User does not have the cos_admin role or asset-management scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/createNotificationForbidden'
        '404':
          description: Not Found – Asset request not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/createNotificationResourceNotFoundResponse'
        '409':
          description: Conflict – Invalid state transition or already in target state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/createNotificationConflictResponse'
      security:
        - authorization: []
    delete:
      tags:
