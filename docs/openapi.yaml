    patch:
      tags:
        - Organisation Assets Management
      description: |
        Update the publication or data upload status of an organisation asset.
        **Role-based behavior:**
          - `org_admin` or `cos_admin` can update both `publishStatus` and `dataUploadStatus`
          - `provider` can update only `dataUploadStatus`
          - Attempting to update unauthorized fields will result in `403 Forbidden`
      operationId: patch item
      security:
        - authorization: []
      parameters:
        - name: id
          in: query
          description: ID of the DX Entity
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        description: |
          Request payload to update the asset status. At least one of the following fields must be provided.
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                publishStatus:
                  type: string
                  enum:
                    - ACTIVE
                    - PENDING
                    - DECLINED
                  description: Publication status of the asset
                  example: ACTIVE
                dataUploadStatus:
                  type: boolean
                  description: |
                    Indicates whether data has been uploaded for the asset. Must be a boolean value.
                  example: true
              additionalProperties: false
            example:
              publishStatus: ACTIVE
              dataUploadStatus: true
      responses:
        '200':
          description: Item status updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/successResponseWithObjects'
              examples:
                Patch Success:
                  value:
                    type: dx:controlPlane:success
                    title: Success
                    detail: 'Success: Item patched successfully'
                    result:
                      - id: f5600bf0-7312-4b09-9583-ba742281ebf1
        '400':
          description: Invalid request or update not permitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                MissingOrMalformedRequest:
                  summary: Missing or malformed request body
                  value:
                    type: dx:controlPlane:badRequest
                    title: Bad Request
                    detail: Missing or malformed request
                ItemNotFoundUnderOrganisation:
                  summary: Item does not belong to the organisation
                  value:
                    type: dx:controlPlane:badRequest
                    title: Bad Request
                    detail: No item found for update under your organization
        '401':
          description: Missing or invalid authentication token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                MissingBearerToken:
                  summary: Authorization header not provided
                  value:
                    type: dx:controlPlane:notAuthorized
                    title: Not Authorized
                    detail: Missing Bearer token
        '403':
          description: Forbidden – insufficient privileges
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                type: dx:controlPlane:forbidden
                title: Forbidden
                detail: Providers can only patch dataUploadStatus field
      x-codeSamples:
        - lang: cURL
          label: patch item
          source: |
            curl --location --request PATCH
            'https://${HOSTNAME}/iudx/v2/organisation/asset?id=uuid' \
            --header 'token: <token>'
            --data-raw '{
              "publishStatus": "ACTIVE",
              "dataUploadStatus": true
            }'
