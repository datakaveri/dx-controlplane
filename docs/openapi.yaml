          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid authentication token
    get:
      summary: Search assets created by the current authenticated user
      description: >
        Returns assets owned by the current authenticated user.
        This endpoint automatically filters results to only include items where
        `ownerUserId` matches the authenticated user's `sub` value from the token,
