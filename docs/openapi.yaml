tags:
  - name: Activity Logs
    x-displayName: "Activity Logs"
    description: >
      APIs for managing activity logs in the platform.
      These APIs allow users to retrieve their own activity logs as well as administrative logs for auditing purposes.
      The endpoints support filtering by time range and pagination, and they also provide CSV export functionality for both consumer and admin activity logs.
  - name: Activity Report
    x-displayName: "Activity Report"
    description: >
      APIs for generating CSV reports of activity logs.
      These endpoints allow administrators and consumers to download activity logs in CSV format for offline analysis and reporting.
  - name: Resource Servers
    description: |
      Manage resource server configurations used for data provisioning and ingestion.
      These APIs allow creation, listing, retrieval, and deletion of resource servers and are
      restricted to administrative users (`cos_admin` and `org_admin`).
  - name: CAT Entity
    description: |
      Manage catalogue entities and perform Create/Update/Read/Delete operations on them.
      These apis are intended to be used by DX(Data Exchange) Data *Providers*.
    x-displayName: CAT Entity
  - name: List Available Filters
    description: |
      APIs that expose available filter values for indexed catalogue fields.
      These endpoints are primarily used by UI clients to dynamically populate filter options
      based on the selected entity type (e.g., DataBank, AI Model, Apps).
  - name: Discovery – Public
    description: |
      Public catalogue discovery APIs.
      These APIs support global search and count operations over published catalogue entities
      and do not require ownership of the assets.
  - name: Discovery – My Assets
    description: |
      Owner-specific discovery APIs.
      These APIs allow authenticated users to search and view assets owned by them including unpublished or draft entities.
  - name: Organisation Assets Management
    description: |
      APIs for managing assets owned by a specific organization.
      These endpoints are restricted to users with the `org_admin` role and allow organisation
      administrators to view and manage all assets belonging to their organisation, regardless
      of publication or data upload status.
  - name: Platform Assets Management
    description: |
      Platform-wide asset management APIs.
      These endpoints are restricted to users with the `cos_admin` role and allow viewing and
      managing all assets across the platform, irrespective of ownership or status.
  - name: Subscriptions
    description: |
      NGSI-LD subscriptions apis.
      These apis are intended to be for the streaming purpose.
    x-displayName: Subscriptions

  - name: Bookmarks
    description: >
      APIs for managing user bookmarks on `DATABANK`, `AI_MODEL`, `USECASE` and ,
      `APP`.
    x-displayName: Bookmarks


components:
  securitySchemes:
    authorization:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak issued Bearer token
    optionalAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    UserIdParam:
      name: userId
      in: query
      description: id of the user(UUID) for whom to fetch activity logs
      schema:
        type: string
        format: uuid
        pattern: '^[0-9a-f]{8}\b-[0-9a-f]{4}\b-[0-9a-f]{4}\b-[0-9a-f]{4}\b-[0-9a-f]{12}$'

    AssetTypeParam:
      name: assetType
      in: query
      description: >
        The type of asset to filter the activity logs.
        This parameter allows filtering by specific asset types.
      required: false
      schema:
        type: string

    AssetNameParam:
      name: assetname
      in: query
      description: >
        This asset name is used to filter the activity logs.
        This parameter allows filtering by specific asset name.
      required: false
      schema:
        type: string

    ApiParam:
      name: api
      in: query
      description: >
        This parameter allows filtering by specific api endpoint name.
      required: false
      schema:
        type: string

    RoleParam:
      name: role
      in: query
      description: >
        This parameter allows filtering by specific role.
      required: false
      schema:
        type: string

    OperationParam:
      name: operation
      in: query
      description: >
        The type of operation to filter the activity logs.
        This parameter allows filtering by specific operations, such as `View`, `created`, etc.
      required: false
      schema:
        type: string

    OrganizationIdParam:
      name: organizationId
      in: query
      description: >
        The unique identifier (UUID) of the organization for which to fetch activity logs.
        Use this parameter to filter activity logs belonging to a specific organization.
      schema:
        type: string
        format: uuid
        pattern: '^[0-9a-f]{8}\b-[0-9a-f]{4}\b-[0-9a-f]{4}\b-[0-9a-f]{4}\b-[0-9a-f]{12}$'
    PageParam:
      name: page
      in: query
      description: Page number for pagination
      required: false
      schema:
        type: integer
        default: 1
        minimum: 1
    SizeParam:
      name: size
      in: query
      description: Page size for pagination
      required: false
      schema:
        type: integer
        default: 1000
        minimum: 1
    SizeParamReport:
      name: size
      in: query
      description: Page size for pagination , used as limit for query request
      required: false
      schema:
        type: integer
        default: 1000
        minimum: 1
    SortingParam:
      name: sort
      in: query
      description: 'This parameter allows sorting the results by up to 3 fields, separated
        by a semicolon (`;`). The format for each field is `fieldName:asc` or `fieldName:desc`.
        For example: `createdAt:desc;assetType:asc;userId:desc` will sort by creation
        date (descending), then asset type (ascending), then user ID (descending).'
      required: false
      schema:
        type: string
    TimeParam:
      name: time
      in: query
      description: This parameter specifies the <b>start time</b> for the temporal-query
        in `ISO8601` format.
      schema:
        type: string
    EndTimeParam:
      name: endtime
      in: query
      description: This parameter specifies the <b>endtime</b> for the temporal-query
        in `ISO8601` format.
      schema:
        type: string
    TimeRelParam:
      name: timerel
      in: query
      description: 'The temporal relation type to be applied for the time filter.
        Must be one of: <b>between</b>, <b>before</b>, or <b>after</b>. <b>between</b>
        must be used with both `time` and `endtime`. <b>before</b> or <b>after</b>
        must be used with only `time`.

        '
      required: false
      schema:
        type: string
        enum:
          - between
          - before
          - after
          -
    OrgNameParam:
      name: name
      in: query
      description: |
        The name of the organization sector to filter by.
        This parameter is used to filter entities based on their organizational sector.
      required: false
      schema:
        type: string
    EntityTypeParam:
      name: entity_type
      in: query
      description:
        The type of entity to filter by.
        This parameter is used to filter entities based on their type.
      required: false
      schema:
        type: string
    OrgSectorParam:
      name: org_sector
      in: query
      description:
        The sector of the organization to filter by.
        This parameter is used to filter entities based on their organizational sector.
      required: false
      schema:
        type: string

    StatusParam:
      name: status
      in: query
      description:
        The status of the asset request to filter by.
        This parameter is used to filter asset requests based on their status such as 'pending' , 'granted' and 'rejected'.
      required: false
      schema:
        type: string
  schemas:
    PostBookmarkRequest:
      type: object
      required:
        - entityId
        - entityType
      properties:
        entityId:
          type: string
          format: uuid
          description: Unique identifier of the entity to be bookmarked
          example: 7db00cd6-89e7-428b-a8d8-3b97bdd1e6b9

        entityType:
          type: string
          description: Type of the entity being bookmarked
          enum:
            - DATABANK
            - AI_MODEL
            - USECASE
            - APP

          example: DATABANK
    BookmarkResponse:
      type: object
      required:
        - type
        - title
        - result
      properties:
        type:
          type: string
          description: URN identifying the response category
          example: urn:dx:ControlPlane:success

        title:
          type: string
          description: Short response title
          example: Success

        result:
          $ref: '#/components/schemas/BookmarkResult'

    BookmarkResult:
      type: object
      required:
        - id
        - userId
        - entityId
        - entityType
        - createdAt
        - tableName
      properties:
        id:
          type: string
          format: uuid
          description: Internal bookmark identifier
          example: 210e92ee-ab93-4593-a035-60e2620a8eb8

        userId:
          type: string
          format: uuid
          description: Identifier of the user who created the bookmark
          example: 6effed2b-999c-44da-987a-f56a3aba96c2

        entityId:
          type: string
          format: uuid
          description: Identifier of the bookmarked entity
          example: 7db00cd6-89e7-428b-a8d8-3b97bdd1e6b9

        entityType:
          type: string
          description: Type of the bookmarked entity
          enum:
            - DATABANK
            - AI_MODEL
            - USECASE
            - APP
          example: DATABANK

