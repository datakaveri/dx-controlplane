  ##Cat apis
  /iudx/v2/cat/item:
    post:
      tags:
        - CAT Entity
      description: |
        Create a new catalogue item. The request body defines the entity type
        (e.g., `adex:AiModel`, `adex:DataBank`, `adex:Apps`) and its metadata.

        ### Backend-managed fields
        The following fields are **automatically set by the backend** and must not be modified by the client:
        - `itemCreatedAt`
        - `itemStatus`
        - `publishStatus`
        - `dataUploadStatus`
        - `lastUpdated`
        The `id` field **may be provided by the client**. If supplied, it must be a valid UUID and must not conflict with an existing item.

        ### Token-derived fields
        The backend populates these fields using the authenticated user’s token:
        - `ownerUserId` (from token sub)
        - `department` (organization name)
        - `uploadedBy` (organization name)
        - `organizationId` (if present in token and not already provided)

        ### Default and conditional behavior
        - **publishStatus**
          - Set to `ACTIVE` by default if the provider has `org_admin` or `cos_admin` role.
          - Otherwise, set to `PENDING`.
        - **dataUploadStatus**
          - Defaults to `false`.
          - Automatically set to `true` if the item metadata contains a non-empty `mediaURL`.

        > `publishStatus` and `dataUploadStatus` **cannot be updated** via POST or PUT `/item`.
        > They must be updated using the `/organisation/asset` PATCH API.

        ### Visibility rules
        An item becomes visible across the platform **only when both**
        `publishStatus = ACTIVE` **and** `dataUploadStatus = true`.
      operationId: create item
      security:
        - authorization: [ ]

      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/exampleEntityAIModel'
                - $ref: '#/components/schemas/exampleEntityDataBank'
                - $ref: '#/components/schemas/exampleEntityPotentialApps'
      responses:
        '200':
          description: Successfully inserted
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/successResponseForCreateAIModelEntity'
                  - $ref: '#/components/schemas/successResponseForCreateDataBankResourceEntity'
                  - $ref: '#/components/schemas/successResponseForCreatePotentialAppsEntity'

        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/invalidIdErrorResponse'
              example:
                type: "dx:controlPlane:badRequest"
                title: "Bad Request"
                detail: "Missing or malformed request"
        '401':
          description: Missing or invalid authentication token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                MissingToken:
                  summary: Missing Bearer token
                  value:
                    type: "dx:controlPlane:notAuthorized"
                    title: "Not Authorized"
                    detail: "Missing Bearer token"
                InvalidToken:
                  summary: Invalid token format
                  value:
                    type: "dx:controlPlane:notAuthorized"
                    title: "Not Authorized"
                    detail: "Invalid token format"
        '403':
          description: Document doesn't exist to update it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/updateItemNotFound'
              examples:
                updateItemNotFound:
                  value:
                    "type": "dx:controlPlane:forbidden"
                    "title": "Forbidden"
                    "detail": "User does not have sufficient role for item type: AI_MODEL"
      x-codeSamples:
        - lang: cURL
          label: create item cURL
          source: |
            curl --location --request POST 'https://${HOSTNAME}/iudx/v2/cat/item/' \
            --header 'Authorization: Bearer <keycloak_token>' \
            --header 'Content-Type: application/json' \
            --data-raw '<payload>'

    put:
      tags:
        - CAT Entity
      description: |
        Update an existing catalogue item. The request body must contain a fully valid item
        payload including the `id`.

        ### Update constraints
        - Relationship and identity fields **cannot be modified**.
        - `itemStatus` is managed by the backend and cannot be updated by clients.
        - `publishStatus` and `dataUploadStatus` cannot be updated via this API.

        To change `publishStatus` or `dataUploadStatus`, use the `/organisation/asset` PATCH API.

        #### Non-updateable fields
        If updates to any of the following fields are required, the item must be deleted and
        re-created.

        1. adex:DataBank
           - id
           - type (1st element in array non-modifiable)
           - itemStatus
           - itemCreatedAt
           - publishStatus
           - dataUploadStatus

        2. adex:AiModel
           - id
           - type (1st element in array non-modifiable)
           - itemStatus
           - itemCreatedAt
           - publishStatus
           - dataUploadStatus

        3. adex:Apps
           - id
           - type (1st element in array non-modifiable)
           - itemStatus
           - itemCreatedAt
           - publishStatus
           - dataUploadStatus
      operationId: update item
      security:
        - authorization: [ ]

      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/exampleEntityAIModel'
                - $ref: '#/components/schemas/exampleEntityDataBank'
                - $ref: '#/components/schemas/exampleEntityPotentialApps'
      responses:
        '200':
          description: Successfully inserted
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/successResponseForUpdateAIModelEntity'
                  - $ref: '#/components/schemas/successResponseForUpdateDataBankEntity'
                  - $ref: '#/components/schemas/successResponseForUpdateAdexAppsEntity'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/invalidIdErrorResponse'
              example:
                type: "dx:controlPlane:badRequest"
                title: "Bad Request"
                detail: "Missing or malformed request"
        '401':
          description: Missing or invalid authentication token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                MissingToken:
                  summary: Missing Bearer token
                  value:
                    type: "dx:controlPlane:notAuthorized"
                    title: "Not Authorized"
                    detail: "Missing Bearer token"
                InvalidToken:
                  summary: Invalid token format
                  value:
                    type: "dx:controlPlane:notAuthorized"
                    title: "Not Authorized"
                    detail: "Invalid token format"
        '403':
          description: Document doesn't exist to update it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/updateItemNotFound'
              examples:
                updateItemNotFound:
                  value:
                    "type": "dx:controlPlane:forbidden"
                    "title": "Forbidden"
                    "detail": "User does not have sufficient role for item type: DATA_BANK"
        '404':
          description: Document doesn't exist to update it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/updateItemNotFound'
              examples:
                updateItemNotFound:
                  value:
                    "type": "dx:controlPlane:badRequest"
                    "title": "Bad Request"
                    "detail": "Item not found for update"

      x-codeSamples:
