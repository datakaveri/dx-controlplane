      description: |
        Approves or rejects a specific platform provider role request identified by `id`.
        Only COS Admins can perform this action.
        - Setting status to `granted` assigns the `PROVIDER` role to the user in Keycloak and
          sends an approval notification email to the user.
        - Setting status to `rejected` sends a rejection notification email to the user.
        Only requests in `pending` status can be updated.
