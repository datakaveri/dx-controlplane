      properties:
        type:
          type: string
        title:
          type: string
        detail:
          type: string
        instance:
          type: string
    AclServer:
      type: object
      required:
        - id
        - name
        - url
        - owner_id
        - visibility
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: DX ACL APD Server
        url:
          type: string
          example: acl-apd.iudx.io
        owner_id:
          type: string
          format: uuid
        visibility:
          type: string
          enum:
            - PUBLIC
            - PRIVATE
          example: PUBLIC
        status:
          type: string
          enum:
            - PENDING
            - ACTIVE
            - INACTIVE
          example: ACTIVE
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AclServerCreateRequest:
      type: object
      required:
        - name
        - url
        - visibility
      properties:
        name:
          type: string
          example: DX ACL APD Server
        url:
          type: string
          example: acl-apd.iudx.io
        visibility:
          type: string
          enum:
            - PUBLIC
            - PRIVATE
          example: PUBLIC
    AclServerResponse:
      type: object
      required:
        - type
        - title
        - result
      properties:
        type:
          type: string
          example: dx:controlPlane:success
        title:
          type: string
          example: Success
        result:
          $ref: '#/components/schemas/AclServer'
    ConversationMessage:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: c0ca7a6c-597f-4e03-b861-bb912b3cb1ec
        request_type:
          type: string
          description: Type of request this conversation belongs to (e.g. join_orgs, create_orgs, credit_request)
          example: join_orgs
        request_type_id:
          type: string
          format: uuid
          description: UUID of the specific request instance this conversation thread is attached to
          example: 7a1b2c3d-4e5f-6789-abcd-ef0123456789
        parent_msg_id:
          type: string
          format: uuid
          nullable: true
          description: UUID of the parent message for replies; null for root-level messages
          example: null
        sender_id:
          type: string
          format: uuid
          example: 1dc28cc6-d614-461a-9b8f-d6110feb3e2f
        sender_role:
          type: string
          enum:
            - requester
            - approver
          example: requester
        message_type:
          type: string
          enum:
            - text
            - question
            - answer
            - info_request
            - note
            - system
          example: question
        content:
          type: string
          example: Do I need to add my phone number?
        is_internal:
          type: boolean
          description: If true, the message is visible only to approvers; if false, visible to all participants
          example: false
        metadata:
          type: object
          nullable: true
          description: Optional arbitrary JSON metadata attached to the message
        reply_count:
          type: integer
          description: Number of direct child replies to this message
          example: 4
        hasReplies:
          type: boolean
          description: True if reply_count > 0
          example: true
        created_at:
          type: string
          format: date-time
          example: '2026-05-07T08:00:00Z'
    ThreadedReplies:
      type: object
      properties:
        result:
          type: array
          items:
            $ref: '#/components/schemas/ConversationMessage'
        paginationInfo:
          type: object
          properties:
            page:
              type: integer
              example: 1
            size:
              type: integer
              example: 3
            totalCount:
              type: integer
              description: Total direct replies for this message
              example: 4
            totalPages:
              type: integer
              example: 2
            hasNext:
              type: boolean
              description: true if there are more replies beyond the current page
              example: true
            hasPrevious:
              type: boolean
              example: false
    ThreadedMessage:
      allOf:
        - $ref: '#/components/schemas/ConversationMessage'
        - type: object
          properties:
            replies:
              $ref: '#/components/schemas/ThreadedReplies'
    OrgCreateRequestItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the creation request
        requestedBy:
          type: string
          format: uuid
          description: UUID of the user who submitted the request
        name:
          type: string
          description: Name of the organisation
        logoPath:
          type: string
          nullable: true
          description: Path or URL to the organisation logo
        entityType:
          type: string
          description: Type of entity (e.g. private, government, academic)
        orgSector:
          type: string
          description: Sector the organisation operates in
        websiteLink:
          type: string
          description: Official website URL
        address:
          type: string
          description: Registered address
        certificatePath:
          type: string
          description: Path to the registration certificate
        pancardPath:
          type: string
          description: Path to the PAN card document
        relevantDocPath:
          type: string
          nullable: true
          description: Path to any other relevant document
        status:
          type: string
          enum:
            - pending
            - granted
            - rejected
          description: Current status of the request
        userName:
          type: string
          description: Display name of the requesting user (from Keycloak)
        empId:
          type: string
          description: Employee ID of the applicant
        jobTitle:
          type: string
          description: Job title of the applicant
        orgManagerphoneNo:
          type: string
          nullable: true
          description: Contact phone number of the org manager
        managerEmail:
          type: string
          description: Official email of the organisation manager
        orgDocuments:
          type: string
          description: Path to supporting organisation documents
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the request was created
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the request was last updated
    OrgJoinRequestItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the join request
        organizationId:
          type: string
          format: uuid
          description: UUID of the organisation being joined
        userId:
          type: string
          format: uuid
          description: UUID of the user who submitted the request
        userName:
          type: string
          description: Display name of the requesting user
        status:
          type: string
          enum:
            - pending
            - granted
            - rejected
            - withdrawn
          description: Current status of the join request
        jobTitle:
          type: string
          description: Job title of the applicant within the organisation
        empId:
          type: string
          description: Employee ID of the applicant
        officialEmail:
          type: string
          description: Official email of the applicant within the organisation
        requestedAt:
          type: string
          format: date-time
          description: Timestamp when the request was submitted
        processedAt:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when the request was processed, or null if pending
