openapi: 3.0.2
info:
  title: Dx- Control Plane - Catalogue - Authentication , Authorization and Accounting (AAA) Server
  version: 1.1.0
  description: "\n# About DX AAA\n\n
     Dx Control Plane **Auth Server (AAA)**  is a core component of the Dx Control Plane responsible for validating \
    JWT tokens and enforcing **Role-Based Access Control (RBAC)** on incoming API requests. The **Keycloak Server** acts \
    as the **Identity Provider (IdP)** and issues signed JWT tokens upon successful user login or registration. The AAA \
    validates the token by verifying its signature, expiration, and integrity, and extracts user roles from the token claims.\
    \n\
    This enables secure access to platform services such as organization management, credit management, compute APIs, \
    and KYC check APIs. Users can be assigned roles such as `compute`, `publisher`, `org_admin`, and `cos_admin`, \
    which determine the API operations they are authorized to perform.\
    \n\
    The Auth Server ensures that only authorized users can perform actions according to their role, by matching \
    the required role for each API with the roles present in the user's JWT. Additionally, audit logging tracks \
    authentication and authorization events for security and troubleshooting purposes.
    \n\n# About DX Catalogue\n The DX Catalogue is a core component of the Dx Control Plane responsible for \
    \ dataset discovery portal and metadata store.It enables *Providers* of datasources to describe them with DX
    \ based annotations to make discovery and consumption of data both automatable and semantically describable.\
    \ For search and discovery, it allows users to search through text and geo-based queries. \
    \ The catalogue is a [JSON-LD](https://json-ld.org/) document stored and based on the \
    \ [RDF](https://www.w3.org/RDF/) information exchange model. \
    \n#  Configurations\n- **Server**: \n  - In the\
    \ doc, we display the server url to be https://${HOSTNAME} with the hostname\
    \ as ${HOSTNAME}\n  - This could be configured according to the deployment\n\
    - **Base path**:\n     - Base path is the path on which API is served, relative\
    \ to the host\n     - It is the initial part of the API\n     - These base path\
    \ values could be configured according to the deployment\n     - The base path\
    \ for [DX AAA Server](https://github.com/datakaveri/iudx-aaa-server) is set to\
    \ `/iudx/v2/auth`\n     - The base path for [DX Catalogue Server](https://github.com/datakaveri/iudx-catalogue-server)\
    \ is set to `/iudx/v2/cat`\n - **Request Samples**:\n  - The `<tokenValue>`\
    \ in the header of request sample could be replaced with respective token value\
    \ [Also refer Tokens section [here](#section/Tokens)]\n  - The `<payload>` in\
    \ the request sample could be replaced with the payload given adjacent to the\
    \ request sample    \n\n# API HTTP Responses\n Apart from the\
    \ response codes specified in each API, the API server may respond with certain\
    \ 4xx and 5xx error codes which are related to common API Gateway behaviours.\n\
    \ The application should address them accordingly.\n\n
    \  "
  contact:
    name: For support contact CDPG Team at
    email: ${SUPPORT_EMAIL}
    url: https://dataforpublicgood.org.in/
  license:
    name: Apache 2.0
servers:
  - url: 'https://${HOSTNAME}'
    description: dynamic server url

paths:
  /iudx/v2/resource_servers:
    get:
      summary: List Resource Servers
      operationId: list resource servers
      tags:
        - Resource Servers
      security:
        - authorization: [ ]
      description: |
        Retrieves a list of resource servers.

        **Access Control**
        - Accessible only to users with `cos_admin` or `org_admin` roles.

        **Role-based behavior**
        - `cos_admin`: Returns all resource servers available in the system.
        - `org_admin`: Returns only the resource servers created by the requesting organization administrator.
      responses:
        '200':
          description: Resource servers retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - type
                  - title
                  - result
                properties:
                  type:
                    type: string
                    example: dx:controlPlane:success
                  title:
                    type: string
                    example: Success
                  result:
                    type: array
                    items:
                      $ref: '#/components/schemas/ResourceServer'
              example:
                type: dx:controlPlane:success
                title: Success
                result:
                  - id: 2ef0f344-dc41-4369-a50b-1515a0db5db2
                    name: GATEWAY-TESTING
                    url: gateway.forestdx.iudx.io
                    type: gateway
                    owner_id: 1dc28cc6-d614-461a-9b8f-d6110feb3e2f
                    visibility: PUBLIC
                    status: ACTIVE
                    query_type: [ SPATIAL, ATTR ]
                    injection_type: api
                    created_at: "2025-09-29T08:38:27.149785"
                    updated_at: "2025-09-29T08:38:27.149785"
        '401':
          description: Unauthorized - Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingToken:
                  value:
                    type: dx:controlPlane:notAuthorized
                    title: Not Authorized
                    detail: Missing Bearer token
                invalidToken:
                  value:
                    type: dx:controlPlane:notAuthorized
                    title: Not Authorized
                    detail: Invalid token format
        '403':
          description: Forbidden - Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                type: dx:controlPlane:forbidden
                title: Forbidden
                detail: User does not have the required role.
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-codeSamples:
        - lang: cURL
          label: List Resource Servers
          source: |
            curl --location \
            'https://${HOSTNAME}/iudx/v2/resource_servers' \
            --header 'Authorization: Bearer <YOUR_ACCESS_TOKEN>'
    post:
      summary: Create a Resource Server
      operationId: create resource server
      tags:
        - Resource Servers
      security:
        - authorization: [ ]
      description: |
        Creates a new resource server configuration.

        **Access Control**
        - Accessible only to users with `cos_admin` or `org_admin` roles.

        **Notes**
        - The created resource server will initially be in `PENDING` status.
        - Ownership is automatically assigned to the requesting user’s organization.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceServerCreateRequest'
            example:
              name: FILE
              url: datakaveri.org
              type: file testing
              visibility: PUBLIC
              query_type:
                - ATTR
              injection_type: api
      responses:
        '201':
          description: Resource Server created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceServerResponse'
              example:
                type: dx:controlPlane:success
                title: Success
                result:
                  id: cabd5e4d-a426-4472-8d5d-80f8ac55cead
                  name: FILE
                  url: datakaveri.org
                  type: file testing
                  owner_id: 64cb5154-6f8c-40ff-891f-baee2aac8b85
                  visibility: PUBLIC
                  status: PENDING
                  query_type:
                    - ATTR
                  injection_type: api
                  created_at: "2025-12-16T07:00:14.225681"
                  updated_at: "2025-12-16T07:00:14.225681"
        '403':
          description: Forbidden - User does not have the required role
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    example: dx:controlPlane:forbidden
                  title:
                    type: string
                    example: Forbidden
                  detail:
                    type: string
                    example: User does not have the required role.
      x-codeSamples:
        - lang: cURL
          label: Create Resource Server
          source: |
            curl --location --request POST 'https://${HOSTNAME}/iudx/v2/resource_servers' \
            --header 'Authorization: Bearer <YOUR_ACCESS_TOKEN>' \
            --header 'Content-Type: application/json' \
            --data '{
              "name": "FILE",
              "url": "datakaveri.org",
              "type": "file testing",
              "visibility": "PUBLIC",
              "query_type": ["ATTR"],
              "injection_type": "api"
            }'
  /iudx/v2/resource_servers/{id}:
    get:
      summary: Get Resource Server by ID
      operationId: get resource server
      security:
        - authorization: [ ]
      description: |
        Retrieves the details of a specific resource server using its unique identifier.

        **Access Control**
        - Accessible only to users with `cos_admin` or `org_admin` roles.

        **Role-based behavior**
        - `cos_admin`: Can fetch details of any resource server.
        - `org_admin`: Can fetch details only for resource servers they own.
      tags:
        - Resource Servers
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceServer'
              example:
                type: dx:controlPlane:success
                title: Success
                result:
                  id: 7e9f1f76-baa1-4230-817f-f61ef3c0c411
                  name: FILE
                  url: datakaveri.org
                  type: file testing
                  owner_id: 64cb5154-6f8c-40ff-891f-baee2aac8b85
                  visibility: PUBLIC
                  status: PENDING
                  query_type:
                    - ATTR
                  injection_type: api
                  created_at: "2025-12-16T07:14:25.034849"
                  updated_at: "2025-12-16T07:14:25.034849"
        '403':
          description: Forbidden - User does not have the required role
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    example: dx:controlPlane:forbidden
                  title:
                    type: string
                    example: Forbidden
                  detail:
                    type: string
                    example: User does not have the required role.
      x-codeSamples:
        - lang: cURL
          label: Get Resource Server by ID
          source: |
            curl --location --request GET 'https://${HOSTNAME}/iudx/v2/resource_servers/7e9f1f76-baa1-4230-817f-f61ef3c0c411' \
            --header 'Authorization: Bearer <YOUR_ACCESS_TOKEN>'
    delete:
      summary: Delete Resource Server
      operationId: delete resource server
      security:
        - authorization: [ ]
      tags:
        - Resource Servers
      description: |
        Deletes an existing resource server.

        **Access Control**
        - Accessible only to users with `cos_admin` or `org_admin` roles.

        **Role-based behavior**
        - `cos_admin`: Can delete any resource server.
        - `org_admin`: Can delete only resource servers owned by their organization.

        **Note**
        - Once deleted, the resource server configuration cannot be recovered.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: No Content - Resource server deleted successfully
          content:
            application/json:
              examples:
                success:
                  summary: Resource server deleted successfully
                  value:
        '401':
          description: Unauthorized - Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingToken:
                  value:
                    type: dx:controlPlane:notAuthorized
                    title: Not Authorized
                    detail: Missing Bearer token
                invalidToken:
                  value:
                    type: dx:controlPlane:notAuthorized
                    title: Not Authorized
                    detail: Invalid token format
        '403':
          description: Forbidden - Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                type: dx:controlPlane:forbidden
                title: Forbidden
                detail: User does not have the required role.
        '404':
          description: Not Found - Resource server not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                type: dx:controlPlane:notFound
                title: Not Found
                detail: No matching requestId found in resource table
      x-codeSamples:
        - lang: cURL
          label: Delete Resource Server
          source: |
            curl --location --request DELETE \
            'https://${HOSTNAME}/iudx/v2/resource_servers/7e9f1f76-baa1-4230-817f-f61ef3c0c411' \
            --header 'Authorization: Bearer <YOUR_ACCESS_TOKEN>'
