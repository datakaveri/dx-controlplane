  /iudx/v2/auth/user/update:
    post:
      summary: (User) Activate/Deactivate Own Account
      tags:
        - Role APIs
      operationId: post-auth-v2-user-update
      description: |
        Allows the currently authenticated user to activate or deactivate their own Keycloak account.

        Valid values for `status`: `activate`, `deactivate`

        On deactivate: disables Keycloak account, updates DB, sends deactivation email.
        On activate: enables Keycloak account, updates DB, sends activation email.

        **Log Type:** `USER_ACTION`
      x-codeSamples:
        - lang: cURL
          label: Deactivate own account
          source: |
            curl --location --request POST 'https://${HOSTNAME}/iudx/v2/auth/user/update' \
            --header 'Authorization: Bearer <your-token>' \
            --header 'Content-Type: application/json' \
            --data '{"status": "deactivate"}'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum:
                    - activate
                    - deactivate
                  example: deactivate
      responses:
        '200':
          description: Account status updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  result:
                    type: string
              examples:
                Deactivated:
                  value:
                    type: urn:dx:ControlPlane:success
                    title: Success
                    result: User deactivated successfully
                Activated:
                  value:
                    type: urn:dx:ControlPlane:success
                    title: Success
                    result: User activated successfully
        '400':
          description: Bad Request - Invalid status value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '401':
          description: Unauthorized - Token missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '403':
          description: Forbidden - Insufficient scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Forbidden'
      security:
        - authorization: []
  /iudx/v2/auth/admin/{id}/update:
    post:
      summary: (Admin) Activate/Deactivate User Account by ID
      tags:
        - Role APIs
      operationId: post-auth-v2-admin-id-update
      description: |
        Allows a COS admin to activate or deactivate any user's Keycloak account by their UUID.

        Valid values for `status`: `activate`, `deactivate`

