      description: |
        Retrieve organisation assets using advanced discovery filters.

        This endpoint allows organisation administrators to perform filtered searches
        over all assets owned by their organisation, including unpublished items.
        It supports property-based, temporal, numeric range, and full-text search
        filters.

        This operation is restricted to users with the `org_admin` role and is not part
        of public catalogue discovery.

        Optionally, set `filter_myassets=true` to exclude assets owned by the
        authenticated user from the results.
      operationId: get org assets with filters
      tags:
        - Organisation Assets Management
      security:
        - authorization: []
      parameters:
        - name: page
          in: query
          description: Page number for pagination
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: size
          in: query
          description: Page size for pagination
          required: false
          schema:
            type: integer
            minimum: 1
            default: 100
        - name: sort
          in: query
          description: |
            This parameter allows sorting the results by up to 3 fields, separated by a semicolon (;). The format for each field is `fieldName:asc` or `fieldName:desc`. For example: `itemCreatedAt:desc;dataReadiness:asc;name:desc` will sort by creation date (descending), then dataReadiness (ascending), then name (descending).
          required: false
          schema:
            type: string
        - name: filter_myassets
          in: query
          description: |
