              schema:
                $ref: '#/components/schemas/Unauthorized'
        '403':
          description: Forbidden – User not allowed to update this asset request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/createNotificationForbidden'
        '404':
          description: Not Found – Asset request not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/createNotificationResourceNotFoundResponse'
        '409':
          description: Conflict – Invalid state transition or already in target state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/createNotificationConflictResponse'
      security:
        - authorization: [ ]



components:
  securitySchemes:
    authorization:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak issued Bearer token
  parameters:
    PageParam:
      name: page
      in: query
      description: Page number for pagination
      required: false
      schema:
        type: integer
        default: 1
        minimum: 1
    SizeParam:
      name: size
      in: query
      description: Page size for pagination
      required: false
      schema:
        type: integer
        default: 1000
        minimum: 1
    SizeParamReport:
      name: size
      in: query
      description: Page size for pagination , used as limit for query request
      required: false
      schema:
        type: integer
        default: 1000
        minimum: 1
    SortingParam:
      name: sort
      in: query
      description: 'This parameter allows sorting the results by up to 3 fields, separated
        by a semicolon (`;`). The format for each field is `fieldName:asc` or `fieldName:desc`.
        For example: `createdAt:desc;assetType:asc;userId:desc` will sort by creation
        date (descending), then asset type (ascending), then user ID (descending).'
      required: false
      schema:
        type: string
    TimeParam:
      name: time
      in: query
      description: This parameter specifies the <b>start time</b> for the temporal-query
        in `ISO8601` format.
      schema:
        type: string
    EndTimeParam:
      name: endtime
      in: query
      description: This parameter specifies the <b>endtime</b> for the temporal-query
        in `ISO8601` format.
      schema:
        type: string
    TimeRelParam:
      name: timerel
      in: query
      description: 'The temporal relation type to be applied for the time filter.
        Must be one of: <b>between</b>, <b>before</b>, or <b>after</b>. <b>between</b>
        must be used with both `time` and `endtime`. <b>before</b> or <b>after</b>
        must be used with only `time`.

        '
      required: false
      schema:
        type: string
        enum:
          - between
          - before
          - after
  schemas:
    AssetRequest:
      type: object
      properties:
        requestId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - GRANTED
            - PENDING
            - REJECTED
        type:
          type: string
          enum:
            - SFTP
            - API
        additionalInfo:
          type: object
          properties:
            name:
              type: string
            email:
              type: string
              format: email
            phone:
              type: string
            purpose:
              type: string
            description:
              type: string
        updatedAt:
          type: string
          format: date-time
        requestedAt:
          type: string
          format: date-time
      required:
        - requestId
        - status
        - type
        - additionalInfo
        - user
        - updatedAt
        - requestedAt
