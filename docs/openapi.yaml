    ComplexSearchRequest:
      type: object
      additionalProperties: false
      properties:
        q:
          type: string
          description: The search query string.
        fuzzy:
          type: boolean
          description: Enables fuzzy matching.
        autoComplete:
          type: boolean
          description: Enables autocomplete suggestions.
        searchCriteria:
          type: array
          items:
            $ref: '#/components/schemas/SearchCriteria'
          description: List of property-based search criteria.
        filter:
          type: array
          items:
            type: string
          description: List of properties to include in the response (e.g., id, label, name, description, tags).
      required:
        - q
        - searchCriteria
    SearchCriteria:
      type: object
      additionalProperties: false
      required:
        - field
        - searchType
        - values
      properties:
        field:
          type: string
          description: Name of the property to filter.
        searchType:
          type: string
          enum:
            - term
            - flattenedTerm
            - betweenTemporal
            - beforeTemporal
            - afterTemporal
            - betweenRange
            - beforeRange
            - afterRange
          description: |
            Type of search to apply. Valid types:
            - `term`: Exact match on keyword/text fields. Typically used for top-level fields like `tags`, `fileFormat`, or other catalog properties.
            - `flattenedTerm`: Exact match on fields stored as `flattened` type in
                           Elasticsearch mappings. Use this for matching inside JSON-like fields
                           such as `resourceServer.url` or `resourceServer.name`, where the
                           property is indexed as a keyword without `.keyword` suffix.
            - betweenTemporal: ISO datetime range
            - beforeTemporal: Before datetime
            - afterTemporal: After datetime
            - betweenRange: Numeric range
            - beforeRange: Less than value
            - afterRange: Greater than value
        values:
          type: array
          items:
            oneOf:
              - type: string
              - type: number
          description: |
            Values for the selected `searchType`. Required value format:
            - `term`: One or more strings
            - `flattenedTerm`: One or more strings (matching exact values in flattened fields)
            - `betweenTemporal`: Two ISO date-time strings
            - `beforeTemporal` / `afterTemporal`: One ISO date-time string
            - `betweenRange`: Two numbers
            - `beforeRange` / `afterRange`: One number
    SearchResponse:
      type: object
      properties:
        type:
          type: string
          example: dx:controlPlane:success
        title:
          type: string
          example: Success
        result:
          type: array
          items:
            type: object
            description: Search result item.
      required:
        - type
