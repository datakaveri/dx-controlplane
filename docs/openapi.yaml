  /iudx/v2/auth/user:
    get:
      summary: (User) Get User Information
      operationId: get-auth-v2-user
      tags:
        - Role APIs
      description: |
        Retrieves the full profile and account details of the currently authenticated user from Keycloak and the platform.

        The response includes:
        - **Identity**: `sub` (UUID), `name`, `givenName`, `familyName`, `preferredUsername`, `email`
        - **Roles**: Active Keycloak realm roles and `pending_roles` (roles awaiting approval: `provider`, `compute`)
        - **Organisation**: Most recent pending organisation request (`organisation_join` or `organisation_create`), identified by `request_type`
        - **Social accounts**: `twitter_account`, `linkedin_account`, `github_account`
        - **KYC**: `kycVerified` flag and `kycInformation` object
        - **Delegation**: `delegation_scope`, `delegateeId`, `appId` when acting as a delegatee
        - **Account status**: `emailVerified`, `account_enabled`, `createdAt`

        **Log Type:** `USER_ACTION`
      x-codeSamples:
        - lang: cURL
          label: Get authenticated user info
          source: |
            curl --location 'https://${HOSTNAME}/iudx/v2/auth/user' \
            --header 'Authorization: Bearer <your-token>'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  result:
                    type: object
                    properties:
                      roles:
                        type: array
                        description: Keycloak realm roles assigned to the user
                        items:
                          type: string
                      organisationId:
                        type: string
                        description: UUID of the organisation the user belongs to
                      organisationName:
                        type: string
                      sub:
                        type: string
                        description: UUID of the authenticated user (Keycloak subject)
                      emailVerified:
                        type: boolean
                      kycVerified:
                        type: boolean
                      name:
                        type: string
                        description: Full name (givenName + familyName)
                      preferredUsername:
                        type: string
                      givenName:
                        type: string
                      familyName:
                        type: string
                      email:
                        type: string
                      pending_roles:
                        type: array
                        description: Roles with a pending approval request
                        items:
                          type: string
                          enum:
                            - provider
                            - compute
                      organisation:
                        type: object
                        description: |
                          Most recent pending organisation request. Shape varies by `request_type`: `organisation_join` or `organisation_create`.
                        properties:
                          id:
                            type: string
                            description: UUID of the request record
                          request_type:
                            type: string
                            enum:
                              - organisation_join
                              - organisation_create
                          status:
                            type: string
                          jobTitle:
                            type: string
                          empId:
                            type: string
                          userName:
                            type: string
                          requestedAt:
                            type: string
                          processedAt:
                            type: string
                          organisationId:
                            type: string
                            description: Present when request_type is organisation_join
                          userId:
                            type: string
                            description: Present when request_type is organisation_join
                          officialEmail:
                            type: string
                            description: Present when request_type is organisation_join
                          requestedBy:
                            type: string
                            description: Present when request_type is organisation_create
                          name:
                            type: string
                            description: Organisation name; present when request_type is organisation_create
                          logoPath:
                            type: string
                          entityType:
                            type: string
                          orgSector:
                            type: string
                          websiteLink:
                            type: string
                          address:
                            type: string
                          certificatePath:
                            type: string
                          pancardPath:
                            type: string
                          relevantDocPath:
                            type: string
                          orgManagerphoneNo:
                            type: string
                          orgDocuments:
                            type: object
                          managerEmail:
                            type: string
                          createdAt:
                            type: string
                          updatedAt:
                            type: string
                      kycInformation:
                        type: object
                        description: KYC details submitted by the user
                      createdAt:
                        type: string
                        description: Account creation timestamp (ISO 8601)
                      twitter_account:
                        type: string
                      linkedin_account:
                        type: string
                      github_account:
                        type: string
                      account_enabled:
                        type: boolean
                        description: Whether the Keycloak account is active
                      did:
                        type: string
                        description: Decentralised identifier
                      aud:
                        type: string
                        description: Token audience
                      delegation_scope:
                        type: array
                        description: Scopes granted via delegation
                        items:
