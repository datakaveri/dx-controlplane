  /iudx/v2/cat/organisation/asset:
    get:
      tags:
        - Organisation Assets Management
      description: |
        Retrieve all assets belonging to the organisation of the authenticated user.
        By default, all organisation-owned assets are returned.
        Optionally, set `filter_myassets=true` to exclude assets owned by the authenticated user.

        This endpoint is restricted to users with the `org_admin` role and returns
        organisation-owned assets regardless of their publication status.
        It supports pagination and sorting but is not part of public catalogue discovery.
      operationId: get organisation assets
      security:
        - authorization: []
      parameters:
        - name: page
          in: query
          description: Page number for pagination
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: size
          in: query
          description: Page size for pagination
          required: false
          schema:
            type: integer
            minimum: 1
            default: 100
        - name: sort
          in: query
          description: |
            This parameter allows sorting the results by up to 3 fields, separated by a semicolon (;). The format for each field is `fieldName:asc` or `fieldName:desc`. For example: `itemCreatedAt:desc;dataReadiness:asc;name:desc` will sort by creation date (descending), then dataReadiness (ascending), then name (descending).
          required: false
          schema:
            type: string
        - name: filter_myassets
          in: query
          description: |
            When set to `true`, excludes assets owned by the authenticated user from the response. Ownership is determined by comparing the asset's `ownerUserId` with the `sub` (userId) from the authentication token. Default is `false`.
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Assets belonging to an organisation | org_admin can access this endpoint
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    example: dx:controlPlane:success
                  title:
                    type: string
                    example: Success
                  result:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  paginationInfo:
                    $ref: '#/components/schemas/PaginationInfo'
              example:
                type: dx:controlPlane:success
                title: Success
                result:
                  - id: 674caec0-b39d-418b-8e23-167306751396
                    name: Subdistrict Weather Information for PM103
                    label: Subdistrict Weather Information
                    shortDescription: Daily aggregated temperature and rainfall data at subdistrict level.
                    description: Daily weather statistics at subdistrict level including temperature and rainfall metrics.
                    type:
                      - adex:DataBank
                    department: Test Org11
                    organizationId: 74e3b919-1d1b-44de-ace1-504f1887fcc1
                    organizationType: Public
                    industry: Environmental Monitoring
                    geoCoverage: Karnataka, India
                    tags:
                      - weather
                      - temperature
                      - rainfall
                      - environment
                    publishStatus: PENDING
                    itemStatus: ACTIVE
                    dataUploadStatus: false
                    uploadFrequency: Daily
                    yearRange: 2021-2024
                    license: CC-BY 4.0
                    fileFormat: xlsx
                    accessPolicy: RESTRICTED
                    ownerUserId: 2f945b8d-0cc8-4c5d-9a3e-53fa88e6e9b2
                    itemCreatedAt: 2025-12-12T01:31:54+0530
                    lastUpdated: 12 December, 2025 - 01:31 PM
                    resourceServer:
                      - name: NGSI-LD
                        type: ngsi-ld
                        datasetType: DATASET
                        url: v2.dev.rs.iudx.io
                        accessTypes:
                          - api
                        queryTypes:
                          - ATTR
                paginationInfo:
                  page: 1
                  size: 1
                  totalCount: 77
                  totalPages: 77
                  hasNext: true
                  hasPrevious: false
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                type: dx:controlPlane:badRequest
                title: Bad Request
                detail: 'Invalid sort format: itemCreatedAt-desc. Expected field:order'
        '401':
          description: Missing or invalid authentication token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                type: dx:controlPlane:notAuthorized
                title: Not Authorized
                detail: Missing Bearer token
        '403':
          description: Forbidden - User does not have the org_admin role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponse'
      x-codeSamples:
