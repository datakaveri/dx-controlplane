          type: string
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: array
          items:
            type: string
        label:
          type: string
          maxLength: 512
        shortDescription:
          type: string
          maxLength: 3200
        description:
          type: string
          maxLength: 12000
