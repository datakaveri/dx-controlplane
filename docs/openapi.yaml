        - lang: cURL
          label: Grant provider role directly
          source: |
            curl --location --request POST 'https://${HOSTNAME}/iudx/v2/auth/organization/user/provider' \
            --header 'Authorization: Bearer <your-token>' \
            --header 'Content-Type: application/json' \
            --data '{"user_id": "c908f4ed-69ef-4d27-8e50-8f95f89b6c4d", "organization_id": "3fa85f64-5717-4562-b3fc-2c963f66afa6"}'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - user_id
                - organization_id
              properties:
                user_id:
                  type: string
                  format: uuid
                  description: UUID of the user to grant provider role to.
                organization_id:
                  type: string
                  format: uuid
                  description: UUID of the organisation.
                provider_type:
                  type: string
                  enum:
                    - org
                    - platform
                  default: org
                  description: Type of provider role. Defaults to `org`.
      responses:
        '200':
          description: Provider role granted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  detail:
                    type: string
                    example: Provider role granted successfully
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '403':
          description: Forbidden - User not in org or caller lacks permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Forbidden'
        '404':
          description: Not Found - User not found or no pending provider role request
