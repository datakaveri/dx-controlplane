              example:
                type: dx:controlPlane:success
                title: Success
                result:
                  id: cabd5e4d-a426-4472-8d5d-80f8ac55cead
                  name: DX ACL APD Server
                  url: acl-apd.iudx.io
                  owner_id: 64cb5154-6f8c-40ff-891f-baee2aac8b85
                  visibility: PUBLIC
                  status: PENDING
                  created_at: '2025-12-16T07:00:14.225681'
                  updated_at: '2025-12-16T07:00:14.225681'
        '401':
          description: Unauthorized - Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - User does not have the required role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                type: dx:controlPlane:forbidden
                title: Forbidden
                detail: User does not have the required role.
        '409':
          description: Conflict - ACL server already exists
          content:
            application/json:
              schema:
