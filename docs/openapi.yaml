      security:
        - authorization: []
  /iudx/v2/auth/user/delete:
    delete:
      summary: (User) Delete Own Account
      tags:
        - Role APIs
      operationId: delete-auth-v2-user
      description: |
        Permanently deletes the currently authenticated user's account from Keycloak and the platform DB.

        The operation:
        - Validates the user is not an org admin or platform admin (blocked)
        - If user belongs to an org: removes provider role, org join requests, compute requests
        - Deletes user from Keycloak and cleans up all associated DB records

        **Log Type:** `USER_ACTION`
      x-codeSamples:
        - lang: cURL
          label: Delete own account
          source: |
            curl --location --request DELETE 'https://${HOSTNAME}/iudx/v2/auth/user/delete' \
            --header 'Authorization: Bearer <your-token>'
      responses:
        '200':
          description: User account deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  result:
                    type: string
              examples:
                Success:
                  value:
                    type: urn:dx:ControlPlane:success
                    title: Success
                    result: User deleted successfully from Keycloak and DB
        '400':
          description: Bad Request - User is an org admin or platform admin and cannot be deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '401':
          description: Unauthorized - Token missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '403':
          description: Forbidden - Insufficient scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Forbidden'
      security:
        - authorization: []
