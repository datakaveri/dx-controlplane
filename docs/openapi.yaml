            properties:
              title:
                type: string
              content:
                type: string
              points:
                type: array
                items:
                  type: string
              subsections:
                type: array
                items:
                  type: object
                  anyOf:
                    - required: [ "subtitle", "points" ]
                    - required: [ "subtitle", "content" ]
                  properties:
                    subtitle:
                      type: string
                    content:
                      type: string
                    points:
                      type: array
                      items:
                        type: string
