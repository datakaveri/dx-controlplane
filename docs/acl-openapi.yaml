  /iudx/acl/apd/v2/policy:
    post:
      tags:
        - Policies
      summary: Create Policy
      description: |-

        The `Create Policy` API allows a `provider` or an authorized `delegate`
        to create an **ACTIVE access policy** for a resource owned by the provider.

        When a policy is successfully created:

        - A new policy record is created with status = `ACTIVE`
        - A corresponding access rule is created and linked to the policy
        - The rule inherits the same lifecycle as the policy

        ## Policy Lifecycle

        - On creation → Policy status = `ACTIVE`
        - On deletion → Policy status = `DELETED`
        - On expiry → Policy remains `ACTIVE`, but is treated as invalid during verification

        ### Expiry Handling

        Policy expiry does not modify the stored status.

        Instead, during policy verification:
        - The system checks whether `expiryAt` is greater than the current timestamp.
        - If expired, the policy is treated as inactive for access evaluation.
        - The database status remains unchanged.

        ### Rule Synchronization

        When a policy is marked as `DELETED`, all associated access rules are also marked as 
        `DELETED`.

        ## Item Types

        - `DATABANK`: Policy applies to individual resources.
        - `AIMODEL`: Policy applies to resource groups.

        ## Important Notes

        - Only one policy can be created per request.
        - Only one ACTIVE policy can exist per (user, itemId).
        - If a valid ACTIVE policy already exists, a `409 Conflict` is returned.
      operationId: post-auth-v1-policies
      parameters:
        - name: Authorization
          in: header
          description: DX Auth issued identity token
          required: true
          schema:
            type: string
            minLength: 1
            pattern: Bearer [a-zA-Z0-9_*\-*\.\/]+$|^[a-zA-Z0-9_*\-*\.\/]+$
      requestBody:
        description: |
          **Request Body Details:**

            The request body should be a JSON object containing a JSON array of request.

            ### User Policy Request:

            - `userEmail`: The email ID of the user for whom the policy is being defined.
            - `itemId`: The UUID value of the item for which the policy is being established.
            - `itemType`: An enum value representing the type of the item.
            - `expiryTime`: An optional field, representing the policy's expiry time in ISO8601 format compatible with UTC (yyyy-MM-dd'T'HH:mm:ss). If not provided, a default expiry time is set for the policy.
            - `constraints`: JSON object defining subjects and access controls.
          ### Constraints Structure:
          `constraints` may contain:
          - `subjects`
            - allowedOrgIds
            - allowedUserIds
            - allowedRoles
                
          - `access` (array)
            - accessType: api | file | sub
            - expiry (epoch seconds)
            - limits (optional, varies per accessType)
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                request:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items:
                    type: object
                    additionalProperties: false
                    properties:
                      userEmail:
                        type: string
                        pattern: ^([a-zA-Z0-9_\-\.]+)@([a-zA-Z0-9_\-\.]+)\.([a-zA-Z]{2,5})$
                        minLength: 1
                      itemId:
                        type: string
                        pattern: ^[a-zA-Z0-9_*\-*\.\/]+$
                        minLength: 1
                        maxLength: 512
                      itemType:
                        enum:
                          - AIMODEL
                          - DATABANK
                        minLength: 1
                      expiryTime:
                        type: string
                        pattern: ^([\+-]?\d{4}(?!\d{2}\b))((-?)((0[1-9]|1[0-2])(\3([12]\d|0[1-9]|3[01]))?|W([0-4]\d|5[0-2])(-?[1-7])?|(00[1-9]|0[1-9]\d|[12]\d{2}|3([0-5]\d|6[1-6])))([T\s]((([01]\d|2[0-3])((:?)[0-5]\d)?|24\:?00)([\.,]\d+(?!:))?)?(\17[0-5]\d([\.,]\d+)?)?([zZ]|([\+-])([01]\d|2[0-3]):?([0-5]\d)?)?)?)?$
                        minLength: 1
                      constraints:
                        type: object
                      additionalInfo:
                        type: object
                        description: Additional information to access data for educational, research or testing, non-commercial, academia purposes
                        minProperties: 0
                        maxProperties: 10
                      providerComment:
                        type: string
                        description: Comment from the provider regarding the resource item, which can be used to provide additional information about the resource
                        minLength: 1
                        maxLength: 4000
                      feedbackToConsumer:
                        type: string
                        description: Feedback from the provider to the consumer regarding the resource item, which can be used to provide additional information about the resource
                        maxLength: 4000
                        minLength: 1
                    required:
                      - userEmail
                      - itemId
                      - itemType
                      - constraints
              required:
                - request
              x-examples:
                example-1:
                  request:
                    - userEmail: pqr@abc.com
                      itemId: example-resource-group
                      itemType: DATABANK
                      expiryTime: '2023-08-30T21:10:06'
                      constraints:
                        subjects:
                          allowedOrgIds:
                            - <uuid>
                            - <uuid>
                          allowedUserIds:
                            - <uuid>
                          allowedRoles:
                            - consumer
                        access:
                          - accessType: api
                            expiry: 1735689600
                            limits:
                              dataUsage: 100:gb
                              apiHits: 100
                          - accessType: file
                            expiry: 1735689600
                            limits:
                              dataUsage: 10:gb
                          - accessType: sub
                            expiry: 1735689600
                    - userEmail: test@demo.com
