      schema:
        type: string
    EndTimeParam:
      name: endtime
      in: query
      description: This parameter specifies the <b>endtime</b> for the temporal-query in `ISO8601` format.
      schema:
        type: string
    TimeRelParam:
      name: timerel
      in: query
      description: |
        The temporal relation type to be applied for the time filter. Must be one of: <b>between</b>, <b>before</b>, or <b>after</b>. <b>between</b> must be used with both `time` and `endtime`. <b>before</b> or <b>after</b> must be used with only `time`.
      required: false
      schema:
        type: string
        enum:
          - between
          - before
          - after
          - null
