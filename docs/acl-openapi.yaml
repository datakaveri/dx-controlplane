    get:
      tags:
        - Policies
      summary: Get Policies
      description: |
        Get all latest policies associated with a specific user. The response is determined by the user's roles:

        - If the user is a `provider`, the response includes all policies created by the provider or their delegates.
        - If the user is a `delegate`, the response comprises policies set by the delegate or set for the consumer on whose behalf the delegate is acting.
        - If the user is a `consumer`, the response includes policies set for the consumer.

        `Note`: Please note that the response displays the policies for a user concerning a specific server.
      operationId: get-auth-v1-policies
      parameters:
        - name: Authorization
          in: header
          description: DX Auth issued identity token
          required: true
          schema:
            type: string
            minLength: 1
            pattern: Bearer [a-zA-Z0-9_*\-*\.\/]+$|^[a-zA-Z0-9_*\-*\.\/]+$
      responses:
        '200':
          description: Policies have been successfully listed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/getPolicySuccessResponseWithResourceType'
          headers:
            Content-Type:
              schema:
                type: string
              description: application/json
        '401':
          description: Unauthorized - `token` invalid/expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
          headers:
            Content-Type:
              schema:
                type: string
              description: application/json
        '404':
          description: Not Found - Policy not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/policyNotFound'
          headers:
            Content-Type:
              schema:
                type: string
              description: application/json
      security:
        - authorization: []
      x-codeSamples:
        - lang: cURL
          label: get latest policies
          source: |
            curl --location --request GET 'https://${HOSTNAME}/iudx/acl/apd/v2/policy' \
            --header 'Authorization: <tokenValue>'
    put:
      tags:
        - Policies
      summary: Deactivate Policy
      description: |-

        This API performs a **soft delete** of an existing ACTIVE policy.

        Instead of permanently removing the policy from the system:

        - The policy status is updated from `ACTIVE` → `DELETE`
        - All access rules associated with the policy are also updated to `DELETE`
        - The policy record is retained for audit and traceability purposes

        ## Who Can Delete

        - The resource `provider`
        - An authorized `delegate` of the provider

        ## Preconditions

        - The policy must exist
        - The policy must belong to the requesting provider/delegate
        - The policy must currently be in `ACTIVE` state

        ## Effects

        - Access granted via this policy is immediately revoked
        - The policy cannot be reactivated via this API (a new policy must be created)

        Users can retrieve the policy ID using the GET Policies API.
      operationId: deactivate-auth-v1-policies
      parameters:
        - name: Authorization
          in: header
          description: DX Auth issued identity token
          required: true
          schema:
            type: string
            minLength: 1
            pattern: Bearer [a-zA-Z0-9_*\-*\.\/]+$|^[a-zA-Z0-9_*\-*\.\/]+$
        - name: id
          in: query
          description: ID of the DX Entity
          required: true
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-f]{8}\b-[0-9a-f]{4}\b-[0-9a-f]{4}\b-[0-9a-f]{4}\b-[0-9a-f]{12}$
      responses:
        '200':
          description: Policy deactivated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/deletePolicy'
          headers:
            Content-Type:
              schema:
                type: string
              description: application/json
        '400':
          description: |-
            Bad Request
            - Id is not a valid policyId
            - Policy has expired
            - Policy was previously deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/deletePolicyErrorResponse'
          headers:
            Content-Type:
              schema:
                type: string
              description: application/json
        '401':
          description: |-
            Unauthorized
              - `token` invalid/expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
          headers:
            Content-Type:
              schema:
                type: string
              description: application/json
        '404':
          description: |-
            Not Found
              - Policy id does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/deletePolicyNotFoundErrorResponse'
          headers:
            Content-Type:
              schema:
                type: string
              description: application/json
      security:
        - authorization: []
      x-codeSamples:
        - lang: cURL
          label: Deactivate policy
          source: |
            curl --location --request PUT \
            'https://${HOSTNAME}/iudx/acl/apd/v2/policy?id=231f6eca-6276-4993-bfeb-53cbbbba6f06' \
            --header 'Authorization: <tokenValue>'
  /iudx/acl/apd/v2/verify:
    post:
      tags:
        - Verify
      summary: Verify Policy
      description: |
        This endpoint checks if a policy exists for the specified item and owner in the APD server. It returns the policy constraints if a policy is found.

        `Note` : This endpoint is exclusive for internal use. The DX authentication server will invoke it before issuing access tokens to ensure the presence of a valid policy for the consumer and the requested resource.
      operationId: get-auth-v1-verify
      parameters:
        - in: header
          name: Authorization
          required: true
          schema:
            type: string
            minLength: 1
            example: Bearer <JWT>
      requestBody:
        description: The request body is a JSON object that contains information about the user, owner, and item.The user's ID, name, and email, as well as the owner's ID, name, and email, are provided.Additionally, information about the item, including its ID and type, is included.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/requestBodyForVerify'
            examples:
              Request body for Verify Policy:
                value:
                  user:
                    id: b58da193-23d9-43eb-b98a-a103d4b6103c
                    name:
                      firstName: demo
                      lastName: name
                    email: test_user_1@example.com
                  owner:
                    id: b2c27f3f-2524-4a84-816e-91f9ab23f837
                    name:
                      firstName: test
                      lastName: provider
                    email: test@provider.com
                  item:
                    itemId: b58da193-23d9-43eb-b98a-a103d4b6103c
                    itemType: DATABANK
      responses:
        '200':
          description: Policy verification successful
          content:
            application/json:
              example:
                type: urn:dx:apdServerPanel:success
                title: Success
                result:
                  type: urn:apd:Allow
                  constraints:
                    subjects:
                      allowedOrgIds:
                        - <uuid>
                        - <uuid>
                      allowedUserIds:
                        - <uuid>
                      allowedRoles:
                        - consumer
                    access:
                      - accessType: sub
                        expiry: 1735689600
                  expiryAt: '2026-08-04T20:00:19'
        '400':
          description: Bad Request
          content:
            application/json:
              example:
                type: urn:dx:acl:badRequest
                title: Bad Request
                detail: Bad Request
        '403':
          description: Forbidden
          content:
            application/json:
              example:
                type: urn:apd:Deny
                title: Policy does not exist
                detail: Invalid request format/Incorrect request
      security:
        - authorization: []
      x-codeSamples:
        - lang: cURL
          label: Verify policy
          source: |
            curl --location --request POST ''https://${HOSTNAME}/iudx/acl/apd/v2/verify' \
            --header 'Authorization: bearer <tokenValue>' \
            --header 'Content-Type: application/json' \
              --data-raw '<payload>'
