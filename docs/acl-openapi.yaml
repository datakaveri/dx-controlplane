  /iudx/acl/apd/v2/access_request/has_access:
    post:
      tags:
        - Access Request
      summary: Check Access Request
      description: |
        Determines the current access state of the authenticated user for a given asset.

        The API evaluates all applicable access mechanisms and returns the user's current access status.

        Access may be granted through:

        - Active policies associated with the user.
        - Asset ownership.
        - Administrative privileges (`org_admin` or `cos_admin`).

        The response may contain:

        - One or more active policies granting access to the asset.
        - Access granted through ownership or administrative privileges.
        - One or more pending access requests awaiting provider approval.
        - No access and no pending requests.

        When access is granted through policies or rules, the response includes the applicable policy details.

        When access is granted through ownership or administrative privileges, the response includes
        the corresponding access indicators (`hasOwnerAccess`, `hasAdminAccess`) and any applicable
        access metadata.

        When pending requests exist, detailed request, consumer, owner, and asset information is returned.
      operationId: post-auth-v2-access-requests-has-access
      requestBody:
        description: |
          - `itemId` : The catalogue ID of the asset for which the request has been created
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                itemId:
                  type: string
                  format: uuid
                  pattern: ^[0-9a-f]{8}\b-[0-9a-f]{4}\b-[0-9a-f]{4}\b-[0-9a-f]{4}\b-[0-9a-f]{12}$
              required:
                - itemId
              x-examples:
                example-1:
                  itemId: b34eb955-c691-4fd3-b200-f18bc78810a2
            examples:
              Create Access Request:
                value:
                  itemId: b34eb955-c691-4fd3-b200-f18bc78810a2
      responses:
        '200':
          description: User has access to the asset through one or more active policies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/checkAccessRequestSuccessResponse'
          headers:
            Content-Type:
              schema:
                type: string
              description: application/json
        '400':
          description: |-
            Bad Request
            - Schema validation, missing or incorrect fields & values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generalBadRequest'
              examples:
                Example:
                  value:
                    type: urn:dx:aclApd:badRequest
                    title: Bad Request
                    detail: Missing or malformed request
          headers:
            Content-Type:
              schema:
                type: string
              description: application/json
        '401':
          description: |-
            Unauthorized
            - `token` invalid/expired
            - A user with non-consumer role trying to use the API
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
              example:
                type: urn:dx:aclApd:notAuthorized
                title: Not Authorized
                detail: Missing or invalid Bearer token
          headers:
            Content-Type:
              schema:
                type: string
              description: application/json
        '403':
          description: |
            Forbidden

            One of the following conditions applies:

            - Access request(s) for the asset are still pending approval.
            - The consumer does not currently have access to the asset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/checkAccessRequestNotFoundResponse'
              example:
                type: urn:dx:aclApd:forbidden
                title: Forbidden
                detail: User does not have the required role.
          headers:
            Content-Type:
              schema:
                type: string
              description: application/json
      security:
        - authorization: []
      x-codeSamples:
        - lang: cURL
          label: Check access request
          source: |
            curl --location --request POST 'https://${HOSTNAME}/iudx/acl/apd/v2/access_request/has_access' \
            --header 'Authorization: <tokenValue>' \
            --header 'Content-Type: application/json' \
              --data-raw '<payload>'
