openapi: 3.0.2
info:
  title: Dx- ACL APD Server
  version: 1.1.0
  description: |-

    # About DX ACL APD

      **List (ACL APD) Server** are designed for creating and managing policies for consumers and consumer delegates.
    This allows providers and provider delegates to control access to their resources by consumers and consumer delegates.
    This API specification for ACL APD requires a bearer token from the **Data Exchange (DX) Keycloak** for authentication purposes.

    # Configurations
    - **Server**: 
      - In the doc, we display the server url to be https://${HOSTNAME} with the hostname as ${HOSTNAME}
      - This could be configured according to the deployment
    - **Base path**:
         - Base path is the path on which API is served, relative to the host
         - It is the initial part of the API
         - These base path values could be configured according to the deployment
     - All the APIs except `/verify` endpoint contain `/iudx/acl/apd/v2` as it's base path
    - **Request Samples**:
      - The `<tokenValue>` in the header of request sample could be replaced with respective token value [Also refer Tokens section [here](#section/Tokens)]
      - The `<payload>` in the request sample could be replaced with the payload given adjacent to the request sample    

    # Tokens
     - All the endpoints should contain valid DX Identity token in the request header

    | Endpoint | Token Type | Users |
    |----------|------------|--------|
    | [(GET) /access_request/provider](#operation/get-auth-v2-access-requests-provider)  | DX Keycloak Token | Provider, Org Admin |
    | [(GET) /access_request/consumer](#operation/get-auth-v2-access-requests-consumer)  | DX Keycloak Token | Consumer, Provider,Cos Admin,Org Admin,user with compute|
    | [(POST) /access_request](#operation/post-auth-v2-access-requests)  | DX Keycloak Token | Consumer, Provider,Cos Admin,Org Admin,user with compute |
    | [(PUT) /access_request](#operation/put-auth-v2-access-requests)  | DX Keycloak Token | Provider,Org Admin |
    | [(POST) /access_request/has_access](#operation/post-auth-v2-access-requests-has-access)  | DX Keycloak Token | Consumer, Provider,Cos Admin,Org Admin,user with compute |
    | [(GET) /access_request/provider/report](#operation/get-auth-v2-access-requests-provider-report)  | DX Keycloak Token | Provider |
    | [(GET) /access_request/organisation/report](#operation/get-auth-v2-access-requests-org-admin-report) | DX Keycloak Token | Org  Admin |
    | [(GET) /access_request/organisation](#operation/get-auth-v2-access-requests-organisation) | DX Keycloak Token | Org Admin | 

    # API HTTP Responses
     Apart from the response codes specified in each API, the API server may respond with certain 4xx and 5xx error codes which are related to common API Gateway behaviours.
     The application should address them accordingly.


       
  contact:
    name: For support contact CDPG Team at
    email: ${SUPPORT_EMAIL}
    url: https://dataforpublicgood.org.in/
  license:
    name: Apache 2.0
servers:
  - url: https://${HOSTNAME}
    description: dynamic server url
paths:
  /iudx/acl/apd/v2/access_request:
    post:
      tags:
        - Access Request
      summary: Create Access Request
      description: |-

        Consumers can create an access request to request access to a provider’s resource.

        When an access request is created:

        - The request status is set to `PENDING`
        - The provider is notified

        ## Important Rules

        - A consumer cannot create an access request for their own resource.
        - If an ACTIVE policy already exists for the consumer and resource,
          the request will be rejected with `409 Conflict`.

        ## Request Lifecycle

        - `PENDING` → Awaiting provider action
        - `GRANTED` → Policy is created automatically
        - `REJECTED` → No policy is created

        The request does not grant access by itself. Access is granted only
        when the provider approves the request.
      operationId: post-auth-v2-access-requests
      requestBody:
        description: |
          - `itemId` : The catalogue ID of the asset for which the request is to be created
          - `requestType` : The type of usage of asset
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              properties:
                itemId:
                  type: string
                  format: uuid
                  pattern: ^[0-9a-f]{8}\b-[0-9a-f]{4}\b-[0-9a-f]{4}\b-[0-9a-f]{4}\b-[0-9a-f]{12}$
                requestType:
                  enum:
                    - DOWNLOAD
                  minLength: 1
                additionalInfo:
                  description: Used to define additional information to access data for educational, research or testing, non-commercial, academia purposes
                  type: object
                  minProperties: 1
                  maxProperties: 10
                constraints:
                  type: object
                  description: Optional access constraints requested by the consumer
                  additionalProperties: true
              required:
                - itemId
                - requestType
              x-examples:
                example-1:
                  itemId: b34eb955-c691-4fd3-b200-f18bc78810a2
                  requestType: DOWNLOAD
            examples:
              Create Access Request:
                value:
                  itemId: b34eb955-c691-4fd3-b200-f18bc78810a2
                  requestType: DOWNLOAD
              Create Access Request with additionalInfo:
                value:
                  itemId: b34eb955-c691-4fd3-b200-f18bc78810a2
                  requestType: DOWNLOAD
                  additionalInfo:
                    name: Miles Davis
                    email: miles@davis.org
                    phone: 987654321
                    purpose: testing
                    description: The resource would be used for testing the abcd application in which services are offered free of cost for public welfare
                  constraints:
                    subjects:
                      allowedOrgIds:
                        - <uuid>
                        - <uuid>
                      allowedUserIds:
                        - <uuid>
                      allowedRoles:
                        - consumer
                    access:
                      - accessType: api
                        expiry: 1735689600
                        limits:
                          dataUsage: 100:gb
                          apiHits: 100
                      - accessType: sub
                        expiry: 1735689600
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/createNotificationSuccessResponse'
          headers:
            Content-Type:
              schema:
                type: string
              description: application/json
        '400':
          description: |-
            Bad Request
            - Schema validation, missing or incorrect fields & values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generalBadRequest'
              examples:
                Example:
                  value:
                    type: urn:dx:AclApdApd:badRequest
                    title: Bad Request
                    detail: Request could not be created, as the item type is invalid
          headers:
            Content-Type:
              schema:
                type: string
              description: application/json
        '401':
          description: |-
            Unauthorized
            - `token` invalid/expired
            - A user with non-consumer role trying to create a request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
          headers:
            Content-Type:
              schema:
                type: string
              description: application/json
        '403':
          description: |-
            Forbidden
            - User cannot create access request for the resource, as the user is a provider of the resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/createNotificationForbidden'
          headers:
            Content-Type:
              schema:
                type: string
              description: application/json
        '404':
          description: |-
            Not Found
            - Resource not found in Data Exchange Catalogue Server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/createNotificationResourceNotFoundResponse'
          headers:
            Content-Type:
              schema:
                type: string
              description: application/json
        '409':
          description: |-
            Conflict
            - The policy or request for the given resource was previously created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/createNotificationConflictResponse'
          headers:
            Content-Type:
              schema:
                type: string
              description: application/json
      security:
        - authorization: []
      x-codeSamples:
        - lang: cURL
          label: Create access request
          source: |
            curl --location --request POST 'https://${HOSTNAME}/iudx/acl/apd/v2/access_request' \
              --header 'Authorization: <tokenValue>' \
              --header 'Content-Type: application/json' \
              --data-raw '<payload>'

            - lang: cURL
            label: Create access request with additional info
            source: |
            curl --location --request POST 'https://${HOSTNAME}/iudx/acl/apd/v2/access_request' \
              --header 'Authorization: <tokenValue>' \
              --header 'Content-Type: application/json' \
              --data-raw '<payload>'
    put:
      tags:
        - Access Request
      summary: Update Access Request
      description: |-

        Providers or authorized delegates can approve or reject **PENDING**
        access requests for resources they own.

        ## If Approved (`status = granted`)

        - The request status is updated to `GRANTED`
        - A new policy is created with status = `ACTIVE`
        - A corresponding access rule is created
        - The policy and rule will expire based on the provided `expiryAt`
        - Constraints provided in this request override consumer-suggested constraints

        ## If Rejected (`status = rejected`)

        - The request status is updated to `REJECTED`
        - No policy is created
        - No access rule is created

        ## Important

        - Only requests in `PENDING` state can be updated
        - Providers can only act on requests for resources they own
      operationId: put-auth-v2-access-requests
      requestBody:
        description: |-
          - `requestId` :  ID of the request. Can get this `id` by using the GET Access request API.
          - `status` : The `provider` or `provider delegate` can update the status to `granted` or `rejected`.
          - `expiryAt` : expiration time stamp with ISO 8601 format to provide access to the given asset (Only present for the granted requests).
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - title: approve access request
                  additionalProperties: true
                  type: object
                  properties:
                    requestId:
                      type: string
                      format: uuid
                      pattern: ^[0-9a-f]{8}\b-[0-9a-f]{4}\b-[0-9a-f]{4}\b-[0-9a-f]{4}\b-[0-9a-f]{12}$
                    status:
                      type: string
                      enum:
                        - granted
                    expiryAt:
                      type: string
                      description: ISO 8601 format timestamp to provide access to the given asset
                    constraints:
                      type: object
                      description: Access constraints that the provider can apply (e.g., allowed access types)
                      additionalProperties: true
                  required:
                    - requestId
                    - status
                - title: reject access request
                  additionalProperties: false
                  type: object
                  properties:
                    requestId:
                      type: string
                      format: uuid
                      pattern: ^[0-9a-f]{8}\b-[0-9a-f]{4}\b-[0-9a-f]{4}\b-[0-9a-f]{4}\b-[0-9a-f]{12}$
                    status:
                      type: string
                      enum:
                        - rejected
                  required:
                    - requestId
                    - status
              x-examples:
                example-1:
                  requestId: bca11712-f381-46a5-afa3-a29b00568ace
                  status: granted
                  expiryAt: '2026-03-05T20:00:19'
            examples:
              Update Approved access request:
                value:
                  requestId: bca11712-f381-46a5-afa3-a29b00568ace
                  status: granted
                  expiryAt: '2026-03-05T20:00:19'
                  constraints:
                    subjects:
                      allowedOrgIds:
                        - <uuid>
                        - <uuid>
                      allowedUserIds:
                        - <uuid>
                      allowedRoles:
                        - consumer
                    access:
                      - accessType: api
                        expiry: 1735689600
                        limits:
                          dataUsage: 100:gb
                          apiHits: 100
                      - accessType: file
                        expiry: 1735689600
                        limits:
                          dataUsage: 10:gb
              Update Rejected access request:
                value:
                  requestId: bca11712-f381-46a5-afa3-a29b00568ace
                  status: rejected
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateAccessRequest'
              examples:
                Update:
                  value:
                    type: urn:dx:AclApdApd:success
                    title: Success
                    detail: Request updated successfully
          headers:
            Content-Type:
              schema:
                type: string
              description: application/json
        '400':
          description: Bad Request- Schema validation, missing or incorrect fields & values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/updateNotificationBadRequest'
          headers:
            Content-Type:
              schema:
                type: string
              description: application/json
        '401':
          description: '- Unauthorized - `token` invalid/expired'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
          headers:
            Content-Type:
              schema:
                type: string
              description: application/json
        '403':
          description: |-
            Forbidden
            - User does not own the asset or item for which access request is being granted or rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/updateNotificationForbiddenResponse'
          headers:
            Content-Type:
              schema:
                type: string
              description: application/json
        '404':
          description: '- Not Found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/updateNotificationNotFound'
          headers:
            Content-Type:
              schema:
                type: string
              description: application/json
      security:
        - authorization: []
      x-codeSamples:
        - lang: cURL
          label: Reject access request
          source: |
            curl --location --request PUT 'https://${HOSTNAME}/iudx/acl/apd/v2/policies/requests' \
            --header 'Authorization: <tokenValue>' \
            --header 'Content-Type: application/json' \
              --data-raw '<payload>'
        - lang: cURL
          label: Approve access request
          source: |
            curl --location --request PUT 'https://${HOSTNAME}/iudx/acl/apd/v2/policies/requests' \
            --header 'Authorization: <tokenValue>' \
            --header 'Content-Type: application/json' \
              --data-raw '<payload>'
  /iudx/acl/apd/v2/access_request/{id}:
    patch:
      tags:
        - Access Request
      summary: Withdraw Access Request
      description: |
        Consumers can withdraw their own access requests if their requests is in **pending** state.
        If the request is deleted
        - The request is modified to the `withdrawn` state
      operationId: patch-auth-v2-access-requests
      parameters:
        - name: id
          in: path
          required: true
          description: Unique ID of the organization request
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateAccessRequest'
              examples:
                Update:
                  value:
                    type: urn:dx:AclApdApd:success
                    title: Success
                    detail: Request updated successfully
          headers:
            Content-Type:
              schema:
                type: string
              description: application/json
        '400':
          description: Bad Request- Schema validation, missing or incorrect fields & values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/updateNotificationBadRequest'
          headers:
            Content-Type:
              schema:
                type: string
              description: application/json
        '401':
          description: '- Unauthorized - `token` invalid/expired'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
          headers:
            Content-Type:
              schema:
                type: string
              description: application/json
        '403':
          description: |-
            Forbidden
            - User does not own the asset or item for which access request is being granted or rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/updateNotificationForbiddenResponse'
          headers:
            Content-Type:
              schema:
                type: string
              description: application/json
        '404':
          description: '- Not Found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/updateNotificationNotFound'
          headers:
            Content-Type:
              schema:
                type: string
              description: application/json
      security:
        - authorization: []
      x-codeSamples:
        - lang: CURL
          label: Example - Withdraw Request
          source: |
            curl --location --request PATCH "https://${HOSTNAME}/iudx/acl/apd/v2/access_request/{{requestId}}" \
              --header "Authorization: Bearer <JWT_TOKEN>" \
              --header "Content-Type: application/json"
  /iudx/acl/apd/v2/access_request/provider:
    get:
      tags:
        - Access Request
      summary: List Access Requests for Provider
      description: |-
        Lists all the latest access requests for assets owned by the provider/provider delegate calling the API, regardless of the state of the access requests.

        <br>
        <br>

        `Note:` The response displays the requests for a provider with respect to a particular server.
      operationId: get-auth-v2-access-requests-provider
      parameters:
        - name: requestStatus
          in: query
          description: Status of the access request. Displays all the access requests if status is not specified
          required: false
          schema:
            type: string
            enum:
              - PENDING
              - GRANTED
              - REJECTED
              - WITHDRAWN
        - name: assetType
          in: query
          description: Type of the asset for which the access request is made. Displays all the access requests if assetType is not specified
          required: false
          schema:
            type: string
            enum:
              - adex:DataBank
              - adex:AiModel
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortingParam'
        - $ref: '#/components/parameters/TimeParam'
        - $ref: '#/components/parameters/EndTimeParam'
        - $ref: '#/components/parameters/TimeRelParam'
      responses:
        '200':
          description: |-
            OK
            - Successfully fetched all the requests of a consumer or of a provider
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRequest'
              examples:
                ListResults:
                  value:
                    type: urn:dx:AclApd:success
                    title: Success
                    results:
                      - requestId: ea48d233-5d3b-4bdb-9545-691680c99cee
                        requestStatus: GRANTED
                        requestType: DOWNLOAD
                        additionalInfo:
                          name: Miles Morales,
                          email: miles.morales@acmecorp.org,
                          phoneNo: 9876543210,
                          purpose: academia,
                          description: AI model would be used for non-commercial, academia purposes to test the application abcd
                        user:
                          consumerId: a13eb955-c691-4fd3-b200-f18bc78810b5
                          consumerFirstName: Plutonian
                          consumerLastName: Resident
                          consumerEmail: scroopy@noopers.com
                          consumerOrganization: Scroopy Noopers Corp
                        asset:
                          itemId: 316cd4eb-71b3-42c2-beb2-785a77999321
                          assetName: Ice Estimation Model
                          assetType: adex:AiModel
                          shortDescription: This is a test AI model for estimating percentage of ice on Pluto
                        expiryAt: '3000-03-05T20:00:19'
                        updatedAt: '2025-06-04T07:25:08.663637'
                        createdAt: '2025-06-04T09:10:57.267564'
                    paginationInfo:
                      page: 1
                      size: 1
                      totalCount: 3
                      totalPages: 3
                      hasNext: true
                      hasPrevious: false
          headers:
            Content-Type:
              schema:
                type: string
              description: application/json
        '400':
          description: Bad Request- Schema validation, missing or incorrect fields & values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/updateNotificationBadRequest'
          headers:
            Content-Type:
              schema:
                type: string
              description: application/json
        '401':
          description: '- Unauthorized - `token` invalid/expired'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
          headers:
            Content-Type:
              schema:
                type: string
              description: application/json
      security:
        - authorization: []
      x-codeSamples:
        - lang: cURL
          label: Get access requests
          source: |
            curl --location --request GET 'https://${HOSTNAME}/iudx/acl/apd/v2/access_request/provider' \
          '--header ''Authorization': <tokenValue>'
        - lang: cURL
          label: Get access request with status
          source: |
            curl --location --request GET 'https://${HOSTNAME}/iudx/acl/apd/v2/access_request/provider?requestStatus=GRANTED' \
          '--header ''Authorization': <tokenValue>'
        - lang: cURL
          label: With pagination query params
          source: |
            curl --location --request GET 'https://${HOSTNAME}/iudx/acl/apd/v2/access_request/provider?requestStatus=PENDING&timerel=after&time=2022-06-26T07:19:11.325746&sort=requestId:desc;createdAt:asc' \
          '--header ''Authorization': <tokenValue>'
  /iudx/acl/apd/v2/access_request/provider/report:
    get:
      tags:
        - Access Request
      summary: Get Access Request Report for Provider
      description: |-
        Lists all the latest access requests for assets owned by the provider/provider delegate calling the API, regardless of the state of the access requests. 
        It adds the response in a CSV file and lets the user download it.
      operationId: get-auth-v2-access-requests-provider-report
      parameters:
        - name: requestStatus
          in: query
          description: Status of the access request. Displays all the access requests if status is not specified
          required: false
          schema:
            type: string
            enum:
              - PENDING
              - GRANTED
              - REJECTED
              - WITHDRAWN
        - name: assetType
          in: query
          description: Type of the asset for which the access request is made. Displays all the access requests if assetType is not specified
          required: false
          schema:
            type: string
            enum:
              - adex:AiModel
              - adex:DataBank
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortingParam'
        - $ref: '#/components/parameters/TimeParam'
        - $ref: '#/components/parameters/EndTimeParam'
        - $ref: '#/components/parameters/TimeRelParam'
      responses:
        '200':
          description: |-
            OK
            - Successfully fetched all the requests of a consumer or of a provider
          content:
            application/csv:
              schema:
                type: string
                format: binary
                description: CSV file containing the access requests similar to the JSON response in GET /access_request/provider
          headers:
            Content-Type:
              schema:
                type: string
              description: application/json
        '400':
          description: Bad Request- Schema validation, missing or incorrect fields & values. If there is no data for csv generation, it returns a 400 error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/reportGenerationBadRequest'
          headers:
            Content-Type:
              schema:
                type: string
              description: application/json
        '401':
          description: '- Unauthorized - `token` invalid/expired'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
          headers:
            Content-Type:
              schema:
                type: string
              description: application/json
        '403':
          description: When consumer is trying to access the report generation API or when the user is not a provider user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/reportGenerationForbiddenResponse'
          headers:
            Content-Type:
              schema:
                type: string
              description: application/json
      security:
        - authorization: []
      x-codeSamples:
        - lang: cURL
          label: Get access requests
          source: |
            curl --location --request GET 'https://${HOSTNAME}/iudx/acl/apd/v2/access_request/provider/report' \
          '--header ''Authorization': <tokenValue>'
        - lang: cURL
          label: Get access request with status
          source: |
            curl --location --request GET 'https://${HOSTNAME}/iudx/acl/apd/v2/access_request/provider/report?requestStatus=GRANTED' \
          '--header ''Authorization': <tokenValue>'
        - lang: cURL
          label: With pagination query params
          source: |
            curl --location --request GET 'https://${HOSTNAME}/iudx/acl/apd/v2/access_request/provider/report?requestStatus=PENDING&timerel=after&time=2022-06-26T07:19:11.325746&sort=requestId:desc;createdAt:asc' \
          '--header ''Authorization': <tokenValue>'
  /iudx/acl/apd/v2/access_request/organisation/report:
    get:
      tags:
        - Access Request
      summary: Get Access Request Report for Organization Admin
      description: |-
        Lists all the latest access requests for assets present in a certain organization when called by Organization Admin, regardless of the state of the access requests. 
        It adds the response in a CSV file and lets the user download it. The organization admin can view the access requests of all the users in the organization.
      operationId: get-auth-v2-access-requests-org-admin-report
      parameters:
        - name: requestStatus
          in: query
          description: Status of the access request. Displays all the access requests if status is not specified
          required: false
          schema:
            type: string
            enum:
              - PENDING
              - GRANTED
              - REJECTED
              - WITHDRAWN
        - name: assetType
          in: query
          description: Type of the asset for which the access request is made. Displays all the access requests if assetType is not specified
          required: false
          schema:
            type: string
            enum:
              - adex:AiModel
              - adex:DataBank
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortingParam'
