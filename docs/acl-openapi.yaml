  /iudx/acl/apd/v2/policy:
    post:
      tags:
        - Policies
      summary: Create Policy
      operationId: post-auth-v1-policies
      description: |
        Creates one or more ACTIVE access policies for DATABANK, AIMODEL resources.

        This API can be invoked by:

        - The resource owner (`provider`)
        - An `org_admin` belonging to the same organization as the resource

        A policy defines:

        - Who can access the resource
        - Which access types are allowed
        - Optional usage limits and expiry conditions

        ## Policy Types

        ### INDIVIDUAL

        Grants access to a specific user.

        - `userId` is required
        - Access is evaluated for the specified user

        ### GROUP

        Grants access to users matching subject criteria.

        - `constraints.subjects` is required
        - Supports organization, user, and role-based access control

        When `constraints.subjects` is provided, the system automatically creates
        access rules linked to the policy for subject-based authorization.

        ## Access Types

        Access types are defined under `constraints.access`.

        Supported values depend on the resource metadata and may include:

        - `api`
        - `file`
        - `sub`

        Each requested access type must be supported by the resource.
        Otherwise the request is rejected with `400 Bad Request`.

        ## Batch Creation

        Multiple policies may be created in a single request using the `request` array.

        Each policy request is validated independently.

        ## Conflict Behaviour

        Only one ACTIVE policy may exist for the same resource and access type combination.

        If an ACTIVE policy already exists for any requested access type,
        the API returns `409 Conflict`.

        Example:

        - Existing policy: `api`
        - New policy request: `api`, `file`

        Result:

        - Conflict for `api`
        - Request is rejected

        ## Restrictions
        - Resource ownership is mandatory for providers
        - `org_admin` users may manage only resources belonging to their organization
      parameters:
        - name: Authorization
          in: header
          description: DX Auth issued identity token
          required: true
          schema:
            type: string
            minLength: 1
            pattern: Bearer [a-zA-Z0-9_*\-*\.\/]+$|^[a-zA-Z0-9_*\-*\.\/]+$
      requestBody:
        description: |
          **Request Body Details:**

            The request body should be a JSON object containing a JSON array of request.

            ### User Policy Request:

            - `userId`: The ID of the user for whom the policy is being defined.
            - `itemId`: The UUID value of the item for which the policy is being established.
            - `itemType`: An enum value representing the type of the item.
            - `expiryTime`: An optional field, representing the policy's expiry time in ISO8601 format compatible with UTC (yyyy-MM-dd'T'HH:mm:ss). If not provided, a default expiry time is set for the policy.
            - `constraints`: JSON object defining subjects and access controls.
          ### Constraints Structure:
          `constraints` may contain:
          - `subjects`
            - allowedOrgIds
            - allowedUserIds
            - allowedRoles
                
          - `access` (array)
            - accessType: api | file | sub
            - expiry (epoch seconds)
            - limits (optional, varies per accessType)
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                request:
                  type: array
                  minItems: 1
                  items:
                    oneOf:
                      - $ref: '#/components/schemas/IndividualPolicyRequest'
                      - $ref: '#/components/schemas/GroupPolicyRequest'
              required:
                - request
              x-examples:
                example-1:
                  request:
                    - userId: <uuid>
                      policyType: GROUP
                      itemId: example-resource-group
                      itemType: DATABANK
                      expiryTime: '2023-08-30T21:10:06'
                      constraints:
                        subjects:
                          allowedOrgIds:
                            - <uuid>
                            - <uuid>
                          allowedUserIds:
                            - <uuid>
                          allowedRoles:
                            - consumer
                        access:
                          - accessType: api
                            expiry: '2026-03-05T20:00:19'
                            limits:
                              dataUsage: 100:gb
                              apiHits: 100
                          - accessType: file
                            expiry: '2026-03-05T20:00:19'
                            limits:
                              dataUsage: 10:gb
                          - accessType: sub
                            expiry: '2026-03-05T20:00:19'
                    - userId: <uuid>
                      itemId: example-resource-group
                      itemType: DATABANK
                      expiryTime: '2023-08-30T21:10:06'
                      constraints:
                        subjects:
                          allowedOrgIds:
                            - <uuid>
                            - <uuid>
                          allowedUserIds:
                            - <uuid>
                          allowedRoles:
                            - consumer
                        access:
                          - accessType: api
                            expiry: '2026-03-05T20:00:19'
                            limits:
                              dataUsage: 100:gb
                              apiHits: 100
                          - accessType: file
                            expiry: '2026-03-05T20:00:19'
                            limits:
                              dataUsage: 10:gb
                          - accessType: sub
                            expiry: '2026-03-05T20:00:19'
            examples:
              Request for resource with additionalInfo:
                value:
                  request:
                    policyType: GROUP
                    itemId: b34eb955-c691-4fd3-b200-f18bc78810a2
                    itemType: DATABANK
                    expiryTime: '2022-08-04T20:00:19'
                    constraints:
                      subjects:
                        allowedOrgIds:
                          - <uuid>
                          - <uuid>
                        allowedUserIds:
                          - <uuid>
                        allowedRoles:
                          - consumer
                      access:
                        - accessType: api
                          expiry: '2026-03-05T20:00:19'
                          limits:
                            dataUsage: 100:gb
                            apiHits: 100
                        - accessType: file
                          expiry: '2026-03-05T20:00:19'
                          limits:
                            dataUsage: 10:gb
                        - accessType: sub
                          expiry: '2026-03-05T20:00:19'
                    additionalInfo:
                      name: Miles Davis
                    providerComment: The resource is used for transportation data analysis
                    feedbackToConsumer: This resource can be used for testing purposes
              Request for resource user policy:
                value:
                  request:
                    policyType: GROUP
                    itemId: b34eb955-c691-4fd3-b200-f18bc78810a2
                    itemType: DATABANK
                    expiryTime: '2022-10-10T04:00:19'
                    constraints:
                      subjects:
                        allowedOrgIds:
                          - <uuid>
                          - <uuid>
                        allowedUserIds:
                          - <uuid>
                        allowedRoles:
                          - consumer
                      access:
                        - accessType: api
                          expiry: '2026-03-05T20:00:19'
                          limits:
                            dataUsage: 100:gb
                            apiHits: 100
                        - accessType: file
                          expiry: '2026-03-05T20:00:19'
                          limits:
                            dataUsage: 10:gb
                        - accessType: sub
                          expiry: '2026-03-05T20:00:19'
      responses:
        '200':
          description: The policy has been successfully created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/createPolicySuccessResponse'
        '400':
          description: |-
            - Missing or malformed data
            - Invalid expiry - dateTime in the past or invalid format
            - Invalid user - UserId is not present in db
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/createPolicyBadRequest'
          headers:
            Content-Type:
              schema:
                type: string
              description: application/json
        '401':
          description: '- Unauthorized - `token` invalid/expired'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
              example:
                type: urn:dx:aclApd:notAuthorized
                title: Not Authorized
                detail: Missing or invalid Bearer token
          headers:
            Content-Type:
              schema:
                type: string
              description: application/json
        '403':
          description: |
            - If the user trying to create a policy does not have a `provider`
              or `org_admin` role.

            - If the user is neither the owner of the resource item
              nor belongs to the organization that owns the databank item/ ai model.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/createPolicyForbidden'
              example:
                type: urn:dx:aclApd:forbidden
                title: Forbidden
                detail: User does not have the required role.
          headers:
            Content-Type:
              schema:
                type: string
              description: application/json
        '409':
          description: |
            Conflict

            An ACTIVE policy already exists for one or more requested access types.

            Policies are validated per access type. A duplicate ACTIVE policy
            cannot be created for the same resource and access type combination.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/conflictResponse'
      security:
        - authorization: []
      x-codeSamples:
