      description: 'This parameter allows sorting the results by up to 3 fields, separated by a semicolon (`;`). The format for each field is `fieldName:asc` or `fieldName:desc`. For example: `createdAt:desc;assetType:asc;userId:desc` will sort by creation date (descending), then asset type (ascending), then user ID (descending).'
      required: false
      schema:
        type: string
    TimeParam:
      name: time
      in: query
