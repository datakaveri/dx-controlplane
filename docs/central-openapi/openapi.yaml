openapi: 3.0.2
info:
  title: Dx- Control Plane - Catalogue - Authentication , Authorization and Accounting (AAA) Server
  version: 1.1.0
  description: "\n# About DX AAA\n\n Dx Control Plane **Auth Server (AAA)**  is a core component of the Dx Control Plane responsible\
    \ for validating JWT tokens and enforcing **Role-Based Access Control (RBAC)** on incoming API requests. The **Keycloak\
    \ Server** acts as the **Identity Provider (IdP)** and issues signed JWT tokens upon successful user login or registration.\
    \ The AAA validates the token by verifying its signature, expiration, and integrity, and extracts user roles from the\
    \ token claims.\nThis enables secure access to platform services such as organization management, credit management, compute\
    \ APIs, and KYC check APIs. Users can be assigned roles such as `compute`, `publisher`, `org_admin`, and `cos_admin`,\
    \ which determine the API operations they are authorized to perform.\nThe Auth Server ensures that only authorized users\
    \ can perform actions according to their role, by matching the required role for each API with the roles present in the\
    \ user's JWT. Additionally, audit logging tracks authentication and authorization events for security and troubleshooting\
    \ purposes. \n\n# About DX Catalogue\n The DX Catalogue is a core component of the Dx Control Plane responsible for  dataset\
    \ discovery portal and metadata store.It enables *Providers* of datasources to describe them with DX  based annotations\
    \ to make discovery and consumption of data both automatable and semantically describable. For search and discovery, it\
    \ allows users to search through text and geo-based queries.  The catalogue is a [JSON-LD](https://json-ld.org/) document\
    \ stored and based on the  [RDF](https://www.w3.org/RDF/) information exchange model. \n#  Configurations\n- **Server**:\
    \ \n  - In the doc, we display the server url to be https://${HOSTNAME} with the hostname as ${HOSTNAME}\n  - This could\
    \ be configured according to the deployment\n- **Base path**:\n     - Base path is the path on which API is served, relative\
    \ to the host\n     - It is the initial part of the API\n     - These base path values could be configured according to\
    \ the deployment\n     - The base path for [DX AAA Server](https://github.com/datakaveri/iudx-aaa-server) is set to `/iudx/v2/auth`\n\
    \     - The base path for [DX Catalogue Server](https://github.com/datakaveri/iudx-catalogue-server) is set to `/iudx/v2/cat`\n\
    \ - **Request Samples**:\n  - The `<tokenValue>` in the header of request sample could be replaced with respective token\
    \ value [Also refer Tokens section [here](#section/Tokens)]\n  - The `<payload>` in the request sample could be replaced\
    \ with the payload given adjacent to the request sample    \n\n# API HTTP Responses\n Apart from the response codes specified\
    \ in each API, the API server may respond with certain 4xx and 5xx error codes which are related to common API Gateway\
    \ behaviours.\n The application should address them accordingly.\n\n   "
  contact:
    name: For support contact CDPG Team at
    email: ${SUPPORT_EMAIL}
    url: https://dataforpublicgood.org.in/
  license:
    name: Apache 2.0
servers:
- url: https://${HOSTNAME}
  description: dynamic server url
