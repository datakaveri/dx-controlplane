    parameters:
    - name: requestStatus
      in: query
      description: Status of the access request. Displays all the access requests
        if status is not specified
      required: false
      schema:
        type: string
        enum:
        - PENDING
        - GRANTED
        - REJECTED
        - WITHDRAWN
    - name: assetType
      in: query
      description: Type of the asset for which the access request is made. Displays
        all the access requests if assetType is not specified
      required: false
