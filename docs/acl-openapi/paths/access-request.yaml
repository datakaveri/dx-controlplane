    - Access Request
    summary: List Access Requests for Provider
    description: 'Lists all the latest access requests for assets owned by the provider/provider
      delegate calling the API, regardless of the state of the access requests.


      <br>

      <br>


      `Note:` The response displays the requests for a provider with respect to a
      particular server.'
