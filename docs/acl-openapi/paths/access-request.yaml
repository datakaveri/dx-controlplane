/iudx/acl/apd/v2/access_request:
  post:
    tags:
    - Access Request
    summary: Create Access Request
    description: |
      Consumers can create an access request to request access to a provider's resource.

      When an access request is created:

      * The request status is set to `PENDING`.
      * The provider is notified for review.

      Access Type Handling:

      * Access requests are evaluated independently for each requested access type.
      * Consumers can raise multiple access requests for the same resource, provided the requested access types are different.
      * Requests are allowed for access types that are neither pending approval nor already granted.

      Conflict Handling:

      * A request is rejected if any requested access type already has a pending access request.
      * A request is rejected if any requested access type is already granted through an active policy.
      * Conflict responses identify the specific access type(s) that caused the request to be rejected.

      Important Rules:

      * A consumer cannot create an access request for their own resource.

      Request Lifecycle:

      * `PENDING` → Awaiting provider action.
      * `GRANTED` → Policy is created automatically.
      * `REJECTED` → No policy is created.

      Creating an access request does not grant access. Access is granted only when the provider approves the request.
    operationId: post-auth-v2-access-requests
    requestBody:
      description: '- `itemId` : The catalogue ID of the asset for which the request
        is to be created

        - `requestType` : The type of usage of asset

        '
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
            properties:
              itemId:
                type: string
                format: uuid
                pattern: ^[0-9a-f]{8}\b-[0-9a-f]{4}\b-[0-9a-f]{4}\b-[0-9a-f]{4}\b-[0-9a-f]{12}$
              requestType:
                enum:
                - DOWNLOAD
                minLength: 1
              additionalInfo:
                description: Used to define additional information to access data
                  for educational, research or testing, non-commercial, academia purposes
                type: object
                minProperties: 1
                maxProperties: 10
              constraints:
                type: object
                description: |
                  Optional constraints requested by the consumer.

                  Requested access types must be supported by the resource.
                  These constraints may be modified by the provider during approval.
                additionalProperties: true
            required:
            - itemId
            - requestType
            x-examples:
              example-1:
                itemId: b34eb955-c691-4fd3-b200-f18bc78810a2
                requestType: DOWNLOAD
          examples:
            Create Access Request:
              value:
                itemId: b34eb955-c691-4fd3-b200-f18bc78810a2
                requestType: DOWNLOAD
            Create Access Request with additionalInfo and constraints:
              value:
                itemId: b34eb955-c691-4fd3-b200-f18bc78810a2
                requestType: DOWNLOAD
                additionalInfo:
                  name: Miles Davis
                  email: miles@davis.org
                  phone: 987654321
                  purpose: testing
                  description: The resource would be used for testing the abcd application
                    in which services are offered free of cost for public welfare
                constraints:
                  subjects:
                    allowedOrgIds:
                    - <uuid>
                    - <uuid>
                    allowedUserIds:
                    - <uuid>
                    allowedRoles:
                    - consumer
                  access:
                  - accessType: api
                    expiry: '2026-03-05T20:00:19'
                    limits:
                      dataUsage: 100:gb
                      apiHits: 100
                  - accessType: sub
                    expiry: '2026-03-05T20:00:19'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/createNotificationSuccessResponse
        headers:
          Content-Type:
            schema:
              type: string
            description: application/json
      '400':
        description: 'Bad Request

          - Schema validation, missing or incorrect fields & values'
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/generalBadRequest
            examples:
              Example:
                value:
                  type: urn:dx:aclApd:badRequest
                  title: Bad Request
                  detail: Request could not be created, as the item type is invalid
        headers:
          Content-Type:
            schema:
              type: string
            description: application/json
      '401':
        description: 'Unauthorized

          - `token` invalid/expired

          - A user with non-consumer role trying to create a request'
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Unauthorized
            example:
              type: urn:dx:aclApd:notAuthorized
              title: Not Authorized
              detail: Missing or invalid Bearer token
        headers:
          Content-Type:
            schema:
              type: string
            description: application/json
      '403':
        description: 'Forbidden

          - User cannot create access request for the resource, as the user is a provider
          of the resource'
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/createNotificationForbidden
            example:
              type: urn:dx:aclApd:forbidden
              title: Forbidden
              detail: User does not have the required role.
        headers:
          Content-Type:
            schema:
              type: string
            description: application/json
      '404':
        description: 'Not Found

          - Resource not found in Data Exchange Catalogue Server'
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/createNotificationResourceNotFoundResponse
        headers:
          Content-Type:
            schema:
              type: string
            description: application/json
      '409':
        description: |
          Conflict

          - One or more requested access types already have a pending access request.
          - One or more requested access types are already granted through an active policy.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/createNotificationConflictResponse'
            examples:
              PendingRequestConflict:
                value:
                  type: urn:dx:aclApd:conflict
                  title: Conflict
                  detail: 'Pending access requests exist for: api.'

              ActivePolicyConflict:
                value:
                  type: urn:dx:aclApd:conflict
                  title: Conflict
                  detail: 'Active access already granted for: api.'
        headers:
          Content-Type:
            schema:
              type: string
            description: application/json
    security:
    - authorization: []
    x-codeSamples:
    - lang: cURL
      label: Create access request
      source: "curl --location --request POST 'https://${HOSTNAME}/iudx/acl/apd/v2/access_request'\
        \ \\\n  --header 'Authorization: <tokenValue>' \\\n  --header 'Content-Type:\
        \ application/json' \\\n  --data-raw '<payload>'\n\n- lang: cURL\nlabel: Create\
        \ access request with additional info\nsource: |\ncurl --location --request\
        \ POST 'https://${HOSTNAME}/iudx/acl/apd/v2/access_request' \\\n  --header\
        \ 'Authorization: <tokenValue>' \\\n  --header 'Content-Type: application/json'\
        \ \\\n  --data-raw '<payload>'\n"
  put:
    tags:
    - Access Request
    summary: Update Access Request
    description: |
      Providers or organization administrators belonging to the provider's organization
      can approve or reject `PENDING` access requests for resources they own.

      If approved:

      * The request status is updated to `GRANTED`.
      * A policy with status `ACTIVE` is created automatically.
      * The policy expires based on the provided `expiryAt`.

      Consumers may request preferred constraints while creating an access request.
      During approval, the provider may accept, modify, or override those constraints.

      Constraints provided during approval may define:

      * Access permissions (access types, expiry, limits, etc.).
      * Subject restrictions (allowed users, organizations, or roles).

      These constraints are used to create the resulting policy and access rule.

      If access constraints are provided during approval, the specified access types
      must be supported by the resource. Otherwise, the request is rejected.

      If access constraints are not provided during approval, access is granted for all
      access types supported by the resource.

      If rejected:

      * The request status is updated to `REJECTED`.
      * No policy or access rule is created.

      Only requests in `PENDING` state can be updated.
    operationId: put-auth-v2-access-requests
    requestBody:
      description: '- `requestId` :  ID of the request. Can get this `id` by using
        the GET Access request API.

        - `status` : The `provider` or `provider delegate` can update the status to
        `granted` or `rejected`.

        - `expiryAt` : expiration time stamp with ISO 8601 format to provide access
        to the given asset (Only present for the granted requests).'
      required: true
      content:
        application/json:
          schema:
            oneOf:
            - title: approve access request
              additionalProperties: true
              type: object
              properties:
                requestId:
                  type: string
                  format: uuid
                  pattern: ^[0-9a-f]{8}\b-[0-9a-f]{4}\b-[0-9a-f]{4}\b-[0-9a-f]{4}\b-[0-9a-f]{12}$
                status:
                  type: string
                  enum:
                  - granted
                expiryAt:
                  type: string
                  description: ISO 8601 format timestamp to provide access to the
                    given asset
                constraints:
                  type: object
                  description: |
                    Optional constraints to be applied to the generated policy and access rule.

                    Constraints may define access permissions (access types, expiry, limits)
                    and subject restrictions (allowed users, organizations, or roles).

                    These constraints override any consumer-requested constraints.

                    Access types specified here must be supported by the resource.
                    If omitted, access is granted for all access types supported by the resource.
                  additionalProperties: true
              required:
              - requestId
              - status
            - title: reject access request
              additionalProperties: false
              type: object
              properties:
                requestId:
                  type: string
                  format: uuid
                  pattern: ^[0-9a-f]{8}\b-[0-9a-f]{4}\b-[0-9a-f]{4}\b-[0-9a-f]{4}\b-[0-9a-f]{12}$
                status:
                  type: string
                  enum:
                  - rejected
              required:
              - requestId
              - status
            x-examples:
              example-1:
                requestId: bca11712-f381-46a5-afa3-a29b00568ace
                status: granted
                expiryAt: '2026-03-05T20:00:19'
          examples:
            Update Approved access request:
              value:
                requestId: bca11712-f381-46a5-afa3-a29b00568ace
                status: granted
                expiryAt: '2026-03-05T20:00:19'
                constraints:
                  subjects:
                    allowedOrgIds:
                    - <uuid>
                    - <uuid>
                    allowedUserIds:
                    - <uuid>
                    allowedRoles:
                    - consumer
                  access:
                  - accessType: api
                    expiry: '2026-03-05T20:00:19'
                    limits:
                      dataUsage: 100:gb
                      apiHits: 100
                  - accessType: file
                    expiry: '2026-03-05T20:00:19'
                    limits:
                      dataUsage: 10:gb
            Update Rejected access request:
              value:
                requestId: bca11712-f381-46a5-afa3-a29b00568ace
                status: rejected
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/UpdateAccessRequest
            examples:
              Update:
                value:
                  type: urn:dx:aclApd:success
                  title: Success
                  detail: Request updated successfully
        headers:
          Content-Type:
            schema:
              type: string
            description: application/json
      '400':
        description: Bad Request- Schema validation, missing or incorrect fields &
          values
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/updateNotificationBadRequest
            examples:
              MalformedRequest:
                value:
                  type: urn:dx:aclApd:badRequest
                  title: Bad Request
                  detail: Missing or malformed request
              InvalidAccessType:
                value:
                  type: urn:dx:aclApd:badRequest
                  title: Bad Request
                  detail: Requested access type 'sub' is not allowed for this resource
        headers:
          Content-Type:
            schema:
              type: string
            description: application/json
      '404':
        description: '- Not Found'
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/updateNotificationNotFound
        headers:
          Content-Type:
            schema:
              type: string
            description: application/json
      '401':
        description: '- Unauthorized - `token` invalid/expired'
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Unauthorized
            example:
              type: urn:dx:aclApd:notAuthorized
              title: Not Authorized
              detail: Missing or invalid Bearer token
        headers:
          Content-Type:
            schema:
              type: string
            description: application/json
      '403':
        description: 'Forbidden

          - User does not own the asset or item for which access request is being
          granted or rejected'
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/updateNotificationForbiddenResponse
            example:
              type: urn:dx:aclApd:forbidden
              title: Forbidden
              detail: User does not have the required role.
        headers:
          Content-Type:
            schema:
              type: string
            description: application/json
    security:
    - authorization: []
    x-codeSamples:
    - lang: cURL
      label: Reject access request
      source: "curl --location --request PUT 'https://${HOSTNAME}/iudx/acl/apd/v2/policies/requests'\
        \ \\\n--header 'Authorization: <tokenValue>' \\\n--header 'Content-Type: application/json'\
        \ \\\n  --data-raw '<payload>'\n"
    - lang: cURL
      label: Approve access request
      source: "curl --location --request PUT 'https://${HOSTNAME}/iudx/acl/apd/v2/policies/requests'\
        \ \\\n--header 'Authorization: <tokenValue>' \\\n--header 'Content-Type: application/json'\
        \ \\\n  --data-raw '<payload>'\n"
