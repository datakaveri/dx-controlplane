/iudx/acl/apd/v2/access_request/has_access:
  post:
    tags:
    - Access Request
    summary: Check Access Request
    description: Checks if the access requests that were previously created by consumer
      or consumer delegate, has been approved by the provider or provider delegate
    operationId: post-auth-v2-access-requests-has-access
    requestBody:
      description: '- `itemId` : The catalogue ID of the asset for which the request
        has been created

        '
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              itemId:
                type: string
                format: uuid
                pattern: ^[0-9a-f]{8}\b-[0-9a-f]{4}\b-[0-9a-f]{4}\b-[0-9a-f]{4}\b-[0-9a-f]{12}$
            required:
            - itemId
            x-examples:
              example-1:
                itemId: b34eb955-c691-4fd3-b200-f18bc78810a2
          examples:
            Create Access Request:
              value:
                itemId: b34eb955-c691-4fd3-b200-f18bc78810a2
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/checkAccessRequestSuccessResponse
        headers:
          Content-Type:
            schema:
              type: string
            description: application/json
      '400':
        description: 'Bad Request

          - Schema validation, missing or incorrect fields & values'
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/generalBadRequest
            examples:
              Example:
                value:
                  type: urn:dx:AclApd:badRequest
                  title: Bad Request
                  detail: Missing or malformed request
        headers:
          Content-Type:
            schema:
              type: string
            description: application/json
      '401':
        description: 'Unauthorized

          - `token` invalid/expired

          - A user with non-consumer role trying to use the API'
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Unauthorized
        headers:
          Content-Type:
            schema:
              type: string
            description: application/json
      '403':
        description: 'Forbidden

          - User''s access request is still in pending status or has been rejected
          by the provider of the resource'
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/checkAccessRequestNotFoundResponse
        headers:
          Content-Type:
            schema:
              type: string
            description: application/json
    security:
    - authorization: []
