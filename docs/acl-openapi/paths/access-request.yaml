/iudx/acl/apd/v2/access_request:
  post:
    tags:
    - Access Request
    summary: Create Access Request
    description: "\nConsumers can create an access request to request access to a\
      \ provider’s resource.\n\nWhen an access request is created:\n\n- The request\
      \ status is set to `PENDING`\n- The provider is notified\n\n## Important Rules\n\
      \n- A consumer cannot create an access request for their own resource.\n- If\
      \ an ACTIVE policy already exists for the consumer and resource,\n  the request\
      \ will be rejected with `409 Conflict`.\n\n## Request Lifecycle\n\n- `PENDING`\
      \ → Awaiting provider action\n- `GRANTED` → Policy is created automatically\n\
      - `REJECTED` → No policy is created\n\nThe request does not grant access by\
      \ itself. Access is granted only\nwhen the provider approves the request."
    operationId: post-auth-v2-access-requests
    requestBody:
      description: '- `itemId` : The catalogue ID of the asset for which the request
        is to be created

        - `requestType` : The type of usage of asset

        '
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
            properties:
              itemId:
                type: string
                format: uuid
                pattern: ^[0-9a-f]{8}\b-[0-9a-f]{4}\b-[0-9a-f]{4}\b-[0-9a-f]{4}\b-[0-9a-f]{12}$
              requestType:
                enum:
                - DOWNLOAD
                minLength: 1
              additionalInfo:
                description: Used to define additional information to access data
                  for educational, research or testing, non-commercial, academia purposes
                type: object
                minProperties: 1
                maxProperties: 10
              constraints:
                type: object
                description: Optional access constraints requested by the consumer
                additionalProperties: true
            required:
            - itemId
            - requestType
            x-examples:
              example-1:
                itemId: b34eb955-c691-4fd3-b200-f18bc78810a2
                requestType: DOWNLOAD
          examples:
            Create Access Request:
              value:
                itemId: b34eb955-c691-4fd3-b200-f18bc78810a2
                requestType: DOWNLOAD
            Create Access Request with additionalInfo:
              value:
                itemId: b34eb955-c691-4fd3-b200-f18bc78810a2
                requestType: DOWNLOAD
                additionalInfo:
                  name: Miles Davis
                  email: miles@davis.org
                  phone: 987654321
                  purpose: testing
                  description: The resource would be used for testing the abcd application
                    in which services are offered free of cost for public welfare
                constraints:
                  subjects:
                    allowedOrgIds:
                    - <uuid>
                    - <uuid>
                    allowedUserIds:
                    - <uuid>
                    allowedRoles:
                    - consumer
                  access:
                  - accessType: api
                    expiry: 1735689600
                    limits:
                      dataUsage: 100:gb
                      apiHits: 100
                  - accessType: sub
                    expiry: 1735689600
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/createNotificationSuccessResponse
        headers:
          Content-Type:
            schema:
              type: string
            description: application/json
      '400':
        description: 'Bad Request

          - Schema validation, missing or incorrect fields & values'
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/generalBadRequest
            examples:
              Example:
                value:
                  type: urn:dx:AclApdApd:badRequest
                  title: Bad Request
                  detail: Request could not be created, as the item type is invalid
        headers:
          Content-Type:
            schema:
              type: string
            description: application/json
      '401':
        description: 'Unauthorized

          - `token` invalid/expired

          - A user with non-consumer role trying to create a request'
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Unauthorized
        headers:
          Content-Type:
            schema:
              type: string
            description: application/json
      '403':
        description: 'Forbidden

          - User cannot create access request for the resource, as the user is a provider
          of the resource'
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/createNotificationForbidden
        headers:
          Content-Type:
            schema:
              type: string
            description: application/json
      '404':
        description: 'Not Found

          - Resource not found in Data Exchange Catalogue Server'
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/createNotificationResourceNotFoundResponse
        headers:
          Content-Type:
            schema:
              type: string
            description: application/json
      '409':
        description: 'Conflict

          - The policy or request for the given resource was previously created'
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/createNotificationConflictResponse
        headers:
          Content-Type:
            schema:
              type: string
            description: application/json
    security:
    - authorization: []
    x-codeSamples:
    - lang: cURL
      label: Create access request
      source: "curl --location --request POST 'https://${HOSTNAME}/iudx/acl/apd/v2/access_request'\
        \ \\\n  --header 'Authorization: <tokenValue>' \\\n  --header 'Content-Type:\
        \ application/json' \\\n  --data-raw '<payload>'\n\n- lang: cURL\nlabel: Create\
        \ access request with additional info\nsource: |\ncurl --location --request\
        \ POST 'https://${HOSTNAME}/iudx/acl/apd/v2/access_request' \\\n  --header\
        \ 'Authorization: <tokenValue>' \\\n  --header 'Content-Type: application/json'\
        \ \\\n  --data-raw '<payload>'\n"
  put:
    tags:
    - Access Request
    summary: Update Access Request
    description: '

      Providers or authorized delegates can approve or reject **PENDING**

      access requests for resources they own.


      ## If Approved (`status = granted`)


      - The request status is updated to `GRANTED`

      - A new policy is created with status = `ACTIVE`

      - A corresponding access rule is created

      - The policy and rule will expire based on the provided `expiryAt`

      - Constraints provided in this request override consumer-suggested constraints


      ## If Rejected (`status = rejected`)


      - The request status is updated to `REJECTED`

      - No policy is created

      - No access rule is created


      ## Important


      - Only requests in `PENDING` state can be updated

      - Providers can only act on requests for resources they own'
    operationId: put-auth-v2-access-requests
    requestBody:
      description: '- `requestId` :  ID of the request. Can get this `id` by using
        the GET Access request API.

        - `status` : The `provider` or `provider delegate` can update the status to
        `granted` or `rejected`.

        - `expiryAt` : expiration time stamp with ISO 8601 format to provide access
        to the given asset (Only present for the granted requests).'
      required: true
      content:
        application/json:
          schema:
            oneOf:
            - title: approve access request
              additionalProperties: true
              type: object
              properties:
                requestId:
                  type: string
                  format: uuid
                  pattern: ^[0-9a-f]{8}\b-[0-9a-f]{4}\b-[0-9a-f]{4}\b-[0-9a-f]{4}\b-[0-9a-f]{12}$
                status:
                  type: string
                  enum:
                  - granted
                expiryAt:
                  type: string
                  description: ISO 8601 format timestamp to provide access to the
                    given asset
                constraints:
                  type: object
                  description: Access constraints that the provider can apply (e.g.,
                    allowed access types)
                  additionalProperties: true
              required:
              - requestId
              - status
            - title: reject access request
              additionalProperties: false
              type: object
              properties:
                requestId:
                  type: string
                  format: uuid
                  pattern: ^[0-9a-f]{8}\b-[0-9a-f]{4}\b-[0-9a-f]{4}\b-[0-9a-f]{4}\b-[0-9a-f]{12}$
                status:
                  type: string
                  enum:
                  - rejected
              required:
              - requestId
              - status
            x-examples:
              example-1:
                requestId: bca11712-f381-46a5-afa3-a29b00568ace
                status: granted
                expiryAt: '2026-03-05T20:00:19'
          examples:
            Update Approved access request:
              value:
                requestId: bca11712-f381-46a5-afa3-a29b00568ace
                status: granted
                expiryAt: '2026-03-05T20:00:19'
                constraints:
                  subjects:
                    allowedOrgIds:
                    - <uuid>
                    - <uuid>
                    allowedUserIds:
                    - <uuid>
                    allowedRoles:
                    - consumer
                  access:
                  - accessType: api
                    expiry: 1735689600
                    limits:
                      dataUsage: 100:gb
                      apiHits: 100
                  - accessType: file
                    expiry: 1735689600
                    limits:
                      dataUsage: 10:gb
            Update Rejected access request:
              value:
                requestId: bca11712-f381-46a5-afa3-a29b00568ace
                status: rejected
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/UpdateAccessRequest
            examples:
              Update:
                value:
                  type: urn:dx:AclApdApd:success
                  title: Success
                  detail: Request updated successfully
        headers:
          Content-Type:
            schema:
              type: string
            description: application/json
      '400':
        description: Bad Request- Schema validation, missing or incorrect fields &
          values
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/updateNotificationBadRequest
        headers:
          Content-Type:
            schema:
              type: string
            description: application/json
      '404':
        description: '- Not Found'
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/updateNotificationNotFound
        headers:
          Content-Type:
            schema:
              type: string
            description: application/json
      '401':
        description: '- Unauthorized - `token` invalid/expired'
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Unauthorized
        headers:
          Content-Type:
            schema:
              type: string
            description: application/json
      '403':
        description: 'Forbidden

          - User does not own the asset or item for which access request is being
          granted or rejected'
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/updateNotificationForbiddenResponse
        headers:
          Content-Type:
            schema:
              type: string
            description: application/json
    security:
    - authorization: []
    x-codeSamples:
    - lang: cURL
      label: Reject access request
      source: "curl --location --request PUT 'https://${HOSTNAME}/iudx/acl/apd/v2/policies/requests'\
        \ \\\n--header 'Authorization: <tokenValue>' \\\n--header 'Content-Type: application/json'\
        \ \\\n  --data-raw '<payload>'\n"
    - lang: cURL
      label: Approve access request
      source: "curl --location --request PUT 'https://${HOSTNAME}/iudx/acl/apd/v2/policies/requests'\
        \ \\\n--header 'Authorization: <tokenValue>' \\\n--header 'Content-Type: application/json'\
        \ \\\n  --data-raw '<payload>'\n"
