/iudx/acl/apd/v2/policy:
  post:
    tags:
      - Policies
    summary: Create Policy
    operationId: post-auth-v1-policies
    description: |
      Creates one or more access policies for resources owned by the provider.

      This API allows a `provider` or `org_admin`
      to define fine-grained access control rules for resources,
      AI models.

      A policy determines:
      - Who can access a resource
      - How the resource can be accessed
      - Access validity duration
      - Usage restrictions and limits

      Each successfully created policy is stored with status `ACTIVE`
      and internally linked to one or more access rules used during
      authorization and policy verification.

      ---

      ## Supported Policy Types

      The API supports two policy models.

      ### 1. INDIVIDUAL Policy

      An `INDIVIDUAL` policy grants access directly to a specific user.

      Characteristics:
      - `userId` is mandatory
      - Access evaluation is performed using the provided `userId`
      - `constraints.subjects` is optional
      - Commonly used for granting access to a single consumer

      Example use cases:
      - Granting access to a specific customer
      - Providing temporary trial access
      - Issuing subscription access to a single user

      ### 2. GROUP Policy

      A `GROUP` policy grants access to users matching one or more
      subject constraints.

      Characteristics:
      - `userId` is not required
      - `constraints.subjects` is mandatory
      - Access evaluation is performed using subject matching
      - Supports organization-level and role-based access control

      Example use cases:
      - Granting access to all users of an organization
      - Allowing all users with the `consumer` role
      - Allowing access to a predefined user group

      ---

      ## Policy Lifecycle

      ### ACTIVE

      When a policy is successfully created:
      - Policy status is set to `ACTIVE`
      - Associated access rules are also created as `ACTIVE`

      ACTIVE policies participate in authorization checks.

      ### DELETED

      When a policy is deleted:
      - Policy status becomes `DELETED`
      - All associated access rules are also marked `DELETED`

      Deleted policies are ignored during authorization evaluation.

      ### EXPIRED

      Policy expiry does not modify the stored database status.

      During authorization:
      - The system validates whether `expiryTime`
        is greater than the current timestamp
      - Expired policies are treated as inactive
      - The stored status remains unchanged

      ---

      ## Batch Policy Creation

      The request body contains a `request` array.

      Each element in the array represents an independent
      policy creation request.

      The API supports batch policy creation, allowing multiple
      policies to be created in a single API call.

      Validation is performed independently for each request object.

      ---

      ## Item Types

      ### DATABANK

      Policy applies to individual resources or datasets.

      ### AIMODEL

      Policy applies to AI models

      ---

      ## Constraints Evaluation

      The `constraints` object defines authorization rules.

      A policy may contain:

      - `subjects`
        Defines who is eligible to access the resource

      - `access`
        Defines how the resource may be accessed

      ### subjects

      Subject constraints are used during authorization evaluation.

      Access is granted when the requesting entity matches
      one or more configured subject conditions.

      Supported subject filters:

      - `allowedOrgIds`
        List of permitted organization IDs

      - `allowedUserIds`
        List of permitted user IDs

      - `allowedRoles`
        List of permitted platform roles

      `subjects` is mandatory for `GROUP` policies.

      ### access

      Defines supported access mechanisms.

      Supported access types:

      - `api`
        API-based access

      - `file`
        File download access

      - `sub`
        Subscription or streaming access

      Each access entry may additionally define:

      - `expiry`
        Expiry timestamp in epoch seconds

      - `limits`
        Optional usage restrictions such as:
        - `apiHits`
        - `dataUsage`

      ---

      ## Validation Rules

      ### INDIVIDUAL Policy

      Requires:
      - `policyType = INDIVIDUAL`
      - `userId`

      ### GROUP Policy

      Requires:
      - `policyType = GROUP`
      - `constraints.subjects`

      ### Duplicate Policy Restriction

      Only one ACTIVE policy may exist for the
      same policy scope.

      If a conflicting ACTIVE policy already exists,
      the API returns `409 Conflict`.

      ---

      ## Authorization Requirements

      This API may only be invoked by:

      - A `provider`
      - An `org_admin`

      Additionally:
      - The caller must own the resource
      - Or belong to the organization that owns the resource
    parameters:
      - name: Authorization
        in: header
        description: DX Auth issued identity token
        required: true
        schema:
          type: string
          minLength: 1
          pattern: Bearer [a-zA-Z0-9_*\-*\.\/]+$|^[a-zA-Z0-9_*\-*\.\/]+$
    requestBody:
      description: "**Request Body Details:**\n\n  The request body should be a JSON\
        \ object containing a JSON array of request.\n\n  ### User Policy Request:\n\
        \n  - `userId`: The ID of the user for whom the policy is being defined.\n\
        \  - `itemId`: The UUID value of the item for which the policy is being established.\n\
        \  - `itemType`: An enum value representing the type of the item.\n  - `expiryTime`:\
        \ An optional field, representing the policy's expiry time in ISO8601 format\
        \ compatible with UTC (yyyy-MM-dd'T'HH:mm:ss). If not provided, a default\
        \ expiry time is set for the policy.\n  - `constraints`: JSON object defining\
        \ subjects and access controls.\n### Constraints Structure:\n`constraints`\
        \ may contain:\n- `subjects`\n  - allowedOrgIds\n  - allowedUserIds\n  - allowedRoles\n\
        \      \n- `access` (array)\n  - accessType: api | file | sub\n  - expiry\
        \ (epoch seconds)\n  - limits (optional, varies per accessType)\n"
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              request:
                type: array
                minItems: 1
                items:
                  oneOf:
                    - $ref: '../components/schemas.yaml#/IndividualPolicyRequest'
                    - $ref: '../components/schemas.yaml#/GroupPolicyRequest'
            required:
              - request
            x-examples:
              example-1:
                request:
                  - userId: <uuid>
                    policyType: GROUP
                    itemId: example-resource-group
                    itemType: DATABANK
                    expiryTime: '2023-08-30T21:10:06'
                    constraints:
                      subjects:
                        allowedOrgIds:
                          - <uuid>
                          - <uuid>
                        allowedUserIds:
                          - <uuid>
                        allowedRoles:
                          - consumer
                      access:
                        - accessType: api
                          expiry: 1735689600
                          limits:
                            dataUsage: 100:gb
                            apiHits: 100
                        - accessType: file
                          expiry: 1735689600
                          limits:
                            dataUsage: 10:gb
                        - accessType: sub
                          expiry: 1735689600
                  - userId: <uuid>
                    itemId: example-resource-group
                    itemType: DATABANK
                    expiryTime: '2023-08-30T21:10:06'
                    constraints:
                      subjects:
                        allowedOrgIds:
                          - <uuid>
                          - <uuid>
                        allowedUserIds:
                          - <uuid>
                        allowedRoles:
                          - consumer
                      access:
                        - accessType: api
                          expiry: 1735689600
                          limits:
                            dataUsage: 100:gb
                            apiHits: 100
                        - accessType: file
                          expiry: 1735689600
                          limits:
                            dataUsage: 10:gb
                        - accessType: sub
                          expiry: 1735689600
          examples:
            Request for resource with additionalInfo:
              value:
                request:
                    policyType: GROUP
                    itemId: b34eb955-c691-4fd3-b200-f18bc78810a2
                    itemType: DATABANK
                    expiryTime: '2022-08-04T20:00:19'
                    constraints:
                      subjects:
                        allowedOrgIds:
                          - <uuid>
                          - <uuid>
                        allowedUserIds:
                          - <uuid>
                        allowedRoles:
                          - consumer
                      access:
                        - accessType: api
                          expiry: 1735689600
                          limits:
                            dataUsage: 100:gb
                            apiHits: 100
                        - accessType: file
                          expiry: 1735689600
                          limits:
                            dataUsage: 10:gb
                        - accessType: sub
                          expiry: 1735689600
                    additionalInfo:
                      name: Miles Davis
                    providerComment: The resource is used for transportation data analysis
                    feedbackToConsumer: This resource can be used for testing purposes
            Request for resource user policy:
              value:
                request:
                    policyType: GROUP
                    itemId: b34eb955-c691-4fd3-b200-f18bc78810a2
                    itemType: DATABANK
                    expiryTime: '2022-10-10T04:00:19'
                    constraints:
                      subjects:
                        allowedOrgIds:
                          - <uuid>
                          - <uuid>
                        allowedUserIds:
                          - <uuid>
                        allowedRoles:
                          - consumer
                      access:
                        - accessType: api
                          expiry: 1735689600
                          limits:
                            dataUsage: 100:gb
                            apiHits: 100
                        - accessType: file
                          expiry: 1735689600
                          limits:
                            dataUsage: 10:gb
                        - accessType: sub
                          expiry: 1735689600
    responses:
      '200':
        description: The policy has been successfully created.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/createPolicySuccessResponse
      '400':
        description: '- Missing or malformed data

          - Invalid expiry - dateTime in the past or invalid format

          - Invalid user - UserId is not present in db'
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/createPolicyBadRequest
        headers:
          Content-Type:
            schema:
              type: string
            description: application/json
      '401':
        description: '- Unauthorized - `token` invalid/expired'
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Unauthorized
        headers:
          Content-Type:
            schema:
              type: string
            description: application/json
      '403':
        description: |
          - If the user trying to create a policy does not have a `provider`
            or `org_admin` role.

          - If the user is neither the owner of the resource item
            nor belongs to the organization that owns the databank item/ ai model.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/createPolicyForbidden
        headers:
          Content-Type:
            schema:
              type: string
            description: application/json
      '409':
        description: '- If a valid policy already exists.'
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/conflictResponse
    security:
      - authorization: []
    x-codeSamples:
      - lang: cURL
        label: Create INDIVIDUAL Policy
        source: "curl --location 'https://${HOSTNAME}/iudx/acl/apd/v2/policy' \\\n--header\
        \ 'Authorization: Bearer <tokenValue>' \\\n--header 'Content-Type: application/json'\
        \ \\\n--data-raw '{\n  \"request\": [\n    {\n      \"policyType\": \"INDIVIDUAL\"\
        ,\n      \"userId\": \"5067611f-0835-4cee-9b3e-fe81adab65f1\",\n      \"itemId\"\
        : \"5011676f-0835-4cee-9b3e-fe81adab65f1\",\n      \"itemType\": \"DATABANK\"\
        ,\n      \"expiryTime\": \"2026-08-04T20:00:19Z\",\n      \"constraints\"\
        : {\n        \"access\": [\n          {\n            \"accessType\": \"api\"\
        ,\n            \"expiry\": 1785873619,\n            \"limits\": {\n      \
        \        \"apiHits\": 1000,\n              \"dataUsage\": \"100:gb\"\n   \
        \         }\n          },\n          {\n            \"accessType\": \"file\"\
        ,\n            \"expiry\": 1785873619,\n            \"limits\": {\n      \
        \        \"dataUsage\": \"10:gb\"\n            }\n          }\n        ]\n\
        \      },\n      \"providerComment\": \"Access granted for analytics usage\"\
        ,\n      \"feedbackToConsumer\": \"Use only for internal testing\"\n    }\n\
        \  ]\n}'\n"
      - lang: cURL
        label: Create GROUP Policy
        source: "curl --location 'https://${HOSTNAME}/iudx/acl/apd/v2/policy' \\\n--header\
        \ 'Authorization: Bearer <tokenValue>' \\\n--header 'Content-Type: application/json'\
        \ \\\n--data-raw '{\n  \"request\": [\n    {\n      \"policyType\": \"GROUP\"\
        ,\n      \"itemId\": \"7f1f6f2d-6b6e-45c0-98a8-cdc8d3db0aa1\",\n      \"itemType\"\
        : \"DATABANK\",\n      \"expiryTime\": \"2026-12-31T23:59:59Z\",\n      \"\
        constraints\": {\n        \"subjects\": {\n          \"allowedOrgIds\": [\n\
        \            \"2ef0f344-dc41-4369-a50b-1515a0db5db2\"\n          ],\n    \
        \      \"allowedRoles\": [\n            \"consumer\"\n          ]\n      \
        \  },\n        \"access\": [\n          {\n            \"accessType\": \"\
        api\",\n            \"expiry\": 1785873619,\n            \"limits\": {\n \
        \             \"apiHits\": 5000\n            }\n          },\n          {\n\
        \            \"accessType\": \"sub\",\n            \"expiry\": 1785873619\n\
        \          }\n        ]\n      },\n      \"providerComment\": \"Organization-wide\
        \ access for subscribed consumers\"\n    }\n  ]\n}'\n"
  put:
    tags:
      - Policies
    summary: Deactivate Policy
    description: |
      This API performs a **soft delete** of an existing ACTIVE policy.

      Instead of permanently removing the policy from the system:

      - The policy status is updated from `ACTIVE` → `DELETE`
      - All access rules associated with the policy are also updated to `DELETE`
      - The policy record is retained for audit and traceability purposes

      ## Who Can Delete

      - The resource `provider or org_admin of that organization`
      - The policy must exist
      - The policy must belong to the requesting provider or, in case of an `org_admin`, to their organization
      - The policy must currently be in `ACTIVE` state

      ## Effects

      - Access granted via this policy is immediately revoked
      - The policy cannot be reactivated via this API (a new policy must be created)

      Users can retrieve the policy ID using the GET Policies API.
    operationId: deactivate-auth-v1-policies
    parameters:
      - name: Authorization
        in: header
        description: DX Auth issued identity token
        required: true
        schema:
          type: string
          minLength: 1
          pattern: Bearer [a-zA-Z0-9_*\-*\.\/]+$|^[a-zA-Z0-9_*\-*\.\/]+$
      - name: id
        in: query
        description: ID of the DX Entity
        required: true
        schema:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}\b-[0-9a-f]{4}\b-[0-9a-f]{4}\b-[0-9a-f]{4}\b-[0-9a-f]{12}$
    responses:
      '200':
        description: Policy deactivated successfully.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/deletePolicy
        headers:
          Content-Type:
            schema:
              type: string
            description: application/json
      '400':
        description: 'Bad Request

          - Id is not a valid policyId

          - Policy has expired

          - Policy was previously deleted'
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/deletePolicyErrorResponse
        headers:
          Content-Type:
            schema:
              type: string
            description: application/json
      '401':
        description: "Unauthorized\n  - `token` invalid/expired"
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/deletePolicyNotFoundErrorResponse
        headers:
          Content-Type:
            schema:
              type: string
            description: application/json
      '404':
        description: "Not Found\n  - Policy id does not exist"
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Unauthorized
        headers:
          Content-Type:
            schema:
              type: string
            description: application/json
    security:
      - authorization: []
    x-codeSamples:
      - lang: cURL
        label: Deactivate policy
        source: 'curl --location --request PUT \

        ''https://${HOSTNAME}/iudx/acl/apd/v2/policy?id=231f6eca-6276-4993-bfeb-53cbbbba6f06''
        \

        --header ''Authorization: <tokenValue>''

        '
/iudx/acl/apd/v2/policy/consumer:
  get:
    tags:
      - Policies
    operationId: get-policies-consumer-api
    summary: List Consumer Policies
    description: 'Lists all policies applicable to the consumer calling the API.

      '
    security:
      - authorization: []
    parameters:
      - name: status
        in: query
        description: Status of the policy. Displays all the policies if status is not
          specified
        required: false
        schema:
          type: string
          enum:
            - ACTIVE
            - DELETED
      - name: organizationId
        in: query
        description: Filter policies by organization ID of the asset. Displays all policies
          if not specified.
        required: false
        schema:
          type: string
      - $ref: ../components/parameters.yaml#/PageParam
      - $ref: ../components/parameters.yaml#/SizeParam
      - $ref: ../components/parameters.yaml#/SortingParam
      - $ref: ../components/parameters.yaml#/TimeParam
      - $ref: ../components/parameters.yaml#/EndTimeParam
      - $ref: ../components/parameters.yaml#/TimeRelParam
    responses:
      '200':
        description: Successfully fetched consumer policies
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/PolicyListResponse
      '401':
        description: Unauthorized
