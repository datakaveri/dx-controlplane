/iudx/acl/apd/v2/policy:
  post:
    tags:
      - Policies
    summary: Create Policy
    operationId: post-auth-v1-policies
    description: |
      Creates one or more ACTIVE access policies for DATABANK, AIMODEL resources.

      This API can be invoked by:

      - The resource owner (`provider`)
      - An `org_admin` belonging to the same organization as the resource

      A policy defines:

      - Who can access the resource
      - Which access types are allowed
      - Optional usage limits and expiry conditions

      ## Policy Types

      ### INDIVIDUAL

      Grants access to a specific user.

      - `userId` is required
      - Access is evaluated for the specified user

      ### GROUP

      Grants access to users matching subject criteria.

      - `constraints.subjects` is required
      - Supports organization, user, and role-based access control

      When `constraints.subjects` is provided, the system automatically creates
      access rules linked to the policy for subject-based authorization.

      ## Access Types

      Access types are defined under `constraints.access`.

      Supported values depend on the resource metadata and may include:

      - `api`
      - `file`
      - `sub`

      Each requested access type must be supported by the resource.
      Otherwise the request is rejected with `400 Bad Request`.

      ## Batch Creation

      Multiple policies may be created in a single request using the `request` array.

      Each policy request is validated independently.

      ## Conflict Behaviour

      Only one ACTIVE policy may exist for the same resource and access type combination.

      If an ACTIVE policy already exists for any requested access type,
      the API returns `409 Conflict`.

      Example:

      - Existing policy: `api`
      - New policy request: `api`, `file`

      Result:

      - Conflict for `api`
      - Request is rejected

      ## Restrictions
      - Resource ownership is mandatory for providers
      - `org_admin` users may manage only resources belonging to their organization
    parameters:
      - name: Authorization
        in: header
        description: DX Auth issued identity token
        required: true
        schema:
          type: string
          minLength: 1
          pattern: Bearer [a-zA-Z0-9_*\-*\.\/]+$|^[a-zA-Z0-9_*\-*\.\/]+$
    requestBody:
      description: "**Request Body Details:**\n\n  The request body should be a JSON\
        \ object containing a JSON array of request.\n\n  ### User Policy Request:\n\
        \n  - `userId`: The ID of the user for whom the policy is being defined.\n\
        \  - `itemId`: The UUID value of the item for which the policy is being established.\n\
        \  - `itemType`: An enum value representing the type of the item.\n  - `expiryTime`:\
        \ An optional field, representing the policy's expiry time in ISO8601 format\
        \ compatible with UTC (yyyy-MM-dd'T'HH:mm:ss). If not provided, a default\
        \ expiry time is set for the policy.\n  - `constraints`: JSON object defining\
        \ subjects and access controls.\n### Constraints Structure:\n`constraints`\
        \ may contain:\n- `subjects`\n  - allowedOrgIds\n  - allowedUserIds\n  - allowedRoles\n\
        \      \n- `access` (array)\n  - accessType: api | file | sub\n  - expiry\
        \ (epoch seconds)\n  - limits (optional, varies per accessType)\n"
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              request:
                type: array
                minItems: 1
                items:
                  oneOf:
                    - $ref: '../components/schemas.yaml#/IndividualPolicyRequest'
                    - $ref: '../components/schemas.yaml#/GroupPolicyRequest'
            required:
              - request
            x-examples:
              example-1:
                request:
                  - userId: <uuid>
                    policyType: GROUP
                    itemId: example-resource-group
                    itemType: DATABANK
                    expiryTime: '2023-08-30T21:10:06'
                    constraints:
                      subjects:
                        allowedOrgIds:
                          - <uuid>
                          - <uuid>
                        allowedUserIds:
                          - <uuid>
                        allowedRoles:
                          - consumer
                      access:
                        - accessType: api
                          expiry: '2026-03-05T20:00:19'
                          limits:
                            dataUsage: 100:gb
                            apiHits: 100
                        - accessType: file
                          expiry: '2026-03-05T20:00:19'
                          limits:
                            dataUsage: 10:gb
                        - accessType: sub
                          expiry: '2026-03-05T20:00:19'
                  - userId: <uuid>
                    itemId: example-resource-group
                    itemType: DATABANK
                    expiryTime: '2023-08-30T21:10:06'
                    constraints:
                      subjects:
                        allowedOrgIds:
                          - <uuid>
                          - <uuid>
                        allowedUserIds:
                          - <uuid>
                        allowedRoles:
                          - consumer
                      access:
                        - accessType: api
                          expiry: '2026-03-05T20:00:19'
                          limits:
                            dataUsage: 100:gb
                            apiHits: 100
                        - accessType: file
                          expiry: '2026-03-05T20:00:19'
                          limits:
                            dataUsage: 10:gb
                        - accessType: sub
                          expiry: '2026-03-05T20:00:19'
          examples:
            Request for resource with additionalInfo:
              value:
                request:
                    policyType: GROUP
                    itemId: b34eb955-c691-4fd3-b200-f18bc78810a2
                    itemType: DATABANK
                    expiryTime: '2022-08-04T20:00:19'
                    constraints:
                      subjects:
                        allowedOrgIds:
                          - <uuid>
                          - <uuid>
                        allowedUserIds:
                          - <uuid>
                        allowedRoles:
                          - consumer
                      access:
                        - accessType: api
                          expiry: '2026-03-05T20:00:19'
                          limits:
                            dataUsage: 100:gb
                            apiHits: 100
                        - accessType: file
                          expiry: '2026-03-05T20:00:19'
                          limits:
                            dataUsage: 10:gb
                        - accessType: sub
                          expiry: '2026-03-05T20:00:19'
                    additionalInfo:
                      name: Miles Davis
                    providerComment: The resource is used for transportation data analysis
                    feedbackToConsumer: This resource can be used for testing purposes
            Request for resource user policy:
              value:
                request:
                    policyType: GROUP
                    itemId: b34eb955-c691-4fd3-b200-f18bc78810a2
                    itemType: DATABANK
                    expiryTime: '2022-10-10T04:00:19'
                    constraints:
                      subjects:
                        allowedOrgIds:
                          - <uuid>
                          - <uuid>
                        allowedUserIds:
                          - <uuid>
                        allowedRoles:
                          - consumer
                      access:
                        - accessType: api
                          expiry: '2026-03-05T20:00:19'
                          limits:
                            dataUsage: 100:gb
                            apiHits: 100
                        - accessType: file
                          expiry: '2026-03-05T20:00:19'
                          limits:
                            dataUsage: 10:gb
                        - accessType: sub
                          expiry: '2026-03-05T20:00:19'
    responses:
      '200':
        description: The policy has been successfully created.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/createPolicySuccessResponse
      '400':
        description: '- Missing or malformed data

          - Invalid expiry - dateTime in the past or invalid format

          - Invalid user - UserId is not present in db'
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/createPolicyBadRequest
        headers:
          Content-Type:
            schema:
              type: string
            description: application/json
      '401':
        description: '- Unauthorized - `token` invalid/expired'
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Unauthorized
            example:
              type: urn:dx:aclApd:notAuthorized
              title: Not Authorized
              detail: Missing or invalid Bearer token
        headers:
          Content-Type:
            schema:
              type: string
            description: application/json
      '403':
        description: |
          - If the user trying to create a policy does not have a `provider`
            or `org_admin` role.

          - If the user is neither the owner of the resource item
            nor belongs to the organization that owns the databank item/ ai model.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/createPolicyForbidden
            example:
              type: urn:dx:aclApd:forbidden
              title: Forbidden
              detail: User does not have the required role.
        headers:
          Content-Type:
            schema:
              type: string
            description: application/json
      '409':
        description: |
          Conflict

          An ACTIVE policy already exists for one or more requested access types.

          Policies are validated per access type. A duplicate ACTIVE policy
          cannot be created for the same resource and access type combination.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/conflictResponse
    security:
      - authorization: []
    x-codeSamples:
      - lang: cURL
        label: Create INDIVIDUAL Policy
        source: |
          curl --location 'https://${HOSTNAME}/iudx/acl/apd/v2/policy' \
          --header 'Authorization: Bearer <tokenValue>' \
          --header 'Content-Type: application/json' \
          --data-raw '{
            "request": [
              {
                "policyType": "INDIVIDUAL",
                "userId": "5067611f-0835-4cee-9b3e-fe81adab65f1",
                "itemId": "5011676f-0835-4cee-9b3e-fe81adab65f1",
                "itemType": "DATABANK",
                "expiryTime": "2026-08-04T20:00:19Z",
                "constraints": {
                  "access": [
                    {
                      "accessType": "api",
                      "expiry": 1785873619,
                      "limits": {
                        "apiHits": 1000,
                        "dataUsage": "100:gb"
                      }
                    },
                    {
                      "accessType": "file",
                      "expiry": 1785873619,
                      "limits": {
                        "dataUsage": "10:gb"
                      }
                    }
                  ]
                },
                "providerComment": "Access granted for analytics usage",
                "feedbackToConsumer": "Use only for internal testing"
              }
            ]
          }'

      - lang: cURL
        label: Create GROUP Policy
        source: |
          curl --location 'https://${HOSTNAME}/iudx/acl/apd/v2/policy' \
          --header 'Authorization: Bearer <tokenValue>' \
          --header 'Content-Type: application/json' \
          --data-raw '{
            "request": [
              {
                "policyType": "GROUP",
                "itemId": "7f1f6f2d-6b6e-45c0-98a8-cdc8d3db0aa1",
                "itemType": "DATABANK",
                "expiryTime": "2026-12-31T23:59:59Z",
                "constraints": {
                  "subjects": {
                    "allowedOrgIds": [
                      "2ef0f344-dc41-4369-a50b-1515a0db5db2"
                    ],
                    "allowedRoles": [
                      "consumer"
                    ]
                  },
                  "access": [
                    {
                      "accessType": "api",
                      "expiry": 1785873619,
                      "limits": {
                        "apiHits": 5000
                      }
                    },
                    {
                      "accessType": "sub",
                      "expiry": 1785873619
                    }
                  ]
                },
                "providerComment": "Organization-wide access for subscribed consumers"
              }
            ]
          }'
  put:
    tags:
      - Policies
    summary: Delete Policy
    description: |
      This API performs a **soft delete** of an existing ACTIVE policy.

      Instead of permanently removing the policy from the system:

      - The policy status is updated from `ACTIVE` → `DELETE`
      - All access rules associated with the policy are also updated to `DELETE`
      - The policy record is retained for audit and traceability purposes

      ## Who Can Delete

      - The resource `provider or org_admin of that organization`
      - The policy must exist
      - The policy must belong to the requesting provider or, in case of an `org_admin`, to their organization
      - The policy must currently be in `ACTIVE` state

      ## Effects

      - Access granted via this policy is immediately revoked
      - The policy cannot be reactivated via this API (a new policy must be created)

      Users can retrieve the policy ID using the GET Policies API.
    operationId: deactivate-auth-v1-policies
    parameters:
      - name: Authorization
        in: header
        description: DX Auth issued identity token
        required: true
        schema:
          type: string
          minLength: 1
          pattern: Bearer [a-zA-Z0-9_*\-*\.\/]+$|^[a-zA-Z0-9_*\-*\.\/]+$
      - name: id
        in: query
        description: ID of the DX Entity
        required: true
        schema:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}\b-[0-9a-f]{4}\b-[0-9a-f]{4}\b-[0-9a-f]{4}\b-[0-9a-f]{12}$
    responses:
      '200':
        description: Policy deleted successfully.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/deletePolicy
        headers:
          Content-Type:
            schema:
              type: string
            description: application/json
      '400':
        description: 'Bad Request

          - Id is not a valid policyId

          - Policy has expired

          - Policy was previously deleted'
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/deletePolicyErrorResponse
        headers:
          Content-Type:
            schema:
              type: string
            description: application/json
      '401':
        description: "Unauthorized\n  - `token` invalid/expired"
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/deletePolicyNotFoundErrorResponse
            example:
              type: urn:dx:aclApd:notAuthorized
              title: Not Authorized
              detail: Missing or invalid Bearer token
        headers:
          Content-Type:
            schema:
              type: string
            description: application/json
      '403':
        description: |
          Forbidden
            - Policy does not belong to the user
            - User is not authorized to delete the policy
            - User is not an org admin of the policy owner's organization
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  example: dx:aclApd:forbidden
                title:
                  type: string
                  example: Forbidden
                detail:
                  type: string
                  example: Failure, as policy doesn't belong to the user or organisation
            example:
              type: urn:dx:aclApd:forbidden
              title: Forbidden
              detail: User does not have the required role.
        headers:
          Content-Type:
            schema:
              type: string
            description: application/json
      '404':
        description: "Not Found\n  - Policy id does not exist"
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Unauthorized
        headers:
          Content-Type:
            schema:
              type: string
            description: application/json
    security:
      - authorization: []
    x-codeSamples:
      - lang: cURL
        label: Delete policy
        source: |
          curl --location --request PUT \
            'https://${HOSTNAME}/iudx/acl/apd/v2/policy?id=231f6eca-6276-4993-bfeb-53cbbbba6f06' \
            --header 'Authorization: Bearer <tokenValue>'
/iudx/acl/apd/v2/policy/consumer:
  get:
    tags:
      - Policies
    operationId: get-policies-consumer-api
    summary: List Consumer Policies
    description: 'Lists all policies applicable to the consumer calling the API.

      '
    security:
      - authorization: []
    parameters:
      - name: status
        in: query
        description: Status of the policy. Displays all the policies if status is not
          specified
        required: false
        schema:
          type: string
          enum:
            - ACTIVE
            - DELETED
      - name: organizationId
        in: query
        description: Filter policies by organization ID of the asset. Displays all policies
          if not specified.
        required: false
        schema:
          type: string
      - name: ownerId
        in: query
        description: |
          Filter policies by the owner who created the policy.

          This parameter can be used to distinguish
          between policies created by different owners within the organization.

          If not specified, policies created by all owners within the organization
          are returned.
        required: false
        schema:
          type: string
          example: fffb1ea9-7c57-4f2c-b410-7b5a163166a0
      - $ref: ../components/parameters.yaml#/PageParam
      - $ref: ../components/parameters.yaml#/SizeParam
      - $ref: ../components/parameters.yaml#/SortingParam
      - $ref: ../components/parameters.yaml#/TimeParam
      - $ref: ../components/parameters.yaml#/EndTimeParam
      - $ref: ../components/parameters.yaml#/TimeRelParam
    responses:
      '200':
        description: Successfully fetched consumer policies
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/PolicyListResponse
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ErrorResponse
            example:
              type: urn:dx:aclApd:notAuthorized
              title: Not Authorized
              detail: Missing or invalid Bearer token
/iudx/acl/apd/v2/policy/organisation:
  get:
    tags:
      - Policies
    operationId: get-policies-org_admin-api
    summary: List Organization Policies
    description: |
      Lists the latest policies associated with assets belonging to the organization.

      Organization administrators can view policies created by both providers and
      organization administrators for assets within their organization.

      The optional `ownerId` query parameter can be used to filter policies by
      the policy creator.
    security:
      - authorization: []
    parameters:
      - name: status
        in: query
        description: Status of the policy. Displays all the policies if status is not
          specified
        required: false
        schema:
          type: string
          enum:
            - ACTIVE
            - DELETED
      - name: organizationId
        in: query
        description: Filter policies by organization ID of the asset. Displays all policies
          if not specified.
        required: false
        schema:
          type: string
      - name: ownerId
        in: query
        description: |
            Filter policies by the owner who created the policy.

            This parameter can be used by organization administrators to distinguish
            between policies created by different owners within the organization,
            such as provider-created policies and organization-admin-created policies.

            If not specified, policies created by all owners within the organization
            are returned.
        required: false
        schema:
          type: string
          example: fffb1ea9-7c57-4f2c-b410-7b5a163166a0
      - $ref: ../components/parameters.yaml#/PageParam
      - $ref: ../components/parameters.yaml#/SizeParam
      - $ref: ../components/parameters.yaml#/SortingParam
      - $ref: ../components/parameters.yaml#/TimeParam
      - $ref: ../components/parameters.yaml#/EndTimeParam
      - $ref: ../components/parameters.yaml#/TimeRelParam
    responses:
      '200':
        description: Successfully fetched organization policies
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/PolicyListResponse
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ErrorResponse
            example:
              type: urn:dx:aclApd:notAuthorized
              title: Not Authorized
              detail: Missing or invalid Bearer token
      '403':
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ErrorResponse
            example:
              type: urn:dx:aclApd:forbidden
              title: Forbidden
              detail: User does not have the required role.
