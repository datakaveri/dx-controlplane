/iudx/acl/apd/v2/policy:
  post:
    tags:
    - Policies
    summary: Create Policy
    description: "\nThe `Create Policy` API allows a `provider` or an authorized `delegate`\nto create an **ACTIVE access\
      \ policy** for a resource owned by the provider.\n\nWhen a policy is successfully created:\n\n- A new policy record\
      \ is created with status = `ACTIVE`\n- A corresponding access rule is created and linked to the policy\n- The rule inherits\
      \ the same lifecycle as the policy\n\n## Policy Lifecycle\n\n- On creation → Policy status = `ACTIVE`\n- On deletion\
      \ → Policy status = `DELETED`\n- On expiry → Policy remains `ACTIVE`, but is treated as invalid during verification\n\
      \n### Expiry Handling\n\nPolicy expiry does not modify the stored status.\n\nInstead, during policy verification:\n\
      - The system checks whether `expiryAt` is greater than the current timestamp.\n- If expired, the policy is treated as\
      \ inactive for access evaluation.\n- The database status remains unchanged.\n\n### Rule Synchronization\n\nWhen a policy\
      \ is marked as `DELETED`, all associated access rules are also marked as \n`DELETED`.\n\n## Item Types\n\n- `DATABANK`:\
      \ Policy applies to individual resources.\n- `AIMODEL`: Policy applies to resource groups.\n\n## Important Notes\n\n\
      - Only one policy can be created per request.\n- Only one ACTIVE policy can exist per (user, itemId).\n- If a valid\
      \ ACTIVE policy already exists, a `409 Conflict` is returned."
    operationId: post-auth-v1-policies
    parameters:
    - name: Authorization
      in: header
      description: DX Auth issued identity token
      required: true
      schema:
        type: string
        minLength: 1
        pattern: Bearer [a-zA-Z0-9_*\-*\.\/]+$|^[a-zA-Z0-9_*\-*\.\/]+$
    requestBody:
      description: "**Request Body Details:**\n\n  The request body should be a JSON object containing a JSON array of request.\n\
        \n  ### User Policy Request:\n\n  - `userEmail`: The email ID of the user for whom the policy is being defined.\n\
        \  - `itemId`: The UUID value of the item for which the policy is being established.\n  - `itemType`: An enum value\
        \ representing the type of the item.\n  - `expiryTime`: An optional field, representing the policy's expiry time in\
        \ ISO8601 format compatible with UTC (yyyy-MM-dd'T'HH:mm:ss). If not provided, a default expiry time is set for the\
        \ policy.\n  - `constraints`: JSON object defining subjects and access controls.\n### Constraints Structure:\n`constraints`\
        \ may contain:\n- `subjects`\n  - allowedOrgIds\n  - allowedUserIds\n  - allowedRoles\n      \n- `access` (array)\n\
        \  - accessType: api | file | sub\n  - expiry (epoch seconds)\n  - limits (optional, varies per accessType)\n"
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              request:
                type: array
                minItems: 1
                uniqueItems: true
                items:
                  type: object
                  additionalProperties: false
                  properties:
                    userEmail:
                      type: string
                      pattern: ^([a-zA-Z0-9_\-\.]+)@([a-zA-Z0-9_\-\.]+)\.([a-zA-Z]{2,5})$
                      minLength: 1
                    itemId:
                      type: string
                      pattern: ^[a-zA-Z0-9_*\-*\.\/]+$
                      minLength: 1
                      maxLength: 512
                    itemType:
                      enum:
                      - AIMODEL
                      - DATABANK
                      minLength: 1
                    expiryTime:
                      type: string
                      pattern: ^([\+-]?\d{4}(?!\d{2}\b))((-?)((0[1-9]|1[0-2])(\3([12]\d|0[1-9]|3[01]))?|W([0-4]\d|5[0-2])(-?[1-7])?|(00[1-9]|0[1-9]\d|[12]\d{2}|3([0-5]\d|6[1-6])))([T\s]((([01]\d|2[0-3])((:?)[0-5]\d)?|24\:?00)([\.,]\d+(?!:))?)?(\17[0-5]\d([\.,]\d+)?)?([zZ]|([\+-])([01]\d|2[0-3]):?([0-5]\d)?)?)?)?$
                      minLength: 1
                    constraints:
                      type: object
                    additionalInfo:
                      type: object
                      description: Additional information to access data for educational, research or testing, non-commercial,
                        academia purposes
                      minProperties: 0
                      maxProperties: 10
                    providerComment:
                      type: string
                      description: Comment from the provider regarding the resource item, which can be used to provide additional
                        information about the resource
                      minLength: 1
                      maxLength: 4000
                    feedbackToConsumer:
                      type: string
                      description: Feedback from the provider to the consumer regarding the resource item, which can be used
                        to provide additional information about the resource
                      maxLength: 4000
                      minLength: 1
                  required:
                  - userEmail
                  - itemId
                  - itemType
                  - constraints
            required:
            - request
            x-examples:
              example-1:
                request:
                - userEmail: pqr@abc.com
                  itemId: example-resource-group
                  itemType: DATABANK
                  expiryTime: '2023-08-30T21:10:06'
                  constraints:
                    subjects:
                      allowedOrgIds:
                      - <uuid>
                      - <uuid>
                      allowedUserIds:
                      - <uuid>
                      allowedRoles:
                      - consumer
                    access:
                    - accessType: api
                      expiry: 1735689600
                      limits:
                        dataUsage: 100:gb
                        apiHits: 100
                    - accessType: file
                      expiry: 1735689600
                      limits:
                        dataUsage: 10:gb
                    - accessType: sub
                      expiry: 1735689600
                - userEmail: test@demo.com
                  itemId: example-resource-group
                  itemType: DATABANK
                  expiryTime: '2023-08-30T21:10:06'
                  constraints:
                    subjects:
                      allowedOrgIds:
                      - <uuid>
                      - <uuid>
                      allowedUserIds:
                      - <uuid>
                      allowedRoles:
                      - consumer
                    access:
                    - accessType: api
                      expiry: 1735689600
                      limits:
                        dataUsage: 100:gb
                        apiHits: 100
                    - accessType: file
                      expiry: 1735689600
                      limits:
                        dataUsage: 10:gb
                    - accessType: sub
                      expiry: 1735689600
          examples:
            Request for resource with additionalInfo:
              value:
                request:
                - userEmail: abc@xyz.com
                  itemId: b34eb955-c691-4fd3-b200-f18bc78810a2
                  itemType: DATABANK
                  expiryTime: '2022-08-04T20:00:19'
                  constraints:
                    subjects:
                      allowedOrgIds:
                      - <uuid>
                      - <uuid>
                      allowedUserIds:
                      - <uuid>
                      allowedRoles:
                      - consumer
                    access:
                    - accessType: api
                      expiry: 1735689600
                      limits:
                        dataUsage: 100:gb
                        apiHits: 100
                    - accessType: file
                      expiry: 1735689600
                      limits:
                        dataUsage: 10:gb
                    - accessType: sub
                      expiry: 1735689600
                  additionalInfo:
                    name: Miles Davis
                  providerComment: The resource is used for transportation data analysis
                  feedbackToConsumer: This resource can be used for testing purposes
            Request for resource user policy:
              value:
                request:
                - userEmail: abc@xyz.com
                  itemId: b34eb955-c691-4fd3-b200-f18bc78810a2
                  itemType: DATABANK
                  expiryTime: '2022-10-10T04:00:19'
                  constraints:
                    subjects:
                      allowedOrgIds:
                      - <uuid>
                      - <uuid>
                      allowedUserIds:
                      - <uuid>
                      allowedRoles:
                      - consumer
                    access:
                    - accessType: api
                      expiry: 1735689600
                      limits:
                        dataUsage: 100:gb
                        apiHits: 100
                    - accessType: file
                      expiry: 1735689600
                      limits:
                        dataUsage: 10:gb
                    - accessType: sub
                      expiry: 1735689600
    responses:
      '200':
        description: The policy has been successfully created.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/createPolicySuccessResponse
      '400':
        description: '- Missing or malformed data

          - Invalid expiry - dateTime in the past or invalid format

          - Invalid user - UserId is not present in db'
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/createPolicyBadRequest
        headers:
          Content-Type:
            schema:
              type: string
            description: application/json
      '401':
        description: '- Unauthorized - `token` invalid/expired'
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Unauthorized
        headers:
          Content-Type:
            schema:
              type: string
            description: application/json
      '403':
        description: '- If the user trying to set a policy does not have a  `provider` or `delegate` role.

          - If the user is neither the owner of the resource item/group or a delegate to the owner of the resource item/group.'
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/createPolicyForbidden
        headers:
          Content-Type:
            schema:
              type: string
            description: application/json
      '409':
        description: '- If a valid policy already exists.'
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/conflictResponse
    security:
    - authorization: []
    x-codeSamples:
    - lang: cURL
      label: Create policy
      source: "curl --location 'https://${HOSTNAME}/iudx/acl/apd/v2/policy' \\\n--header 'Authorization: Bearer <tokenValue>'\
        \ \\\n--header 'Content-Type: application/json' \\\n--data-raw '{\n  \"request\": [\n    {\n      \"userEmail\": \"\
        consumer@example.com\",\n      \"itemId\": \"5011676f-0835-4cee-9b3e-fe81adab65f1\",\n      \"itemType\": \"DATABANK\"\
        ,\n      \"expiryTime\": \"2026-08-04T20:00:19Z\",\n      \"constraints\": {\n        \"access\": [\n          {\n\
        \            \"accessType\": \"api\",\n            \"expiry\": 1735689600\n          }\n        ]\n      }\n    }\n\
        \  ]\n}'\n"
  get:
    tags:
    - Policies
    summary: Get Policies
    description: 'Get all latest policies associated with a specific user. The response is determined by the user''s roles:


      - If the user is a `provider`, the response includes all policies created by the provider or their delegates.

      - If the user is a `delegate`, the response comprises policies set by the delegate or set for the consumer on whose
      behalf the delegate is acting.

      - If the user is a `consumer`, the response includes policies set for the consumer.


      `Note`: Please note that the response displays the policies for a user concerning a specific server.

      '
    operationId: get-auth-v1-policies
    parameters:
    - name: Authorization
      in: header
      description: DX Auth issued identity token
      required: true
      schema:
        type: string
        minLength: 1
        pattern: Bearer [a-zA-Z0-9_*\-*\.\/]+$|^[a-zA-Z0-9_*\-*\.\/]+$
    responses:
      '200':
        description: Policies have been successfully listed.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/getPolicySuccessResponseWithResourceType
        headers:
          Content-Type:
            schema:
              type: string
            description: application/json
      '401':
        description: Unauthorized - `token` invalid/expired
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Unauthorized
        headers:
          Content-Type:
            schema:
              type: string
            description: application/json
      '404':
        description: Not Found - Policy not found
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/policyNotFound
        headers:
          Content-Type:
            schema:
              type: string
            description: application/json
    security:
    - authorization: []
    x-codeSamples:
    - lang: cURL
      label: get latest policies
      source: 'curl --location --request GET ''https://${HOSTNAME}/iudx/acl/apd/v2/policy'' \

        --header ''Authorization: <tokenValue>''

        '
  put:
    tags:
    - Policies
    summary: Deactivate Policy
    description: '

      This API performs a **soft delete** of an existing ACTIVE policy.


      Instead of permanently removing the policy from the system:


      - The policy status is updated from `ACTIVE` → `DELETE`

      - All access rules associated with the policy are also updated to `DELETE`

      - The policy record is retained for audit and traceability purposes


      ## Who Can Delete


      - The resource `provider`

      - An authorized `delegate` of the provider


      ## Preconditions


      - The policy must exist

      - The policy must belong to the requesting provider/delegate

      - The policy must currently be in `ACTIVE` state


      ## Effects


      - Access granted via this policy is immediately revoked

      - The policy cannot be reactivated via this API (a new policy must be created)


      Users can retrieve the policy ID using the GET Policies API.'
    operationId: deactivate-auth-v1-policies
    parameters:
    - name: Authorization
      in: header
      description: DX Auth issued identity token
      required: true
      schema:
        type: string
        minLength: 1
        pattern: Bearer [a-zA-Z0-9_*\-*\.\/]+$|^[a-zA-Z0-9_*\-*\.\/]+$
    - name: id
      in: query
      description: ID of the DX Entity
      required: true
      schema:
        type: string
        format: uuid
        pattern: ^[0-9a-f]{8}\b-[0-9a-f]{4}\b-[0-9a-f]{4}\b-[0-9a-f]{4}\b-[0-9a-f]{12}$
    responses:
      '200':
        description: Policy deactivated successfully.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/deletePolicy
        headers:
          Content-Type:
            schema:
              type: string
            description: application/json
      '400':
        description: 'Bad Request

          - Id is not a valid policyId

          - Policy has expired

          - Policy was previously deleted'
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/deletePolicyErrorResponse
        headers:
          Content-Type:
            schema:
              type: string
            description: application/json
      '404':
        description: "Not Found\n  - Policy id does not exist"
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/deletePolicyNotFoundErrorResponse
        headers:
          Content-Type:
            schema:
              type: string
            description: application/json
      '401':
        description: "Unauthorized\n  - `token` invalid/expired"
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Unauthorized
        headers:
          Content-Type:
            schema:
              type: string
            description: application/json
    security:
    - authorization: []
    x-codeSamples:
    - lang: cURL
      label: Deactivate policy
      source: 'curl --location --request PUT \

        ''https://${HOSTNAME}/iudx/acl/apd/v2/policy?id=231f6eca-6276-4993-bfeb-53cbbbba6f06'' \

        --header ''Authorization: <tokenValue>''

        '
