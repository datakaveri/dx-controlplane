exampleEntityPotentialApps:
  type: object
  title: AI Use Case Template Schema
  description: Schema for defining structured AI use case templates with sections,
    subsections, and bullet points.
  required:
  - sections
  - name
  - type
  - tags
  - label
  - industry
  - shortDescription
  - description
  - organizationType
  - accessPolicy
  properties:
    sections:
      type: array
      description: Main sections of the use case document
      items:
        type: object
        required:
        - title
        properties:
          title:
            type: string
          content:
            type: string
          points:
            type: array
            items:
              type: string
          subsections:
            type: array
            items:
              type: object
              anyOf:
              - required:
                - subtitle
                - points
              - required:
                - subtitle
                - content
              properties:
                subtitle:
                  type: string
                content:
                  type: string
                points:
                  type: array
                  items:
                    type: string
        anyOf:
        - required:
          - content
        - required:
          - points
        - required:
          - subsections
    name:
      type: string
      maxLength: 512
    type:
      type: array
      items:
        type: string
    tags:
      type: array
      items:
        type: string
    label:
      type: string
      maxLength: 512
    industry:
      type: string
    shortDescription:
      type: string
      maxLength: 3200
    description:
      type: string
      maxLength: 12000
    organizationType:
      type: string
      enum:
      - Private
      - Public
      - Academic Institution
      - NGO/Non-profit
      - Other
      - NA
      - ''
    accessPolicy:
      type: string
      pattern: ^(RESTRICTED|OPEN|PRIVATE)$
  additionalProperties: true
  example:
    '@context': https://agrijson.org
    id: f2c6a437-8109-4a2c-8923-efc2a9e6df1d
    type:
    - adex:Apps
    name: crop-disease-detector-app
    industry: Agriculture
    label: Crop Disease Detection Application
    shortDescription: An AI-powered application to detect crop diseases early using
      leaf imagery.
    description: A potential application designed to detect crop diseases from infected
      leaf images using AI/ML models. It supports early intervention and yield optimization
      by analyzing input data and recommending treatments.
    tags:
    - ai
    - ml
    - model
    - ai-model
    - ml-model
    - machine
    - learning
    - machine learning
    - training
    - algorithm
    organizationType: Private
    sections:
    - title: Problem Statement
      content: Farmers often struggle with late-stage identification of crop diseases,
        leading to reduced yields and delayed treatments.
