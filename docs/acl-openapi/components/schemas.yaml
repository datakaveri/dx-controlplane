exampleEntityAIModel:
  type: object
  title: AI Model entity
  description: An example AI model entity for first-time onboarding (without system-generated
    fields like itemCreatedAt or itemStatus)
  properties:
    '@context':
      type: string
      format: uri
    id:
      type: string
      pattern: ^[a-zA-Z0-9]{8}-[a-zA-Z0-9]{4}-[a-zA-Z0-9]{4}-[a-zA-Z0-9]{4}-[a-zA-Z0-9]{12}$
    name:
      type: string
      pattern: ^[a-zA-Z0-9][a-zA-Z0-9 _\-:,;)(]*$
      maxLength: 512
    type:
      type: array
      items:
        type: string
    label:
      type: string
      maxLength: 512
    shortDescription:
      type: string
      maxLength: 3200
    description:
      type: string
      maxLength: 12000
    tags:
      type: array
      items:
        type: string
    accessPolicy:
      type: string
      pattern: ^(RESTRICTED|OPEN|PRIVATE)$
    organizationType:
      type: string
      enum:
      - Private
      - Public
      - Academic Institution
      - NGO/Non-profit
      - NA
      - ''
    organizationId:
      type: string
      pattern: ^[a-zA-Z0-9]{8}-[a-zA-Z0-9]{4}-[a-zA-Z0-9]{4}-[a-zA-Z0-9]{4}-[a-zA-Z0-9]{12}$
    department:
      type: string
    modelType:
      type: string
    fileFormat:
      type: string
    industry:
      type: string
    license:
      type: string
    fileSize:
      type: string
  required:
  - name
  - type
  - label
  - shortDescription
  - description
  - tags
  - accessPolicy
  - organizationType
  - organizationId
  - modelType
  - fileFormat
  - industry
  - license
  - fileSize
  additionalProperties: true
  example:
    '@context': https://agrijson.org
    id: 337545aa-1fa5-4ca0-bf3d-072144dec5b6
    type:
    - adex:AiModel
    name: ai-model-crop
    label: Test-Crop Disease Detection Model
    shortDescription: Detects diseases in crop leaves using image classification.
    description: A test AI model for detecting crop disease with the help of infected
      leaf images.
    tags:
    - ai
    - ml
    - model
    - ai-model
    - ml-model
    - machine
    - learning
    - machine learning
    - training
    - algorithm
    organizationId: 337545aa-1fa5-4ca0-bf3d-072144dec5b6
    accessPolicy: RESTRICTED
    organizationType: Private
    department: Agriculture and Co-operation
    modelType: ImageClassifier
    fileFormat: ipynb
    industry: Agriculture
    license: MIT
    fileSize: 15MB
