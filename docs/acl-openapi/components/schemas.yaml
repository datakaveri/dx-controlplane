                format: uuid
                minLength: 1
              consumerId:
                type: string
                format: uuid
                minLength: 1
            required:
            - providerId
            - consumerId
          expiryAt:
            type: string
            minLength: 1
          updatedAt:
            type: string
            minLength: 1
          createdAt:
            type: string
            minLength: 1
        required:
        - requestId
        - itemId
        - requestType
        - asset
        - expiryAt
        - updatedAt
        - requestStatus
        - user
        - createdAt
    paginationInfo:
      type: object
      properties:
        page:
          type: integer
          example: 1
        size:
          type: integer
          example: 1
        totalCount:
          type: integer
          example: 346
        totalPages:
          type: integer
          example: 346
        hasNext:
          type: boolean
          example: true
        hasPrevious:
          type: boolean
          example: false
      required:
      - page
      - size
      - totalCount
      - totalPages
      - hasNext
      - hasPrevious
