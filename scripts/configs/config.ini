[postgres]
host = example.io
port = 123
database = example_db
user = example_user
password = example_password
schema =   example_schema
snapshot_table = asset_visibility_snapshot
audit_table = user_activity_audit_log
interactions_table = user_interactions
# Column in the audit log that stores the dataset/asset UUID
audit_asset_col = asset_id
# Column in the audit log that stores the action name ('View' / 'Download')
audit_action_col = action

[elasticsearch]
# Comma-separated list of hosts
hosts = http://example.io:9200
username = example-user
password = example-password
index = example-index
verify_certs = false
